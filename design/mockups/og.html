<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  :root { --w: 1200px; --h: 630px; }
  .og { width: 100%; height: 100%; position: relative; overflow: hidden; color: #fff;
    background: radial-gradient(circle at 85% 15%, rgba(0,207,203,.45), transparent 45%), linear-gradient(135deg, #0b2f55 0%, #0050a0 45%, #0396d9 100%); }
  .og::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 44px 44px; }
  .txt { position: absolute; left: 64px; top: 58px; width: 520px; }
  .logo { background: #fff; border-radius: 18px; padding: 14px 22px; display: inline-block; box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); }
  .logo img { height: 54px; display: block; }
  h1 { font-size: 54px; line-height: 1.05; font-weight: 850; letter-spacing: -.02em; margin-top: 34px; }
  h1 span { color: #7ff3ec; }
  .sub { font-size: 22px; margin-top: 18px; color: #dbeafe; font-weight: 500; }
  .price { display: inline-flex; align-items: center; gap: 12px; margin-top: 30px; background: #fff; color: #0b2f55; border-radius: 99px; padding: 12px 24px 12px 14px; font-size: 22px; font-weight: 800; }
  .price i { background: #25d366; color: #fff; border-radius: 99px; width: 38px; height: 38px; display: grid; place-items: center; font-style: normal; font-size: 18px; }
  .shot { position: absolute; left: 610px; top: 92px; width: 700px; border-radius: 14px; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.25); background: #fff; }
  .shot .bar { height: 22px; background: #f1f5f9; display: flex; gap: 6px; align-items: center; padding: 0 10px; }
  .shot .bar b { width: 9px; height: 9px; border-radius: 9px; background: #f87171; } .shot .bar b:nth-child(2) { background: #fbbf24; } .shot .bar b:nth-child(3) { background: #34d399; }
  .shot img { width: 100%; display: block; }
  .phone { position: absolute; left: 930px; top: 250px; width: 190px; background: #0f172a; border-radius: 30px; padding: 7px; box-shadow: 0 40px 70px -25px rgba(0,0,0,.7); }
  .phone img { width: 100%; display: block; border-radius: 24px; }
</style></head>
<body>
<div class="og">
  <div class="txt">
    <div class="logo"><img src="logo.png" alt=""></div>
    <h1>Clinic &amp; <span>Spa/Salon</span> Management System</h1>
    <div class="sub">99.95% uptime · WhatsApp alerts · AI stock control</div>
    <div class="price"><i>✓</i>From RM 99/month · 3 months FREE</div>
  </div>
  <div class="shot"><div class="bar"><b></b><b></b><b></b></div><img src="../../public/images/screens/clinic-dashboard.webp" alt=""></div>
  <div class="phone"><img src="../../public/images/screens/whatsapp-appointment-reminder.webp" alt=""></div>
</div>
</body></html>
