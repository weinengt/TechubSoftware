<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  :root { --w: 1200px; --h: 630px; }
  .og { width: 100%; height: 100%; position: relative; overflow: hidden; color: #fff;
    background: radial-gradient(circle at 85% 15%, rgba(0,207,203,.45), transparent 45%), linear-gradient(135deg, #0b2f55 0%, #0050a0 45%, #0396d9 100%); }
  .og::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 44px 44px; }
  .txt { position: absolute; left: 64px; top: 56px; width: 540px; }
  .logo { background: #fff; border-radius: 18px; padding: 14px 22px; display: inline-block; box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); }
  .logo img { height: 52px; display: block; }
  h1 { font-size: 56px; line-height: 1.04; font-weight: 850; letter-spacing: -.02em; margin-top: 30px; }
  h1 span { color: #7ff3ec; }
  .types { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
  .types b { font-size: 19px; font-weight: 700; padding: 7px 15px; border-radius: 99px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); }
  .price { display: inline-flex; align-items: center; gap: 12px; margin-top: 26px; background: #fff; color: #0b2f55; border-radius: 99px; padding: 12px 24px 12px 14px; font-size: 22px; font-weight: 800; }
  .price i { background: #25d366; color: #fff; border-radius: 99px; width: 38px; height: 38px; display: grid; place-items: center; font-style: normal; font-size: 18px; }
  .ipad { position: absolute; left: 640px; top: 100px; width: 640px; background: #0f172a; border-radius: 28px; padding: 14px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.65); }
  .ipad img { width: 100%; display: block; border-radius: 12px; }
  .phone { position: absolute; left: 590px; top: 300px; width: 170px; background: #0f172a; border-radius: 28px; padding: 6px; box-shadow: 0 40px 70px -25px rgba(0,0,0,.7); }
  .phone img { width: 100%; display: block; border-radius: 22px; }
</style></head>
<body>
<div class="og">
  <div class="txt">
    <div class="logo"><img src="logo.png" alt=""></div>
    <h1><span>Appointment</span> Management System</h1>
    <div class="types"><b>Clinic</b><b>Hair Salon</b><b>Beauty</b><b>Spa</b></div>
    <div class="price"><i>✓</i>From RM 99/month · 3 months FREE</div>
  </div>
  <div class="ipad"><img src="../../public/images/screens/salon-appointment-calendar-ipad.webp" alt=""></div>
  <div class="phone"><img src="../../public/images/screens/whatsapp-appointment-reminder-salon.webp" alt=""></div>
</div>
</body></html>
