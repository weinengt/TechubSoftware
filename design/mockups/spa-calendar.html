<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  :root { --w: 1200px; --h: 750px; --hour: 58px; }
  .seg { display: flex; background: #f1f5f9; border-radius: 9px; padding: 3px; }
  .seg span { font-size: 11.5px; font-weight: 600; padding: 6px 12px; border-radius: 7px; color: var(--muted); }
  .seg span.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .datenav { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; margin-left: 14px; }
  .datenav .btn { height: 30px; padding: 0 8px; }
  .legend { display: flex; gap: 14px; align-items: center; font-size: 11.5px; color: var(--ink2); font-weight: 500; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
  .cal { flex: 1; min-height: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .cols { display: grid; grid-template-columns: 56px repeat(5, 1fr); border-bottom: 1px solid var(--line); }
  .colh { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-left: 1px solid var(--line); }
  .colh .av { width: 30px; height: 30px; font-size: 11px; }
  .colh b { font-size: 12.5px; display: block; } .colh small { font-size: 10.5px; color: var(--muted); }
  .colh .load { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--brand); background: var(--brand-50); padding: 2px 7px; border-radius: 99px; }
  .body { position: relative; display: grid; grid-template-columns: 56px repeat(5, 1fr); flex: 1; }
  .times div { height: var(--hour); font-size: 10.5px; color: var(--muted); text-align: right; padding-right: 8px; transform: translateY(-6px); }
  .lane { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(180deg, transparent 0, transparent calc(var(--hour) - 1px), #eef2f7 calc(var(--hour) - 1px), #eef2f7 var(--hour)); }
  .ev { position: absolute; left: 5px; right: 5px; border-radius: 8px; padding: 6px 8px; font-size: 11px; overflow: hidden; border-left: 3px solid; }
  .ev b { display: block; font-size: 11.5px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .t { font-size: 10px; font-weight: 600; opacity: .8; }
  .ev .s { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .ev .tags { display: flex; gap: 4px; margin-top: 4px; }
  .ev .tags span { font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 5px; background: rgba(255,255,255,.75); }
  .facial { background: #e6fbf9; border-color: #14b8a6; color: #0f766e; }
  .massage { background: #e8f4fd; border-color: #0396d9; color: #036295; }
  .hair { background: #f3efff; border-color: #8b5cf6; color: #6d28d9; }
  .nails { background: #fdedf5; border-color: #ec4899; color: #be185d; }
  .pkg { background: #fff6e5; border-color: #f59e0b; color: #b45309; }
  .nowline { position: absolute; left: 50px; right: 0; height: 2px; background: #ef4444; z-index: 5; }
  .nowline::before { content: ""; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 9px; background: #ef4444; }
  .nowline span { position: absolute; left: -50px; top: -8px; font-size: 10px; font-weight: 700; color: #fff; background: #ef4444; border-radius: 5px; padding: 1px 5px; }
</style></head>
<body>
<div class="app">
  <aside class="side" data-shell="spa" data-active="Calendar"></aside>
  <section class="main">
    <header class="top">
      <h1>Calendar</h1>
      <div class="datenav"><span class="btn"><i data-i="chevL"></i></span>Today · Tue, 13 Oct 2026<span class="btn"><i data-i="chevR"></i></span></div>
      <div class="seg" style="margin-left:auto"><span class="on">Day</span><span>Week</span><span>Month</span></div>
      <span class="btn"><i data-i="users"></i>All staff<i data-i="chevD"></i></span>
      <span class="btn pri"><i data-i="plus"></i>New Booking</span>
    </header>
    <div class="content" style="gap:10px">
      <div class="legend">
        <span><i style="background:#14b8a6"></i>Facial</span><span><i style="background:#0396d9"></i>Massage</span><span><i style="background:#8b5cf6"></i>Hair</span><span><i style="background:#ec4899"></i>Nails &amp; Lashes</span><span><i style="background:#f59e0b"></i>Packages</span>
        <span style="margin-left:auto" class="chip g">✓ 31 of 33 confirmed on WhatsApp</span>
        <span class="chip b">Utilisation 86%</span>
      </div>
      <div class="cal">
        <div class="cols" id="heads"><div></div></div>
        <div class="body" id="body"><div class="times" id="times"></div></div>
      </div>
    </div>
  </section>
</div>
<script>
  const start = 10, end = 19;
  const H = Math.floor(document.getElementById("body").clientHeight / (end - start));
  document.documentElement.style.setProperty("--hour", H + "px");
  const staff = [
    ["ML", "Mei Ling", "Facial", "#14b8a6"], ["AS", "Aisyah", "Massage", "#0396d9"],
    ["KL", "Kelly", "Hair stylist", "#8b5cf6"], ["NA", "Nadia", "Nails & lashes", "#ec4899"], ["VIP", "VIP Suite", "Couple room", "#f59e0b"],
  ];
  const ev = [
    [0, 10, 1, "facial", "Priya Devi", "Signature Facial", ["WA ✓", "Pkg 4/10"]],
    [0, 11.5, 1, "facial", "Chloe Tan", "Hydra Facial", ["WA ✓"]],
    [0, 14, 1.5, "facial", "Farah Hanim", "Acne Treatment Facial", ["WA ✓"]],
    [0, 16, 1, "facial", "Grace Lee", "Eye Treatment", ["WA ✓"]],
    [0, 17.5, 1, "facial", "Walk-in", "Express Facial", ["Walk-in"]],
    [1, 10.5, 1.5, "massage", "Nur Izzati", "Balinese Massage 90 min", ["WA ✓"]],
    [1, 13, 1, "massage", "Kumar S.", "Back & Shoulder", ["WA ✓"]],
    [1, 14.5, 2, "pkg", "Michelle Ong", "Spa Day Package", ["Pkg 2/5", "WA ✓"]],
    [1, 17, 1, "massage", "Siti Rahmah", "Foot Reflexology", ["Reminder sent"]],
    [2, 10, 0.75, "hair", "Daniel Wong", "Men's Haircut", ["WA ✓"]],
    [2, 11, 2, "hair", "Joanne Lim", "Colour & Treatment", ["WA ✓"]],
    [2, 14, 2.5, "hair", "Amanda Koh", "Keratin Treatment", ["WA ✓", "Deposit paid"]],
    [2, 17, 1, "hair", "Lisa Chan", "Wash & Blow", ["Reminder sent"]],
    [3, 10.5, 1, "nails", "Rachel Goh", "Gel Manicure", ["WA ✓"]],
    [3, 12, 1.5, "nails", "Tan Hui Min", "Lash Extension", ["WA ✓"]],
    [3, 15, 1, "nails", "Aina Zulkifli", "Gel Pedicure", ["WA ✓"]],
    [3, 16.5, 1, "nails", "Sharon Ng", "Nail Art", ["WA ✓"]],
    [4, 11, 2, "pkg", "Mr & Mrs Lee", "Couple Massage 120 min", ["Anniversary", "WA ✓"]],
    [4, 14.5, 2.5, "pkg", "Bridal Party (4)", "Bridal Glow Package", ["Deposit paid"]],
  ];
  const fmt = (h) => { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); const ap = hh >= 12 ? "pm" : "am"; return `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, "0")}${ap}`; };
  const heads = document.getElementById("heads"), body = document.getElementById("body"), times = document.getElementById("times");
  for (let h = start; h < end; h++) times.insertAdjacentHTML("beforeend", `<div>${h === start ? "" : fmt(h).replace(":00", "")}</div>`);
  staff.forEach(([ini, name, role, col], i) => {
    const n = ev.filter((e) => e[0] === i).length;
    heads.insertAdjacentHTML("beforeend", `<div class="colh"><span class="av" style="background:${col}">${ini}</span><div><b>${name}</b><small>${role}</small></div><span class="load">${n}</span></div>`);
    const lane = document.createElement("div"); lane.className = "lane"; body.appendChild(lane);
    ev.filter((e) => e[0] === i).forEach(([, s, d, cls, who, what, tags]) => {
      lane.insertAdjacentHTML("beforeend", `<div class="ev ${cls}" style="top:${(s - start) * H + 2}px;height:${d * H - 4}px">
        <span class="t">${fmt(s)} – ${fmt(s + d)}</span><b>${who}</b>${d >= 1 ? `<span class="s">${what}</span>` : ""}
        ${d >= 1.5 ? `<div class="tags">${tags.map((t) => `<span>${t}</span>`).join("")}</div>` : ""}</div>`);
    });
  });
  body.insertAdjacentHTML("beforeend", `<div class="nowline" style="top:${(11.33 - start) * H}px"><span>11:20</span></div>`);
</script>
<script src="shell.js"></script>
<script src="icons.js"></script>
</body></html>
