<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Monthly report overview. ?v=clinic (default) | salon | beauty | spa */
  :root { --w: 1024px; --h: 720px; }
  .top { gap: 10px; }
  .speed { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 4px; border-radius: 99px; white-space: nowrap;
    background: linear-gradient(135deg, #ecfdf5, #d1fae5); border: 1px solid #a7f3d0; color: #047857; font-size: 12px; font-weight: 600; }
  .speed .bolt { width: 22px; height: 22px; border-radius: 99px; background: linear-gradient(135deg, #f59e0b, #fbbf24); display: grid; place-items: center; box-shadow: 0 2px 6px -2px rgba(217,119,6,.7); }
  .speed .bolt svg { width: 13px; height: 13px; fill: #fff; stroke: none; }
  .speed b { font-weight: 800; color: #065f46; }
  .speed em { font-style: normal; font-weight: 500; color: #059669; }
  .btn svg { width: 15px; height: 15px; }
  .content { gap: 12px; }
  /* Filters */
  .fbar { display: flex; align-items: center; gap: 8px; }
  .seg { display: flex; background: #e9eef5; border-radius: 9px; padding: 3px; }
  .seg span { font-size: 11.5px; font-weight: 600; padding: 6px 11px; border-radius: 7px; color: var(--muted); white-space: nowrap; }
  .seg span.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .fl { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font-size: 12px; font-weight: 650; color: var(--ink); white-space: nowrap; }
  .fl svg { width: 15px; height: 15px; color: var(--muted); }
  .fl small { font-size: 11px; color: var(--muted); font-weight: 500; }
  /* KPI row */
  .stat { padding: 9px 12px; gap: 11px; }
  .stat .ic { width: 36px; height: 36px; }
  .ic.p { background: #fdf2f8; color: #db2777; } .ic.t { background: #f0fdfa; color: #0d9488; }
  .stat .v { font-size: 19px; white-space: nowrap; }
  .stat .d { white-space: nowrap; }
  .stat .d.n { color: var(--muted); font-weight: 500; }
  /* Cards */
  .r { display: flex; gap: 12px; flex: 1; min-height: 0; }
  .r.fit { flex: 0 0 auto; }
  .cc { display: flex; flex-direction: column; min-height: 0; }
  .aside { width: 306px; flex-shrink: 0; }
  .card h3 small { font-size: 11px; color: var(--muted); font-weight: 500; }
  .lg { margin-left: auto; display: flex; gap: 12px; font-size: 11px; font-weight: 500; color: var(--ink2); white-space: nowrap; }
  .lg span { display: inline-flex; align-items: center; gap: 5px; }
  .lg i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .plot { flex: 1; min-height: 0; position: relative; margin-top: 6px; }
  .plot svg { position: absolute; inset: 0; display: block; }
  .plot text { font-family: Inter, sans-serif; font-size: 10px; fill: #94a3b8; }
  .tip { position: absolute; z-index: 2; background: #0f172a; color: #cbd5e1; border-radius: 7px; padding: 4px 8px; font-size: 10.5px; font-weight: 500; line-height: 15px; white-space: nowrap; box-shadow: 0 8px 18px -8px rgba(15,23,42,.6); }
  .tip b { color: #fff; font-weight: 700; }
  .tip::after { content: ""; position: absolute; left: var(--cx); bottom: -4px; width: 8px; height: 8px; margin-left: -4px; background: #0f172a; transform: rotate(45deg); border-radius: 1px; }
  /* Donut */
  .dn { flex: 1; display: flex; align-items: center; gap: 12px; min-height: 0; }
  .ring { position: relative; flex-shrink: 0; }
  .ring svg { display: block; transform: rotate(-90deg); }
  .ring .ct { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .ct b { font-size: 15px; font-weight: 800; letter-spacing: -.02em; display: block; }
  .ring .ct small { font-size: 10px; color: var(--muted); font-weight: 500; }
  .dl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
  .dl div { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink2); white-space: nowrap; }
  .dl i { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .dl span { margin-left: auto; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .note { display: flex; align-items: center; gap: 8px; background: #f8fafc; border: 1px solid #eef2f7; border-radius: 9px; padding: 7px 10px; font-size: 11.5px; color: var(--ink2); white-space: nowrap; }
  .note svg { width: 15px; height: 15px; color: var(--brand); }
  .note small { font-size: 10.5px; color: var(--muted); }
  .note b { margin-left: auto; font-weight: 750; color: var(--ink); }
  /* Room occupancy columns (spa) */
  .cols { flex: 1; display: flex; align-items: flex-end; gap: 12px; padding: 0 2px; min-height: 0; margin-top: 10px; }
  .col { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; min-width: 0; }
  .col b { font-size: 11.5px; font-weight: 700; }
  .col .tr { width: 22px; flex: 1; border-radius: 6px; background: var(--brand-50); display: flex; align-items: flex-end; overflow: hidden; }
  .col .tr i { display: block; width: 100%; border-radius: 5px 5px 0 0; background: linear-gradient(180deg, #2fb1e6, #0396d9); }
  .col small { font-size: 10px; color: var(--muted); font-weight: 600; text-align: center; line-height: 12px; height: 24px; width: 100%; }
  /* Breakdown table */
  .tb { padding: 0; overflow: hidden; }
  .tb h3 { padding: 12px 14px 10px; }
  .tb td, .tb th { padding: 6px 8px; }
  .tb td:first-child, .tb th:first-child { padding-left: 14px; } .tb td:last-child, .tb th:last-child { padding-right: 14px; }
  .tb th.num { text-align: right; }
  .who { display: flex; align-items: center; gap: 9px; }
  .who .av { width: 27px; height: 27px; font-size: 10px; }
  .who b { display: block; line-height: 15px; } .who small { line-height: 13px; margin-top: 0; }
  .tb tr.tot td { background: #f8fafc; border-bottom: 0; color: var(--ink); font-weight: 700; }
  .meter { display: inline-flex; align-items: center; gap: 7px; justify-content: flex-end; }
  .meter u { width: 46px; height: 6px; border-radius: 9px; background: var(--brand-50); overflow: hidden; display: inline-block; }
  .meter u i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, #0396d9, #00cfcb); }
  .tfoot { margin-top: auto; display: flex; align-items: center; padding: 8px 14px 10px; font-size: 11px; color: var(--muted); border-top: 1px solid #eef2f7; }
  .tfoot .more { margin-left: auto; color: var(--brand); font-weight: 600; }
  /* Ranked list */
  .rk { flex: 1; display: flex; flex-direction: column; justify-content: space-between; margin-top: 10px; min-height: 0; }
  .ri { display: flex; align-items: center; gap: 10px; }
  .ri .no { width: 20px; height: 20px; border-radius: 6px; background: #f1f5f9; color: var(--ink2); font-size: 10.5px; font-weight: 750; display: grid; place-items: center; flex-shrink: 0; }
  .ri .no.t { background: var(--brand-100); color: #036295; }
  .ri .bd { flex: 1; min-width: 0; }
  .ri .ln { display: flex; align-items: baseline; gap: 6px; font-size: 12px; white-space: nowrap; }
  .ri .ln b { font-weight: 650; overflow: hidden; text-overflow: ellipsis; }
  .ri .ln small { font-size: 10.5px; color: var(--muted); }
  .ri .ln span { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ri .br { height: 6px; border-radius: 9px; background: #f1f5f9; margin-top: 5px; overflow: hidden; }
  .ri .br i { display: block; height: 100%; border-radius: 9px; background: #0396d9; }
</style></head>
<body>
<div class="app">
  <aside class="side" data-shell="clinic" data-active="Reports"></aside>
  <section class="main">
    <header class="top">
      <div><div class="sub" id="biz"></div><h1 id="title"></h1></div>
      <span class="speed" id="speed"></span>
      <span class="btn" style="margin-left:auto"><i data-i="file"></i>PDF</span>
      <span class="btn"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 9v12"/></svg>Excel</span>
      <span class="btn pri"><i data-i="print"></i>Print report</span>
    </header>
    <div class="content">
      <div class="fbar">
        <div class="seg" id="tabs"></div>
        <span class="fl" style="margin-left:auto"><i data-i="cal"></i>1 – 30 Sep 2026<i data-i="chevD"></i></span>
        <span class="fl"><small>vs</small>Aug 2026</span>
        <span class="fl"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 9l1.6-5h13.8l1.6 5"/><path d="M3.5 9a2.8 2.8 0 005.6 0 2.8 2.8 0 005.8 0 2.8 2.8 0 005.6 0"/><path d="M5 12.5V20h14v-7.5"/><path d="M10 20v-4.5h4V20"/></svg><span id="branch"></span><i data-i="chevD"></i></span>
      </div>
      <div class="stats" id="stats"></div>
      <div class="r">
        <div class="card grow cc"><h3 id="chartH"></h3><div class="plot" id="plot"></div></div>
        <div class="card aside cc" id="small"></div>
      </div>
      <div class="r fit">
        <div class="card grow cc tb" id="table"></div>
        <div class="card aside cc" id="rank"></div>
      </div>
    </div>
  </section>
</div>
<script>
  const q = new URLSearchParams(location.search).get("v");
  const V = ["clinic", "salon", "beauty", "spa"].includes(q) ? q : "clinic";
  const COL = { blue: "#0396d9", violet: "#8b5cf6", teal: "#14b8a6", amber: "#f59e0b", pink: "#ec4899", slate: "#475569" };
  const rm = (n, d = 0) => "RM " + n.toLocaleString("en-MY", { minimumFractionDigits: d, maximumFractionDigits: d });
  const int = (n) => n.toLocaleString("en-MY");

  // Report data for September 2026 (both branches). Daily figures are generated from a weekly
  // pattern and then scaled so they add up exactly to the totals shown in the KPI cards.
  // week: weights Sun..Sat. hol: Malaysia Day (Wed 16 Sep). pay: month-end payday lift.
  const D = {
    clinic: {
      biz: "Demo Clinic", title: "Clinic Report", ms: 86, recs: "24,618",
      tabs: ["Overview", "Patients", "Doctors", "Pharmacy", "Panel claims"],
      branch: "All branches · 2",
      kpi: [["users", "b", "Patients seen", "3,184", "▲ 9% vs Aug"], ["steth", "v", "Consultations", "RM 196,420", "▲ 7% vs Aug"],
        ["pill", "g", "Pharmacy sales", "RM 128,760", "▲ 12% vs Aug"], ["money", "a", "Collections", "RM 325,180", "▲ 10% vs Aug"]],
      chart: { title: "Daily revenue", series: [["Consultations", 196420, "blue"], ["Pharmacy", 128760, "violet"]],
        week: [0.45, 1.3, 1.08, 1.02, 1.0, 1.04, 0.86], hol: 0.42, pay: 1, seed: 7 },
      small: { type: "donut", title: "Collections by payer", center: ["RM 325k", "collected"],
        seg: [["Self-pay", 175600, "teal"], ["Panel companies", 94300, "amber"], ["Insurance", 42280, "pink"], ["Others", 13000, "slate"]],
        note: ["file", "Panel claims pending", "42", "RM 18,240"] },
      table: { title: "Revenue by doctor", cols: ["Doctor", "Patients", "Consultations", "Pharmacy", "Total", "Per patient"],
        rows: [["LW", "#0396d9", "Dr. Lim Wei Jie", "KL · GP", 968, 61240, 40180], ["AI", "#8b5cf6", "Dr. Aisyah", "KL · GP", 842, 51380, 34860],
          ["AM", "#14b8a6", "Dr. Arjun Menon", "PJ · GP", 734, 45620, 29140], ["TS", "#ec4899", "Dr. Tan Su Lin", "PJ · GP", 640, 38180, 24580]] },
      rank: { title: "Top diagnoses", by: "Visits", rows: [["Upper respiratory infection", "J06.9", 642], ["Fever", "R50.9", 398],
        ["Hypertension", "I10", 356], ["Type 2 diabetes", "E11.9", 312], ["Gastritis", "K29.7", 228]] },
    },
    salon: {
      biz: "Demo Hair Salon", title: "Sales Report", ms: 64, recs: "11,206",
      tabs: ["Overview", "Sales", "Stylists", "Services", "Customers"],
      branch: "All branches · 2",
      kpi: [["money", "b", "Total sales", "RM 86,420", "▲ 11% vs Aug"], ["scissors", "v", "Services", "RM 72,960", "84% of sales"],
        ["tag", "p", "Retail products", "RM 13,460", "▲ 18% vs Aug"], ["percent", "g", "Commission", "RM 7,969", "Auto from POS sales"]],
      chart: { title: "Daily sales", series: [["Services", 72960, "blue"], ["Retail", 13460, "pink"]],
        week: [1.38, 0.66, 0.72, 0.78, 0.84, 1.08, 1.5], hol: 1.32, pay: 1.12, seed: 3 },
      small: { type: "donut", title: "Service mix", center: ["RM 73.0k", "services"],
        seg: [["Cut & Style", 29180, "blue"], ["Colour", 20430, "violet"], ["Treatment", 10940, "teal"], ["Rebond & Perm", 12410, "amber"]],
        note: ["card", "Average bill", "1,184 bills", "RM 73"] },
      table: { title: "Sales by stylist", cols: ["Stylist", "Services", "Retail", "Total sales", "Commission"], note: "· top 5 of 9",
        rows: [["JT", "#0396d9", "Jason Tan", "Senior Stylist", 21840, 2960], ["MF", "#8b5cf6", "Mei Fen", "Colourist", 19460, 1820],
          ["RV", "#0b2f55", "Ravi", "Barber", 9420, 1140], ["AM", "#14b8a6", "Aiman", "Junior Stylist", 7380, 1260], ["AR", "#ec4899", "Amir", "Junior Stylist · Cheras", 6920, 980]] },
      rank: { title: "Top services", by: "Revenue", rows: [["Women's Cut & Blow", "286×", 21450], ["Colour Retouch", "98×", 14700],
        ["Rebonding", "34×", 10880], ["Keratin Treatment", "22×", 8360], ["Men's Haircut", "168×", 6384]] },
    },
    beauty: {
      biz: "Demo Beauty Centre", title: "Sales Report", ms: 72, recs: "13,940",
      tabs: ["Overview", "Sales", "Packages", "Beauticians", "Customers"],
      branch: "All branches · 2",
      kpi: [["money", "b", "Total sales", "RM 94,860", "▲ 13% vs Aug"], ["gift", "v", "Package sales", "RM 41,280", "52 packages sold"],
        ["check", "g", "Sessions redeemed", "486", "▲ 11% vs Aug"], ["users", "a", "New customers", "68", "▲ 21% vs Aug"]],
      chart: { title: "Daily sales", series: [["Treatments & retail", 53580, "blue"], ["Package sales", 41280, "violet"]],
        week: [1.3, 0.72, 0.84, 0.86, 0.9, 1.02, 1.42], hol: 1.25, pay: 1.15, seed: 11, lumpy: 1 },
      small: { type: "donut", title: "Sessions by category", center: ["1,284", "sessions"],
        seg: [["Facial", 591, "teal"], ["Slimming & Body", 231, "amber"], ["Lash & Brow", 282, "pink"], ["Nails & others", 180, "slate"]],
        note: ["gift", "Paid by package", "486 sessions", "38%"] },
      table: { title: "Sales by beautician", cols: ["Beautician", "Sessions", "Packages", "Sales", "Commission"], note: "· top 5 of 8",
        rows: [["ML", "#14b8a6", "Mei Ling", "Facial Specialist", 286, 14, 24620], ["NA", "#ec4899", "Nadia", "Lash & Brow", 218, 9, 18940],
          ["KV", "#f59e0b", "Kavitha", "Slimming & Body", 196, 12, 17860], ["YT", "#0396d9", "Yvonne Tan", "Facial · Puchong", 168, 8, 13460], ["HM", "#8b5cf6", "Hui Min", "Nail Technician", 174, 4, 9280]] },
      rank: { title: "Top treatments", by: "Sessions", rows: [["Hydra Facial", "", 214], ["Lash Extension", "", 126],
        ["Slimming Wrap", "", 118], ["Acne Facial", "", 104], ["Brow Shape & Tint", "", 74]] },
    },
    spa: {
      biz: "Demo Day Spa", title: "Spa Report", ms: 91, recs: "15,382",
      tabs: ["Overview", "Sales", "Therapists", "Rooms", "Packages"],
      branch: "All branches · 2",
      kpi: [["money", "b", "Total sales", "RM 118,640", "▲ 9% vs Aug"], ["users", "v", "Therapist utilisation", "82%", "▲ 5 pts vs Aug"],
        ["bed", "a", "Room occupancy", "76%", "▲ 4 pts vs Aug"], ["gift", "g", "Packages & members", "64 sold", "RM 46,720"]],
      chart: { title: "Daily sales", series: [["Treatments & retail", 71920, "blue"], ["Packages & memberships", 46720, "violet"]],
        week: [1.42, 0.68, 0.74, 0.8, 0.86, 1.12, 1.52], hol: 1.36, pay: 1.12, seed: 5, lumpy: 1 },
      small: { type: "rooms", title: "Room occupancy", rows: [["Couple Suite", 88], ["Room 2", 84], ["Room 1", 79], ["Room 3", 72], ["Foot Spa", 57]] },
      table: { title: "Therapist performance", cols: ["Therapist", "Treatments", "Utilisation", "Sales", "Commission"], note: "· top 5 of 7",
        rows: [["AS", "#0396d9", "Aisyah", "Senior Therapist", 142, 91, 24860], ["LK", "#8b5cf6", "Lakshmi", "Therapist", 128, 86, 21540],
          ["WT", "#14b8a6", "Wati", "Therapist", 124, 83, 19980], ["WN", "#f59e0b", "Wani", "Therapist", 116, 78, 17420], ["NR", "#ec4899", "Noraini", "Therapist", 104, 72, 15760]] },
      rank: { title: "Top treatments", by: "Bookings", rows: [["Balinese Massage 90 min", "", 196], ["Foot Reflexology 60 min", "", 172],
        ["Hot Stone Massage 90 min", "", 128], ["Aromatherapy Massage", "", 112], ["Couple Spa Package", "", 46]] },
    },
  }[V];

  const $ = (id) => document.getElementById(id);
  $("biz").textContent = `${D.biz} · Reports`;
  $("title").textContent = D.title;
  $("branch").textContent = D.branch;
  $("speed").innerHTML = `<span class="bolt"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></span>Generated in <b>${D.ms} ms</b><em>· ${D.recs} records</em>`;
  $("tabs").innerHTML = D.tabs.map((t, i) => `<span class="${i ? "" : "on"}">${t}</span>`).join("");
  $("stats").innerHTML = D.kpi.map(([ic, c, k, v, d]) =>
    `<div class="stat"><span class="ic ${c}"><i data-i="${ic}"></i></span><div><div class="k">${k}</div><div class="v">${v}</div><div class="d${d.startsWith("▲") ? "" : " n"}">${d}</div></div></div>`).join("");

  // ---------- Daily figures ----------
  const N = 30, DOW0 = 2; // 1 Sep 2026 is a Tuesday
  let seed = D.chart.seed;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const shape = (lumpy) => Array.from({ length: N }, (_, i) => {
    let w = D.chart.week[(DOW0 + i) % 7];
    if (i === 15) w = D.chart.hol; // 16 Sep, Malaysia Day
    if (i >= 24) w *= D.chart.pay; // after payday
    const noise = lumpy ? 0.45 + rnd() * 1.1 : 0.88 + rnd() * 0.24;
    return w * noise;
  });
  const fit = (arr, total) => { // scale to an exact whole-ringgit total
    const s = arr.reduce((a, b) => a + b, 0), out = arr.map((x) => Math.round((x / s) * total));
    out[N - 1] += total - out.reduce((a, b) => a + b, 0);
    return out;
  };
  const S = D.chart.series.map(([, total], k) => fit(shape(k === 1 && D.chart.lumpy), total));

  const step = (m) => { const p = 10 ** Math.floor(Math.log10(m)), f = m / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; };
  const k = (v) => (v >= 1000 ? `${+(v / 1000).toFixed(1)}k` : `${v}`);
  const day = (i) => { const d = (DOW0 + i) % 7; return `${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][d]}, ${i + 1} Sep`; };

  $("chartH").innerHTML = `<i data-i="chart" style="color:#0396d9"></i>${D.chart.title} <small>RM · 1–30 Sep</small>
    <span class="lg">${D.chart.series.map(([n, , c]) => `<span><i style="background:${COL[c]}"></i>${n}</span>`).join("")}</span>`;

  function drawBars() {
    const el = $("plot"), W = el.clientWidth, H = el.clientHeight;
    const L = 34, R = 2, T = 8, B = 20, pw = W - L - R, ph = H - T - B;
    const tot = S[0].map((v, i) => v + S[1][i]);
    const top = Math.max(...tot), peak = tot.indexOf(top), st = step(top / 3.4);
    // Hover state on the busiest day: measure the tooltip first, then leave room for it above that bar
    const tip = document.createElement("div");
    tip.className = "tip";
    tip.innerHTML = `${day(peak)} · <b>${rm(tot[peak])}</b>`;
    el.appendChild(tip);
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let max = Math.ceil((top * 1.04) / st) * st;
    while (T + ph * (1 - top / max) - 8 - th < 0) max += st; // the label sits above the tallest bar, inside the plot
    const y = (v) => T + ph - (v / max) * ph;
    const band = pw / N, bw = Math.min(13, band * 0.6);
    let g = "";
    for (let i = 0; i < N; i++) if ((DOW0 + i) % 7 === 6) g += `<rect x="${L + i * band}" y="${T}" width="${Math.min(2, N - i) * band}" height="${ph}" fill="#f7f9fc"/>`;
    g += `<rect x="${L + peak * band + 1}" y="${y(top) - 4}" width="${band - 2}" height="${y(0) - y(top) + 4}" rx="4" fill="#e3f2fb"/>`;
    for (let v = 0; v <= max + 0.1; v += st) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? "#eef2f7" : "#dfe6ee"}" stroke-width="1"/><text x="${L - 7}" y="${y(v) + 3.5}" text-anchor="end">${k(v)}</text>`;
    const cap = (x, yb, w, h) => { const r = Math.min(4, h, w / 2); return `M${x} ${yb}V${yb - h + r}Q${x} ${yb - h} ${x + r} ${yb - h}H${x + w - r}Q${x + w} ${yb - h} ${x + w} ${yb - h + r}V${yb}Z`; };
    for (let i = 0; i < N; i++) {
      const x = L + i * band + (band - bw) / 2, y0 = y(0), y1 = y(S[0][i]), y2 = y(tot[i]);
      g += `<rect x="${x}" y="${y1}" width="${bw}" height="${y0 - y1}" fill="${COL[D.chart.series[0][2]]}"/>`;
      if (y1 - 2 - y2 > 1.5) g += `<path d="${cap(x, y1 - 2, bw, y1 - 2 - y2)}" fill="${COL[D.chart.series[1][2]]}"/>`;
      if (i % 7 === 0) g += `<text x="${L + i * band + band / 2}" y="${H - 5}" text-anchor="middle">${i + 1} Sep</text>`;
    }
    el.insertAdjacentHTML("afterbegin", `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`);
    const cx = L + peak * band + band / 2, left = Math.max(L, Math.min(W - R - tw, cx - tw / 2));
    tip.style.left = `${left}px`;
    tip.style.top = `${y(top) - 8 - th}px`;
    tip.style.setProperty("--cx", `${cx - left}px`);
  }


  // ---------- Second small chart ----------
  const sm = D.small;
  if (sm.type === "donut") {
    const tot = sm.seg.reduce((t, s) => t + s[1], 0);
    const size = 116, th = 14, r = (size - th) / 2, c = 2 * Math.PI * r;
    let off = 0;
    const arcs = sm.seg.map(([, v, col]) => { const len = (v / tot) * c; const a = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${COL[col]}" stroke-width="${th}" stroke-dasharray="${(len - 2).toFixed(2)} ${c.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`; off += len; return a; }).join("");
    const pct = (v) => Math.round((v / tot) * 100);
    const money = sm.center[0].startsWith("RM");
    $("small").innerHTML = `<h3><i data-i="${money ? "money" : "spark"}" style="color:#0396d9"></i>${sm.title}</h3>
      <div class="dn"><div class="ring"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}</svg><div class="ct"><b>${sm.center[0]}</b><small>${sm.center[1]}</small></div></div>
      <div class="dl">${sm.seg.map(([n, v, col]) => `<div><i style="background:${COL[col]}"></i>${n}<span>${pct(v)}%</span></div>`).join("")}</div></div>
      <div class="note"><i data-i="${sm.note[0]}"></i><span>${sm.note[1]} <small>· ${sm.note[2]}</small></span><b>${sm.note[3]}</b></div>`;
  } else {
    $("small").innerHTML = `<h3><i data-i="bed" style="color:#0396d9"></i>${sm.title}<small style="margin-left:auto">avg ${Math.round(sm.rows.reduce((t, r) => t + r[1], 0) / sm.rows.length)}%</small></h3>
      <div class="cols" id="cols">${sm.rows.map(([n, p]) => `<div class="col"><b>${p}%</b><span class="tr"><i style="height:${p}%"></i></span><small>${n}</small></div>`).join("")}</div>`;
  }

  // ---------- Breakdown table ----------
  const t = D.table;
  const who = (ini, c, n, s) => `<div class="who"><span class="av" style="background:${c}">${ini}</span><div><b>${n}</b><small>${s}</small></div></div>`;
  let rows = "";
  if (V === "clinic") {
    const sum = [0, 0, 0];
    rows = t.rows.map(([ini, c, n, s, p, cs, ph]) => { sum[0] += p; sum[1] += cs; sum[2] += ph;
      return `<tr><td>${who(ini, c, n, s)}</td><td class="num">${int(p)}</td><td class="num">${rm(cs)}</td><td class="num">${rm(ph)}</td><td class="num"><b>${rm(cs + ph)}</b></td><td class="num">${rm(Math.round((cs + ph) / p))}</td></tr>`; }).join("") +
      `<tr class="tot"><td>All doctors</td><td class="num">${int(sum[0])}</td><td class="num">${rm(sum[1])}</td><td class="num">${rm(sum[2])}</td><td class="num">${rm(sum[1] + sum[2])}</td><td class="num">${rm(Math.round((sum[1] + sum[2]) / sum[0]))}</td></tr>`;
  } else if (V === "salon") {
    rows = t.rows.map(([ini, c, n, s, sv, rt]) => `<tr><td>${who(ini, c, n, s)}</td><td class="num">${rm(sv)}</td><td class="num">${rm(rt)}</td><td class="num"><b>${rm(sv + rt)}</b></td><td class="num pos">${rm(sv * 0.1 + rt * 0.05, 2)}</td></tr>`).join("");
  } else if (V === "beauty") {
    rows = t.rows.map(([ini, c, n, s, se, pk, sa]) => `<tr><td>${who(ini, c, n, s)}</td><td class="num">${se}</td><td class="num">${pk}</td><td class="num"><b>${rm(sa)}</b></td><td class="num pos">${rm(sa * 0.075, 2)}</td></tr>`).join("");
  } else {
    rows = t.rows.map(([ini, c, n, s, tr, ut, sa]) => `<tr><td>${who(ini, c, n, s)}</td><td class="num">${tr}</td><td class="num"><span class="meter"><u><i style="width:${ut}%"></i></u>${ut}%</span></td><td class="num"><b>${rm(sa)}</b></td><td class="num pos">${rm(sa * 0.08, 2)}</td></tr>`).join("");
  }
  $("table").innerHTML = `<h3><i data-i="users" style="color:#0396d9"></i>${t.title}${t.note ? ` <small>${t.note}</small>` : ""}<span class="more">View all →</span></h3>
    <table><tr>${t.cols.map((c, i) => `<th class="${i ? "num" : ""}">${c}</th>`).join("")}</tr>${rows}</table>`;

  // ---------- Ranked list ----------
  const rk = D.rank, best = rk.rows[0][2];
  $("rank").innerHTML = `<h3><i data-i="star" style="color:#0396d9"></i>${rk.title}<small style="margin-left:auto">by ${rk.by.toLowerCase()}</small></h3>
    <div class="rk">${rk.rows.map(([n, s, v], i) => `<div class="ri"><span class="no${i ? "" : " t"}">${i + 1}</span><div class="bd">
      <div class="ln"><b>${n}</b>${s ? `<small>${s}</small>` : ""}<span>${rk.by === "Revenue" ? rm(v) : int(v)}</span></div>
      <div class="br"><i style="width:${((v / best) * 100).toFixed(1)}%"></i></div></div></div>`).join("")}</div>`;

  drawBars();
</script>
<script src="shell.js"></script>
<script>
  // The salon, beauty and spa menus keep reports under "Commission"; label it Reports on this page
  document.querySelectorAll(".nav a").forEach((a) => {
    const t = a.lastChild;
    if (t && t.nodeType === 3 && t.textContent === "Commission") { t.textContent = "Reports"; a.classList.add("on"); }
  });
</script>
<script src="icons.js"></script>
</body></html>
