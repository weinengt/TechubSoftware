<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Budget 2027 at a glance: the picture for the Budget 2027 blog post. ?lang=en|ms|zh */
  :root { --w: 1000px; --h: 625px; }
  body { background: linear-gradient(135deg, #0b2f55 0%, #08406f 55%, #0a5c86 100%); color: #fff; position: relative; }
  body::before { content: ""; position: absolute; right: -140px; top: -160px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(0,207,203,.28), rgba(0,207,203,0) 70%); }
  body::after { content: ""; position: absolute; left: -120px; bottom: -200px; width: 480px; height: 480px; border-radius: 50%; background: radial-gradient(circle, rgba(3,150,217,.35), rgba(3,150,217,0) 70%); }
  .wrap { position: relative; z-index: 1; padding: 40px 48px 0; height: 100%; display: flex; flex-direction: column; }
  .hd { display: flex; align-items: center; gap: 14px; }
  .tag { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 99px; padding: 6px 14px 6px 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; }
  .tag i { width: 26px; height: 22px; border-radius: 99px; background: linear-gradient(135deg, #f5c542, #f59e0b); display: grid; place-items: center; font-style: normal; font-size: 9.5px; color: #0b2f55; font-weight: 900; letter-spacing: 0; }
  .date { margin-left: auto; font-size: 13px; color: #9cc3e4; font-weight: 600; }
  h1 { margin-top: 18px; font-size: 38px; line-height: 1.12; font-weight: 850; letter-spacing: -.02em; max-width: 760px; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #5fd4ff, #00e0d9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .grid { margin-top: 28px; flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: 1fr 1fr; gap: 16px; }
  .t { background: rgba(255,255,255,.96); color: var(--ink); border-radius: 16px; padding: 20px 22px 18px; display: flex; flex-direction: column; box-shadow: 0 18px 34px -18px rgba(0,0,0,.55); }
  .t .lb { display: flex; align-items: center; gap: 10px; font-size: 14.5px; font-weight: 700; color: var(--ink2); }
  .t .lb span { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex-shrink: 0; }
  .t .lb svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .t .v { margin-top: 18px; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .t .v s { font-size: 15px; color: #94a3b8; font-weight: 600; }
  .t .v .ar { color: #94a3b8; font-size: 15px; }
  .t .v b { font-size: 30px; font-weight: 850; letter-spacing: -.02em; color: var(--navy); }
  .t p { margin-top: auto; padding-top: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .c1 { background: linear-gradient(135deg, #0396d9, #0050a0); } .c2 { background: linear-gradient(135deg, #10b981, #047857); }
  .c3 { background: linear-gradient(135deg, #f59e0b, #d97706); } .c4 { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
  .c5 { background: linear-gradient(135deg, #00cfcb, #0891b2); } .c6 { background: linear-gradient(135deg, #ec4899, #be185d); }
  .ft { display: flex; align-items: center; gap: 10px; padding: 18px 0 22px; font-size: 12px; color: #9cc3e4; }
  .ft img { width: 26px; height: 26px; border-radius: 7px; background: #fff; padding: 3px; }
  .ft b { color: #fff; font-weight: 750; }
  .ft .r { margin-left: auto; }
  html[lang="zh"] h1 { font-size: 36px; letter-spacing: 0; }
</style></head>
<body>
<div class="wrap">
  <div class="hd"><div class="tag"><i>RM</i><span data-t="tag"></span></div><div class="date" data-t="date"></div></div>
  <h1 data-t="title"></h1>
  <div class="grid" id="grid"></div>
  <div class="ft"><img src="icon.png" alt=""><b>Techub Software</b><span class="r" data-t="note"></span></div>
</div>
<script>
const lang = new URLSearchParams(location.search).get("lang") || "en";
document.documentElement.lang = lang;
const ic = {
  tax: '<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',
  wage: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',
  asset: '<rect x="4" y="3" width="16" height="12" rx="2"/><path d="M8 21h8M12 15v6"/>',
  ai: '<path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z"/><path d="M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
  relief: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M17 8v6M14 11h6"/>',
  med: '<path d="M12 21s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.6-7 10-7 10z"/><path d="M12 10v5M9.5 12.5h5"/>',
};
const T = {
  en: {
    tag: "BUDGET 2027", date: "Tabled 9 Oct 2026",
    title: "What changes for <em>clinics, salons & spas</em>",
    note: "Proposals until the Finance Act is gazetted",
    tiles: [
      ["tax", "c1", "SME tax rate", "15%", "14%", "First RM 150,000 · save up to RM 6,000 a year"],
      ["wage", "c2", "Minimum wage", "RM 1,700", "RM 2,000", "From June 2027 · under RM 50m sales exempt for now"],
      ["asset", "c3", "Small asset write-off", "RM 2,000", "RM 3,000", "Per asset, 100% in year one · tablets, printers"],
      ["ai", "c4", "AI for small businesses", "", "RM 30m", "Through MDEC · to help 4,000 MSMEs automate"],
      ["relief", "c5", "Individual relief", "RM 9,000", "RM 12,000", "From YA 2027 · lower monthly PCB for staff"],
      ["med", "c6", "MediAsas medical plan", "", "RM 200", "Off each worker's first-year premium · Jan 2027"],
    ],
  },
  ms: {
    tag: "BAJET 2027", date: "Dibentang 9 Okt 2026",
    title: "Apa berubah untuk <em>klinik, salon & spa</em>",
    note: "Cadangan sehingga Akta Kewangan diwartakan",
    tiles: [
      ["tax", "c1", "Kadar cukai SME", "15%", "14%", "RM 150,000 pertama · jimat sehingga RM 6,000 setahun"],
      ["wage", "c2", "Gaji minimum", "RM 1,700", "RM 2,000", "Mulai Jun 2027 · jualan bawah RM 50j dikecualikan"],
      ["asset", "c3", "Aset nilai kecil", "RM 2,000", "RM 3,000", "Setiap aset, tolak 100% · tablet, printer"],
      ["ai", "c4", "AI untuk perniagaan kecil", "", "RM 30j", "Melalui MDEC · bantu 4,000 PMKS automasi"],
      ["relief", "c5", "Pelepasan individu", "RM 9,000", "RM 12,000", "Mulai YA 2027 · PCB staf lebih rendah"],
      ["med", "c6", "Pelan perubatan MediAsas", "", "RM 200", "Untuk premium tahun pertama setiap pekerja · Jan 2027"],
    ],
  },
  zh: {
    tag: "2027 年财政预算案", date: "2026 年 10 月 9 日提呈",
    title: "<em>诊所、发廊和 SPA</em> 老板要知道的改变",
    note: "财政法案宪报颁布前仍属建议",
    tiles: [
      ["tax", "c1", "中小企业税率", "15%", "14%", "首 RM 150,000 · 每年最多省 RM 6,000"],
      ["wage", "c2", "最低工资", "RM 1,700", "RM 2,000", "2027 年 6 月起 · 销售额低于 RM 5,000 万暂获豁免"],
      ["asset", "c3", "小额资产全额扣除", "RM 2,000", "RM 3,000", "每项资产 100% 扣除 · 平板、打印机"],
      ["ai", "c4", "中小企业 AI 补助", "", "RM 3,000 万", "通过 MDEC · 帮助 4,000 家企业自动化"],
      ["relief", "c5", "个人减免", "RM 9,000", "RM 12,000", "2027 课税年起 · 员工每月 PCB 减少"],
      ["med", "c6", "MediAsas 医疗配套", "", "RM 200", "每位员工首年保费补贴 · 2027 年 1 月"],
    ],
  },
}[lang];
document.querySelectorAll("[data-t]").forEach((el) => (el.innerHTML = T[el.dataset.t]));
document.getElementById("grid").innerHTML = T.tiles
  .map(([i, c, lb, from, to, p]) => `<div class="t"><div class="lb"><span class="${c}"><svg viewBox="0 0 24 24">${ic[i]}</svg></span>${lb}</div>
    <div class="v">${from ? `<s>${from}</s><span class="ar">→</span>` : ""}<b>${to}</b></div><p>${p}</p></div>`)
  .join("");
</script>
</body></html>
