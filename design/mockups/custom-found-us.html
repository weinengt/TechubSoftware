<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Customer C's customisation: Demo Day Spa's own question on the online booking form, "How did you find us?",
     and the report its answers make. Spot: "question" (the question block on the form). */
  :root { --w: 1024px; --h: 720px; --sp: #0d9488; --sp2: #14b8a6; }
  .top { gap: 10px; }
  .top h1 { white-space: nowrap; }
  .btn svg { width: 15px; height: 15px; }
  .fl { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font-size: 12px; font-weight: 650; color: var(--ink); white-space: nowrap; }
  .fl svg { width: 15px; height: 15px; color: var(--muted); }
  .content { flex-direction: row; gap: 12px; }

  /* Booking page preview */
  .pv { width: 372px; flex-shrink: 0; display: flex; flex-direction: column; background: #f1f5f4; border-color: #e1e8e6; }
  .pv h3 .seg { margin-left: auto; }
  .seg { display: flex; background: #e2e9e7; border-radius: 8px; padding: 2px; }
  .seg span { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; color: var(--muted); white-space: nowrap; }
  .seg span.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .page { flex: 1; margin-top: 12px; background: #fff; border-radius: 12px; border: 1px solid #e3e9e7; box-shadow: 0 10px 24px -16px rgba(15,23,42,.35); padding: 16px 16px 14px; display: flex; flex-direction: column; }
  .bz { display: flex; align-items: center; gap: 10px; }
  .bz .lg { width: 34px; height: 34px; border-radius: 99px; background: linear-gradient(135deg, #2dd4bf, #0d9488); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .bz .lg svg { width: 18px; height: 18px; stroke-width: 2; }
  .bz b { display: block; font-size: 14px; font-weight: 800; letter-spacing: -.01em; }
  .bz small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .bk { display: flex; align-items: center; gap: 10px; margin-top: 13px; padding: 9px 11px; border-radius: 10px; background: #f0fdfa; border: 1px solid #ccf3ec; }
  .bk .ic { width: 30px; height: 30px; border-radius: 9px; background: #fff; color: var(--sp); display: grid; place-items: center; flex-shrink: 0; }
  .bk .ic svg { width: 16px; height: 16px; }
  .bk b { display: block; font-size: 12px; font-weight: 750; white-space: nowrap; }
  .bk small { display: block; font-size: 10.5px; color: #0f766e; margin-top: 1px; white-space: nowrap; }
  .bk .am { margin-left: auto; font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .fd { margin-top: 11px; }
  .fd label { display: block; font-size: 11px; font-weight: 650; color: var(--ink2); }
  .fd .opt { font-weight: 500; color: #94a3b8; }
  .fd .in.ph { color: #a3afbd; }
  .fd .in { margin-top: 5px; height: 34px; border-radius: 9px; border: 1px solid #dfe5ec; display: flex; align-items: center; padding: 0 11px; font-size: 12.5px; color: var(--ink); }
  .q { margin-top: 13px; padding: 12px 12px 13px; border-radius: 12px; background: linear-gradient(135deg, #f2faff, #effcfb); border: 1.5px solid #7cc8ec; box-shadow: 0 0 0 4px rgba(3,150,217,.1), 0 12px 24px -16px rgba(3,110,170,.6); position: relative; }
  .q .qh { display: flex; align-items: center; gap: 8px; }
  .q .qh b { font-size: 13px; font-weight: 800; color: var(--ink); }
  .q .qh b em { font-style: normal; color: #e11d48; margin-left: 2px; }
  .new { margin-left: auto; display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 8px 0 6px; border-radius: 99px; background: linear-gradient(135deg, var(--brand), var(--teal)); color: #fff; font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 4px 10px -4px rgba(3,150,217,.8); }
  .new svg { width: 10px; height: 10px; fill: #fff; stroke: none; }
  .q p { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .ops { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ops span { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 99px; border: 1px solid #d3dee0; background: #fff; font-size: 11.5px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
  .ops span i { width: 13px; height: 13px; border-radius: 99px; border: 1.5px solid #b6c3c8; flex-shrink: 0; }
  .ops span.on { border-color: var(--sp); background: var(--sp); color: #fff; box-shadow: 0 6px 12px -8px rgba(13,148,136,.9); }
  .ops span.on i { border: 4px solid #fff; background: var(--sp); }
  .cf { margin-top: auto; height: 40px; border-radius: 11px; background: linear-gradient(135deg, #14b8a6, #0d9488); color: #fff; font-size: 13px; font-weight: 750; display: flex; align-items: center; justify-content: center; gap: 7px; box-shadow: 0 10px 20px -12px rgba(13,148,136,.95); }
  .cf svg { width: 15px; height: 15px; stroke-width: 2.4; }

  /* Report */
  .rp { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 16px 18px; }
  .rh { display: flex; align-items: flex-start; gap: 10px; }
  .rh h2 { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .rh p { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .rh p b { color: var(--ink); font-weight: 700; }
  .rh .tot { margin-left: auto; text-align: right; }
  .rh .tot b { display: block; font-size: 26px; font-weight: 850; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .rh .tot small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
  .bars { margin-top: 20px; display: flex; flex-direction: column; gap: 15px; }
  .br { display: grid; grid-template-columns: 150px 1fr 48px 36px; align-items: center; gap: 12px; }
  .br .lb { display: flex; align-items: center; gap: 9px; font-size: 12.5px; font-weight: 650; color: var(--ink); white-space: nowrap; }
  .br .lb span { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--brand-50); color: var(--brand); flex-shrink: 0; }
  .br .lb svg { width: 15px; height: 15px; }
  .br .tr { height: 12px; border-radius: 99px; background: #f1f5f9; overflow: hidden; }
  .br .tr i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #7dd3fc, #38bdf8); }
  .br:first-child .tr i { background: linear-gradient(90deg, #0396d9, #00cfcb); }
  .br .pc { font-size: 15px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .br .ct { font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .la { display: flex; flex-direction: column; }
  .lah { display: flex; align-items: center; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .lah span { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .lr { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f1f5f9; }
  .lr:last-child { border-bottom: 0; }
  .lr .av { width: 28px; height: 28px; font-size: 10px; }
  .lt b { display: block; font-size: 12px; font-weight: 700; }
  .lt small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; }
  .ans { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px 0 8px; border-radius: 99px; background: var(--brand-50); border: 1px solid var(--brand-100); color: #036295; font-size: 11px; font-weight: 650; white-space: nowrap; }
  .ans svg { width: 13px; height: 13px; }
  .ins { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .in3 { padding: 11px 12px; border-radius: 11px; background: #f8fafc; border: 1px solid #edf1f6; }
  .in3 .k { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .in3 .k svg { width: 13px; height: 13px; color: var(--brand); }
  .in3 b { display: block; font-size: 14px; font-weight: 800; margin-top: 5px; white-space: nowrap; }
  .in3 small { display: block; font-size: 10.5px; color: var(--ink2); margin-top: 2px; white-space: nowrap; }
  .sep { height: 1px; background: #eef2f7; margin: 18px 0 13px; }
  .lgd { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .lgd b { color: var(--ink2); font-weight: 650; }
</style></head>
<body>
<div class="app">
  <aside class="side" data-shell="spa" data-active=""></aside>
  <section class="main">
    <header class="top">
      <div><div class="sub">Demo Day Spa · Bangsar</div><h1>Online booking form</h1></div>
      <span class="fl" style="margin-left:auto"><i data-i="cal"></i>Last 30 days<i data-i="chevD"></i></span>
      <span class="btn"><i data-i="pen"></i>Edit form</span>
      <span class="btn pri"><svg class="i" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 006.4 0l3.2-3.2a4.5 4.5 0 00-6.4-6.4L11.8 5.8"/><path d="M14 10a4.5 4.5 0 00-6.4 0l-3.2 3.2a4.5 4.5 0 006.4 6.4l1.4-1.4"/></svg>Booking link</span>
    </header>
    <div class="content" id="c"></div>
  </section>
</div>
<script>
  const X = {
    leaf: '<path d="M11 20A7 7 0 019.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z"/><path d="M2 21c0-3 1.9-5.4 5.1-6 2.4-.5 4.9-2 5.9-3"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    star: '<path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    cam: '<path d="M3 8a2 2 0 012-2h2l2-2h6l2 2h2a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="13" r="3.5"/>',
    pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.5a3.5 3.5 0 010 7"/><path d="M18 14.5a6.5 6.5 0 013.5 5.5"/>',
    thumb: '<path d="M7 11v9H4v-9z"/><path d="M7 11l4-7a2 2 0 012 2v4h5.5a2 2 0 012 2.3l-1.2 6.5a2 2 0 01-2 1.7H7"/>',
    note: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
    sprout: '<path d="M12 21v-8"/><path d="M12 13c0-4 3-7 8-7 0 4-3 7-8 7z"/><path d="M12 15c0-3-2.5-5.5-7-5.5 0 3.5 2.5 5.5 7 5.5z"/>',
    coin: '<circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.6-.8-1.6-1.2-2.8-1.2-1.7 0-2.8.8-2.8 2s1 1.7 2.8 2 2.8.8 2.8 2-1.1 2-2.8 2c-1.3 0-2.3-.5-2.9-1.3M12 6.5V8M12 16v1.5"/>',
    list: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6l.01 0M4.5 12l.01 0M4.5 18l.01 0"/>',
  };
  const I = (n) => `<svg class="i" viewBox="0 0 24 24">${X[n]}</svg>`;

  // Answers to "How did you find us?" over the last 30 days: 312 bookings, the question is required
  const A = [["cam", "Instagram", 106], ["pin", "Google Maps", 84], ["users", "Friends & family", 56], ["thumb", "Facebook", 41], ["note", "TikTok", 25]];
  const N = A.reduce((s, a) => s + a[2], 0);
  // The newest online bookings and what each customer answered
  const L = [
    ["PN", "#0d9488", "Priya Nair", "Balinese Massage · Sat 17 Oct, 2:00 PM", "cam", "Instagram"],
    ["TM", "#8b5cf6", "Tan Mei Ling", "Hot Stone Massage · Fri 16 Oct, 11:00 AM", "users", "Friends & family"],
    ["NH", "#0396d9", "Nurul Huda", "Foot Reflexology · Thu 15 Oct, 4:30 PM", "pin", "Google Maps"],
    ["SM", "#f59e0b", "Siti Mariam", "Aromatherapy Massage · Thu 15 Oct, 3:00 PM", "note", "TikTok"],
  ];
  const max = A[0][2];
  document.getElementById("c").innerHTML = `
    <div class="card pv">
      <h3>${I("eye")}Booking page preview<span class="seg"><span class="on">Phone</span><span>Computer</span></span></h3>
      <div class="page">
        <div class="bz"><span class="lg">${I("leaf")}</span><div><b>Demo Day Spa</b><small>Bangsar, Kuala Lumpur</small></div></div>
        <div class="bk"><span class="ic">${I("leaf")}</span><div><b>Balinese Massage (90 min)</b><small>Sat, 17 Oct · 2:00 PM · Aisyah</small></div><span class="am">RM 168</span></div>
        <div class="fd"><label>Your name</label><div class="in">Priya Nair</div></div>
        <div class="fd"><label>Phone (WhatsApp)</label><div class="in">+60 12-345 6789</div></div>
        <div class="q" data-spot="question">
          <div class="qh"><b>How did you find us?<em>*</em></b><span class="new"><svg viewBox="0 0 24 24">${X.star}</svg>New question</span></div>
          <p>Pick one</p>
          <div class="ops">${["Instagram", "Google Maps", "Friends & family", "Facebook", "TikTok", "Other"].map((o, i) => `<span${i ? "" : ' class="on"'}><i></i>${o}</span>`).join("")}</div>
        </div>
        <div class="fd"><label>Notes for your therapist <span class="opt">(optional)</span></label><div class="in ph">For example, firm pressure</div></div>
        <div class="cf">${I("check")}Confirm booking</div>
      </div>
    </div>
    <div class="card rp">
      <div class="rh">
        <div><h2>How customers found you</h2><p>Last 30 days · answers to your new booking question</p></div>
        <div class="tot"><b>${N}</b><small>bookings</small></div>
      </div>
      <div class="bars">${A.map(([ic, n, v]) => `<div class="br"><span class="lb"><span>${I(ic)}</span>${n}</span><span class="tr"><i style="width:${(v / max) * 100}%"></i></span><span class="pc">${Math.round((v / N) * 100)}%</span><span class="ct">${v}</span></div>`).join("")}</div>
      <div class="sep"></div>
      <div class="la"><div class="lah">Latest answers<span>Booked online</span></div>
        ${L.map(([ini, c, n, t, ic, a]) => `<div class="lr"><span class="av" style="background:${c}">${ini}</span><div class="lt"><b>${n}</b><small>${t}</small></div><span class="ans">${I(ic)}${a}</span></div>`).join("")}
      </div>
      <div class="ins">
        <div class="in3"><div class="k">${I("sprout")}Most new customers</div><b>Instagram</b><small>41 of 96 first visits</small></div>
        <div class="in3"><div class="k">${I("coin")}Highest spend</div><b>Friends &amp; family</b><small>RM 212 per visit</small></div>
        <div class="in3"><div class="k">${I("list")}Answered</div><b>312 of 312</b><small>Required question</small></div>
      </div>
    </div>`;
</script>
<script src="shell.js"></script>
<script>
  // Online booking has its own item in the menu (after Calendar), shown as the active page
  document.querySelectorAll(".nav a").forEach((a) => {
    if (a.lastChild && a.lastChild.nodeType === 3 && a.lastChild.textContent === "Calendar")
      a.insertAdjacentHTML("afterend", '<a class="on"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>Online booking</a>');
  });
</script>
<script src="icons.js"></script>
</body></html>
