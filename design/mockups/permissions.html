<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  :root { --w: 1024px; --h: 720px; }
  .search { white-space: nowrap; }
  .side .me { padding: 10px 6px; gap: 8px; white-space: nowrap; }
  .ic.p { background: #fdf2f8; color: #db2777; } .ic.t { background: #f0fdfa; color: #0d9488; }
  /* Matrix: permissions (rows) x roles (columns) */
  .mxc { padding: 0; overflow: hidden; }
  .mxh { display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
  .mxh h3 { font-size: 14px; }
  .lgd { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 11.5px; color: var(--ink2); font-weight: 500; }
  .lgd span { display: inline-flex; align-items: center; gap: 6px; }
  .mx { table-layout: fixed; }
  .mx th { text-transform: none; letter-spacing: 0; text-align: center; padding: 9px 6px; border-top: 1px solid var(--line); }
  .mx th:first-child { text-align: left; padding-left: 16px; text-transform: uppercase; letter-spacing: .04em; }
  .mx td { text-align: center; padding: 9px 6px; }
  .mx td:first-child { text-align: left; padding-left: 16px; }
  .mx tr:last-child td { border-bottom: 0; }
  .rh { display: inline-flex; align-items: center; gap: 8px; text-align: left; }
  .rh .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
  .rh .ic svg { width: 16px; height: 16px; }
  .rh b { display: block; font-size: 12.5px; color: var(--ink); font-weight: 700; }
  .rh small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 500; margin-top: 1px; }
  .perm { display: flex; align-items: center; gap: 10px; font-weight: 650; color: var(--ink); font-size: 12.5px; }
  .perm .pi { width: 28px; height: 28px; border-radius: 8px; background: #f1f5f9; color: var(--ink2); display: grid; place-items: center; flex-shrink: 0; }
  .perm .pi svg { width: 15px; height: 15px; }
  .tg { display: inline-block; width: 38px; height: 22px; border-radius: 99px; background: #e2e8f0; position: relative; vertical-align: middle; }
  .tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 99px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .tg.on { background: linear-gradient(135deg, var(--brand), var(--teal)); } .tg.on::after { left: 18px; }
  .tg.ap { background: #f59e0b; } .tg.ap::after { left: 18px; }
  .tg.sm { width: 26px; height: 15px; } .tg.sm::after { width: 11px; height: 11px; } .tg.sm.on::after, .tg.sm.ap::after { left: 13px; }
  .own { font-size: 11px; font-weight: 700; color: #036295; background: var(--brand-100); padding: 4px 10px; border-radius: 99px; }
  /* Audit trail */
  .log { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid #f1f5f9; }
  .log:last-child { border-bottom: 0; padding-bottom: 0; }
  .log time { font-size: 11px; font-weight: 700; color: var(--muted); min-width: 34px; flex-shrink: 0; white-space: nowrap; }
  .log .av { width: 30px; height: 30px; font-size: 10.5px; }
  .log .lt { font-size: 12px; color: var(--ink2); line-height: 1.35; min-width: 0; }
  .log .lt b { color: var(--ink); font-weight: 700; } .log .lt em { font-style: normal; color: var(--muted); font-size: 11px; }
  .log .chip { margin-left: auto; font-size: 11px; padding: 4px 9px; }
  .v-trade .log time { min-width: 50px; }
  /* Approval request */
  .appr { width: 290px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; border-color: #fcd34d; box-shadow: 0 10px 24px -16px rgba(217,119,6,.55); }
  .who { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
  .who b { display: block; } .who small { font-size: 11px; color: var(--muted); }
  .ask { background: #fffbeb; border-radius: 10px; padding: 11px 12px; }
  .ask .k { font-size: 11.5px; font-weight: 650; color: #b45309; }
  .ask .big { font-size: 21px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; display: flex; align-items: center; gap: 8px; }
  .ask .big s { color: #94a3b8; font-weight: 600; font-size: 14px; }
  .ask .big svg { width: 15px; height: 15px; color: #94a3b8; }
  .ask .for { font-size: 11px; color: var(--ink2); margin-top: 3px; }
  .rule { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 500; }
  .rule svg { width: 13px; height: 13px; }
  .acts { display: flex; gap: 8px; margin-top: auto; } .acts .btn { flex: 1; justify-content: center; }
  .acts .btn:first-child { color: #b91c1c; }
</style></head>
<body>
<div class="app">
  <aside class="side" data-shell="clinic" data-active="Staff & Roles"></aside>
  <section class="main">
    <header class="top">
      <div><div class="sub" id="biz"></div><h1>Staff &amp; Permission Control</h1></div>
      <div class="search"><i data-i="search"></i>Search staff…</div>
      <span class="btn"><i data-i="users"></i><span id="staffN"></span> staff</span>
      <span class="btn pri"><i data-i="plus"></i>Add staff</span>
    </header>
    <div class="content" style="gap:12px">
      <div class="card mxc">
        <div class="mxh">
          <h3><i data-i="shield" style="color:#0396d9;width:18px;height:18px"></i>Who can do what</h3>
          <div class="lgd"><span><span class="tg sm on"></span>Allowed</span><span><span class="tg sm ap"></span>Needs approval</span><span><span class="tg sm"></span>Blocked</span></div>
          <span class="chip g"><i data-i="check" style="width:12px;height:12px"></i>Saved</span>
        </div>
        <table class="mx" id="mx"></table>
      </div>
      <div class="row" style="flex:1;min-height:0;gap:12px">
        <div class="card grow" style="display:flex;flex-direction:column">
          <h3><i data-i="file" style="color:#0396d9"></i>Staff activity · today<span class="more">View all →</span></h3>
          <div id="log" style="margin-top:4px"></div>
        </div>
        <div class="card appr" id="appr"></div>
      </div>
    </div>
  </section>
</div>
<script>
  const v = new URLSearchParams(location.search).get("v");
  const V = ["salon", "beauty", "spa", "live", "trade"].includes(v) ? v : "clinic";
  // cells: 1 allowed, 2 needs manager approval, 0 blocked, text = limited access
  const D = {
    clinic: {
      biz: "Demo Clinic", staff: 12,
      roles: [["steth", "v", "Doctor", 3], ["heart", "p", "Nurse", 4], ["pill", "g", "Pharmacy", 2], ["card", "a", "Cashier", 2], ["shield", "b", "Admin", 1]],
      perms: [["file", "View medical records", 1, 1, "Rx only", 0, 0], ["steth", "Prescribe medicine", 1, 0, 0, 0, 0], ["pill", "Dispense medicine", 1, 1, 1, 0, 0],
        ["percent", "Give discount", 1, 0, 0, 2, 1], ["undo", "Refund / void bill", 1, 0, 0, 2, 1], ["dl", "Export patient data", 1, 0, 0, 0, 2]],
      log: [["10:40", "a", "KU", "Kumar", "Cashier", "Gave RM 20 discount · Bill B-2291", "g", "✓ Approved by Dr. Lim"],
        ["10:31", "p", "NA", "Aina", "Nurse", "Opened medical record · P-001042", "s", "Viewed"],
        ["10:12", "a", "KU", "Kumar", "Cashier", "Tried to open a medical record", "r", "Blocked"],
        ["09:58", "g", "WO", "Wong", "Pharmacy", "Dispensed Azithromycin 250mg × 3", "b", "Batch AZ0921"]],
      appr: ["a", "KU", "Kumar", "Cashier · 2 min ago", "Refund request", "RM 35.00", "Gan Kok Leong · Bill B-2287 · charged twice", "Cashier refunds need approval"],
    },
    salon: {
      biz: "Demo Hair Salon", staff: 11,
      roles: [["star", "a", "Owner", 1], ["shield", "b", "Manager", 1], ["scissors", "v", "Senior Stylist", 3], ["scissors", "p", "Junior Stylist", 4], ["cal", "t", "Receptionist", 2]],
      perms: [["percent", "Give discount", 1, 1, 2, 2, 2], ["undo", "Refund / void bill", 1, 1, 0, 0, 2], ["tag", "Edit service price", 1, 2, 0, 0, 0],
        ["chart", "View sales report", 1, 1, "Own only", "Own only", 0], ["phone", "See customer phone no.", 1, 1, 0, 0, 1], ["dl", "Export customer data", 1, 2, 0, 0, 0]],
      log: [["11:20", "t", "NI", "Nisha", "Receptionist", "Gave 10% discount · INV-5521", "g", "✓ Approved by Kelly"],
        ["10:52", "p", "AM", "Amir", "Junior Stylist", "Tried to export customer list", "r", "Blocked"],
        ["10:35", "b", "KL", "Kelly", "Manager", "Refunded RM 45 · INV-5508", "s", "Reason: redo colour"],
        ["10:12", "a", "VC", "Vincent", "Owner", "Men's Cut price RM 35 → RM 38", "b", "Price updated"]],
      appr: ["p", "AM", "Amir", "Junior Stylist · 2 min ago", "15% discount", "<s>RM 280</s><i data-i=\"arrowR\"></i>RM 238", "Joanne Lim · Colour &amp; Treatment", "Junior Stylist discounts need approval"],
    },
    beauty: {
      biz: "Demo Beauty Centre", staff: 8,
      roles: [["star", "a", "Owner", 1], ["shield", "b", "Manager", 1], ["face", "v", "Beautician", 5], ["cal", "t", "Receptionist", 1]],
      perms: [["percent", "Give discount", 1, 1, 2, 2], ["undo", "Refund / void bill", 1, 1, 0, 0], ["gift", "Extend package expiry", 1, 1, 0, 2],
        ["image", "View before & after photos", 1, 1, "Own clients", 0], ["chart", "View sales & commission", 1, 1, "Own only", 0], ["dl", "Export customer data", 1, 2, 0, 0]],
      log: [["11:05", "t", "NH", "Nur Hidayah", "Receptionist", "Redeemed Hydra Facial 4/10 · Chloe Tan", "s", "Package used"],
        ["10:47", "v", "NA", "Nadia", "Beautician", "Tried to export customer list", "r", "Blocked"],
        ["10:22", "b", "SN", "Sarah", "Manager", "Refunded RM 60 · INV-7720", "s", "Reason noted"],
        ["09:51", "v", "ML", "Mei Ling", "Beautician", "Added before &amp; after photos · Farah Hanim", "t", "Own client"]],
      appr: ["v", "NA", "Nadia", "Beautician · 2 min ago", "20% discount", "<s>RM 238</s><i data-i=\"arrowR\"></i>RM 190.40", "Aqilah Razak · Hydra Facial", "Beautician discounts need approval"],
    },
    spa: {
      biz: "Demo Day Spa", staff: 10,
      roles: [["star", "a", "Owner", 1], ["shield", "b", "Manager", 1], ["leaf", "t", "Therapist", 6], ["cal", "v", "Receptionist", 2]],
      perms: [["percent", "Give discount", 1, 1, 0, 2], ["undo", "Refund / void bill", 1, 1, 0, 0], ["gift", "Extend package expiry", 1, 1, 0, 2],
        ["chart", "View sales & commission", 1, 1, "Own only", 0], ["phone", "See customer phone no.", 1, 1, 0, 1], ["dl", "Export customer data", 1, 2, 0, 0]],
      log: [["11:15", "v", "HA", "Hana", "Receptionist", "Gave RM 30 off Hot Stone Massage", "g", "✓ Approved by Jenny"],
        ["10:48", "t", "AI", "Aisyah", "Therapist", "Checked her own commission", "t", "Own only"],
        ["10:20", "t", "WA", "Wani", "Therapist", "Tried to view a customer's phone no.", "r", "Blocked"],
        ["09:45", "b", "JL", "Jenny", "Manager", "Refunded RM 120 · unused session", "s", "Reason noted"]],
      appr: ["v", "HA", "Hana", "Receptionist · 2 min ago", "Extend package by 1 month", "31 Oct<i data-i=\"arrowR\"></i>30 Nov", "Siti Rahmah · Balinese Massage 10×", "Package extensions need approval"],
    },
    live: {
      biz: "Demo Live Shop", staff: 8,
      roles: [["star", "a", "Owner", 1], ["shield", "b", "Manager", 1], ["video", "p", "Live Host", 2], ["box", "g", "Packer", 3], ["phone", "t", "Customer Service", 1]],
      perms: [["tag", "Change price during live", 1, 1, 2, 0, 0], ["box", "Adjust stock", 1, 2, 0, 0, 0], ["undo", "Cancel / refund order", 1, 1, 0, 0, 2],
        ["chart", "View sales report", 1, 1, "Own lives", 0, 0], ["phone", "See buyer phone no.", 1, 1, 0, 0, 1], ["dl", "Export buyer list", 1, 2, 0, 0, 0]],
      log: [["8:40 PM", "p", "MT", "Mia", "Live Host", "Flash price Lipstick Set → RM 29.90", "g", "✓ Approved by Daniel"],
        ["8:36 PM", "g", "AZ", "Azlan", "Packer", "Packed 48 orders · Batch 12", "b", "48 orders"],
        ["8:21 PM", "p", "SY", "Syafiq", "Live Host", "Tried to export buyer list", "r", "Blocked"],
        ["8:05 PM", "t", "NU", "Nurul", "Customer Service", "Cancelled order #LS-23991", "s", "Buyer asked"]],
      appr: ["p", "MT", "Mia", "Live Host · 2 min ago", "Flash price during live", "<s>RM 25.00</s><i data-i=\"arrowR\"></i>RM 19.90", "MagSafe Phone Case · 3 left", "Live price changes need approval"],
    },
    trade: {
      biz: "Demo Trading", staff: 13,
      roles: [["star", "a", "Owner", 1], ["wallet", "v", "Account", 2], ["cart", "p", "Sales", 4], ["box", "g", "Storekeeper", 3], ["truck", "b", "Driver", 3]],
      perms: [["stockin", "Stock in & put away", 1, 0, 0, 1, 0], ["sliders", "Adjust stock count", 1, 0, 0, 2, 0], ["tag", "Change selling price", 1, 0, 2, 0, 0],
        ["undo", "Return & credit note", 1, 1, 1, 0, 0], ["truck", "Update delivery status", 1, 0, 0, 1, "Own trips"], ["dl", "Export customer list", 1, 2, 0, 0, 0]],
      log: [["4:12 PM", "g", "AY", "Azman", "Storekeeper", "Stock count A-06-2 · Steam Iron −1 (damaged)", "g", "✓ Approved by Henry"],
        ["3:40 PM", "p", "FH", "Farid", "Sales", "Tried to export customer list", "r", "Blocked"],
        ["2:58 PM", "p", "JW", "Jessica", "Sales", "Air Fryer 4.5L price RM 189.00 → RM 179.00", "a", "Waiting approval"],
        ["9:20 AM", "g", "RK", "Ravi", "Storekeeper", "Stock in GRN-2026-0412 · 1,240 units", "b", "8 batches"]],
      appr: ["p", "JW", "Jessica", "Sales · 2:58 PM", "Selling price change", "<s>RM 189.00</s><i data-i=\"arrowR\"></i>RM 179.00", "Air Fryer 4.5L · AF-450 · all customers", "Sales price changes need approval"],
    },
  }[V];
  const AV = { b: "#0396d9", g: "#10b981", a: "#f59e0b", v: "#8b5cf6", p: "#ec4899", t: "#14b8a6", r: "#ef4444" };
  const DL = '<svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>';
  const ic = (n) => (n === "dl" ? DL : `<i data-i="${n}"></i>`);
  if (V === "trade") document.body.classList.add("v-trade");
  document.getElementById("biz").textContent = `${D.biz} · Settings`;
  document.getElementById("staffN").textContent = D.staff;
  const cell = (x) => (typeof x === "string" ? `<span class="own">${x}</span>` : `<span class="tg ${x === 1 ? "on" : x === 2 ? "ap" : ""}"></span>`);
  document.getElementById("mx").innerHTML =
    `<colgroup><col style="width:236px">${D.roles.map(() => "<col>").join("")}</colgroup>` +
    `<tr><th>Permission</th>${D.roles.map(([i, c, n, k]) => `<th><span class="rh"><span class="ic ${c}">${ic(i)}</span><span><b>${n}</b><small>${k} staff</small></span></span></th>`).join("")}</tr>` +
    D.perms.map(([i, n, ...p]) => `<tr><td><span class="perm"><span class="pi">${ic(i)}</span>${n}</span></td>${p.map((x) => `<td>${cell(x)}</td>`).join("")}</tr>`).join("");
  document.getElementById("log").innerHTML = D.log.map(([t, c, ini, who, role, what, cc, chip]) =>
    `<div class="log"><time>${t}</time><span class="av" style="background:${AV[c]}">${ini}</span><div class="lt"><b>${who}</b> <em>· ${role}</em><br>${what}</div><span class="chip ${cc}">${chip}</span></div>`).join("");
  const [ac, aini, awho, arole, ak, abig, afor, arule] = D.appr;
  document.getElementById("appr").innerHTML = `<h3><i data-i="bell" style="color:#d97706"></i>Needs your approval<span class="chip a" style="margin-left:auto">1 new</span></h3>
    <div class="who"><span class="av" style="background:${AV[ac]}">${aini}</span><div><b>${awho}</b><small>${arole}</small></div></div>
    <div class="ask"><div class="k">${ak}</div><div class="big">${abig}</div><div class="for">${afor}</div></div>
    <div class="rule"><i data-i="lock"></i>${arule}</div>
    <div class="acts"><span class="btn"><i data-i="x"></i>Reject</span><span class="btn pri"><i data-i="check"></i>Approve</span></div>`;
</script>
<script src="shell.js"></script>
<script src="icons.js"></script>
</body></html>
