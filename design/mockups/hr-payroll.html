<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Payroll & HR System: one month's payroll for a company of 24 staff in three outlets, ready to approve, with EPF,
     SOCSO, EIS and PCB worked out for each person. The amounts come from lib/payroll.ts (the free calculator's rules). */
  :root { --w: 1024px; --h: 720px; }
  .top { gap: 10px; }
  .top h1 { white-space: nowrap; }
  .btn svg { width: 15px; height: 15px; }
  .fl { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font-size: 12px; font-weight: 650; color: var(--ink); white-space: nowrap; }
  .fl svg { width: 15px; height: 15px; color: var(--muted); }
  .fl small { font-size: 11px; color: var(--muted); font-weight: 500; }
  .content { gap: 12px; }
  .ra { display: flex; gap: 12px; flex-shrink: 0; }

  /* Summary panel */
  .sum { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
  .figs { display: flex; }
  .fig { flex: 1; min-width: 0; padding-left: 14px; margin-left: 14px; border-left: 1px solid #eef2f7; }
  .fig:first-child { padding-left: 0; margin-left: 0; border-left: 0; }
  .fig .k { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .fig .k svg { width: 14px; height: 14px; }
  .fig .v { font-size: 20px; font-weight: 800; letter-spacing: -.02em; margin-top: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .fig .d { font-size: 10.5px; font-weight: 500; color: var(--muted); margin-top: 1px; white-space: nowrap; }
  .fig .d b { color: #b45309; font-weight: 700; }
  .mix { display: flex; gap: 2px; height: 10px; }
  .mix i { display: block; height: 100%; }
  .mix i:first-child { border-radius: 99px 0 0 99px; }
  .mix i:last-child { border-radius: 0 99px 99px 0; }
  .leg { display: flex; gap: 14px; margin-top: 8px; font-size: 11px; color: var(--ink2); white-space: nowrap; }
  .leg span { display: inline-flex; align-items: center; gap: 6px; }
  .leg i { width: 9px; height: 9px; border-radius: 3px; }
  .leg b { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* Callout */
  .call { width: 372px; flex-shrink: 0; position: relative; overflow: hidden; border-radius: 12px; padding: 14px 16px;
    background: radial-gradient(circle at calc(100% - 28px) calc(100% - 18px), rgba(0,207,203,.22) 61.5px, transparent 62px),
      linear-gradient(135deg, #0b2f55, #0050a0 60%, #0396d9); color: #cfe6f7; font-size: 11.5px; line-height: 1.5; }
  .call h4 { display: flex; align-items: center; gap: 9px; color: #fff; font-size: 12.5px; font-weight: 700; line-height: 1.3; margin-bottom: 6px; white-space: nowrap; }
  .bolt { width: 22px; height: 22px; border-radius: 99px; background: linear-gradient(135deg, #f59e0b, #fbbf24); display: grid; place-items: center; flex-shrink: 0; box-shadow: 0 2px 6px -2px rgba(217,119,6,.7); }
  .bolt svg { width: 13px; height: 13px; fill: #fff; stroke: none; }
  .call p, .call .tags { position: relative; z-index: 1; }
  .call p b { color: #fff; font-weight: 650; }
  .call .tags { display: flex; gap: 6px; margin-top: 10px; }
  .call .tags span { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 99px; background: rgba(255,255,255,.14); color: #fff; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
  .call .tags svg { width: 12px; height: 12px; }

  /* Pay table */
  .tb { padding: 0; overflow: hidden; display: flex; flex-direction: column; flex-shrink: 0; }
  .tb h3 { padding: 12px 14px 10px; }
  .card h3 small { font-size: 11px; color: var(--muted); font-weight: 500; }
  .seg { margin-left: auto; display: flex; background: #eef2f7; border-radius: 8px; padding: 2px; }
  .seg span { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; color: var(--muted); white-space: nowrap; }
  .seg span.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .tb th, .tb td { padding: 7px 8px; }
  .tb th { padding-top: 7px; padding-bottom: 7px; }
  .tb td:first-child, .tb th:first-child { padding-left: 14px; }
  .tb td:last-child, .tb th:last-child { padding-right: 14px; }
  .tb th.num { text-align: right; }
  .tb td { font-variant-numeric: tabular-nums; }
  .tb td small { line-height: 13px; margin-top: 1px; }
  .who { display: flex; align-items: center; gap: 9px; }
  .who .av { width: 28px; height: 28px; font-size: 10px; }
  .who b { display: block; line-height: 15px; }
  .who small { margin-top: 0; }
  .tb .st { background: #f5fbff; }
  .tb th.st { background: #e8f5fd; color: #036295; }
  .auto { display: inline-flex; align-items: center; gap: 2px; margin-left: 5px; padding: 1px 6px 1px 4px; border-radius: 99px; background: var(--brand-100); color: #036295; font-size: 9.5px; font-weight: 700; letter-spacing: .02em; vertical-align: 1px; }
  .auto svg { width: 9px; height: 9px; fill: currentColor; stroke: none; }
  .tb td.nil { color: #94a3b8; }
  .tb tr.tot td { background: #f8fafc; border-bottom: 0; color: var(--ink); font-weight: 750; }
  .tb tr.tot td.st { background: #e8f5fd; }
  .pl { display: inline-flex; align-items: center; gap: 4px; color: var(--brand); font-weight: 600; font-size: 11.5px; }
  .pl svg { width: 14px; height: 14px; }
  .neg { color: #b91c1c; font-weight: 600; }
  .tfoot { display: flex; align-items: center; gap: 8px; padding: 9px 14px 10px; border-top: 1px solid #eef2f7; font-size: 11.5px; color: var(--ink2); white-space: nowrap; }
  .tfoot svg { width: 15px; height: 15px; color: #059669; }
  .tfoot .more { margin-left: auto; color: var(--brand); font-weight: 600; }
</style></head>
<body>
<div class="app">
  <aside class="side" data-shell="hr" data-active="Payroll"></aside>
  <section class="main">
    <header class="top">
      <div><div class="sub">Demo Company · KL, JB &amp; Penang</div><h1>Payroll · October 2026</h1></div>
      <span class="chip a"><i data-i="clock" style="width:12px;height:12px"></i>Ready to approve</span>
      <span class="fl" style="margin-left:auto"><i data-i="cal"></i><small>Pay day</small>Fri, 30 Oct</span>
      <span class="btn"><i data-i="file"></i>Export payslips</span>
      <span class="btn pri"><i data-i="check"></i>Approve payroll</span>
    </header>
    <div class="content">
      <div class="ra">
        <div class="card sum" id="sum"></div>
        <div class="call" id="call"></div>
      </div>
      <div class="card tb" id="table"></div>
    </div>
  </section>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const BOLT = '<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>';
  const money = (n) => n.toLocaleString("en-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const rm = (n) => "RM " + Math.round(n).toLocaleString("en-MY");

  // October 2026, worked out with lib/payroll.ts (same pay since January): the first 8 of 24 staff.
  // add = allowance, overtime, commission and claims, less unpaid leave; epf and ss = employee share [employee, employer];
  // ss = SOCSO, LINDUNG 24 Jam and EIS together.
  const rows = [
    { i: "DW", c: "#0050a0", n: "Daniel Wong", r: "Operations Manager · KL", basic: 6800, add: 500, addN: "Allowance", epf: [803, 876], ss: [86.3, 116.05], pcb: 272.45, net: 6138.25 },
    { i: "NA", c: "#ec4899", n: "Nurul Aina", r: "Admin Executive · KL", basic: 3000, add: 0, epf: [330, 390], ss: [42.8, 57.55], pcb: 0, net: 2627.2 },
    { i: "KR", c: "#8b5cf6", n: "Kavitha Rajan", r: "Account Executive · KL", basic: 4200, add: 200, addN: "Allowance", epf: [484, 572], ss: [63.1, 84.85], pcb: 61, net: 3791.9 },
    { i: "JL", c: "#0396d9", n: "Jason Lim", r: "Sales Executive · JB", basic: 2800, add: 1940, addN: "incl. commission 1,640.00", epf: [522, 617], ss: [68.9, 92.65], pcb: 91.55, net: 4057.55 },
    { i: "MH", c: "#0b2f55", n: "Muhammad Hafiz", r: "Senior Technician · Penang", basic: 3400, add: 691.35, addN: "incl. OT 18 h", epf: [403, 476], ss: [58.7, 78.95], pcb: 0, pcbN: "zakat 50.00", net: 3579.65 },
    { i: "SZ", c: "#14b8a6", n: "Siti Zulaikha", r: "Customer Service · KL", basic: 2400, add: -92.31, addN: "1 day unpaid leave", epf: [256, 302], ss: [34.1, 45.85], pcb: 0, net: 2017.59 },
    { i: "FH", c: "#f59e0b", n: "Faizal Hamid", r: "Driver · KL", basic: 2200, add: 308.52, addN: "OT 14 h · claims 86.40", epf: [242, 286], ss: [35.5, 47.75], pcb: 0, net: 2231.02 },
    { i: "RU", c: "#10b981", n: "Rahim Uddin", r: "Store Assistant · JB", basic: 1800, add: 155.77, addN: "incl. OT 12 h", epf: [36, 36], epfN: "2% foreign worker", ss: [24.4, 34.15], pcb: 0, net: 1895.37 },
  ];
  // All 24 staff
  const T = { n: 24, basic: 71400, add: 9234.57, epf: [7946, 9373], ss: [1117.4, 1511.95], pcb: 598.1, zakat: 50, net: 70923.07, gross: 80634.57,
    cost: 92213.1, due: 21240.03, hrd: 693.58 };

  // ---------- Summary panel ----------
  const parts = [["Net pay", T.net, "#0396d9"], ["EPF", T.epf[0] + T.epf[1], "#8b5cf6"], ["SOCSO & EIS", T.ss[0] + T.ss[1], "#14b8a6"], ["PCB, zakat & HRD", T.pcb + T.zakat + T.hrd, "#f59e0b"]];
  const share = [77, 19, 3, 1]; // of the cost to the company, rounded to add up to 100%
  $("sum").innerHTML = `<div class="figs">
      <div class="fig"><div class="k"><i data-i="wallet"></i>Cost to company</div><div class="v">${rm(T.cost)}</div><div class="d">Net pay ${rm(T.net)}</div></div>
      <div class="fig"><div class="k"><i data-i="shield"></i>EPF, SOCSO, EIS &amp; PCB</div><div class="v">${rm(T.due)}</div><div class="d"><b>Due by 15 Nov</b> · with HRD levy</div></div>
      <div class="fig"><div class="k"><i data-i="users"></i>Staff</div><div class="v">${T.n}</div><div class="d">KL 13 · JB 6 · Penang 5</div></div>
    </div>
    <div><div class="mix">${parts.map(([, v, c]) => `<i style="width:${((v / T.cost) * 100).toFixed(2)}%;background:${c}"></i>`).join("")}</div>
      <div class="leg">${parts.map(([n, , c], i) => `<span><i style="background:${c}"></i>${n}<b>${share[i]}%</b></span>`).join("")}</div></div>`;

  // ---------- Callout ----------
  $("call").innerHTML = `<h4><span class="bolt">${BOLT}</span>EPF, SOCSO, EIS &amp; PCB worked out for you</h4>
    <p>The <b>2026 rates</b> for every staff member, with LINDUNG 24 Jam, foreign workers and staff over 60 handled automatically.</p>
    <div class="tags"><span><i data-i="users"></i>24 staff</span><span>9 pay PCB</span><span>3 foreign workers</span><span>1 over 60</span></div>`;

  // ---------- Pay table ----------
  const sub = (x) => (x ? `<small>${x}</small>` : "");
  const body = rows.map((p) => `<tr>
      <td><div class="who"><span class="av" style="background:${p.c}">${p.i}</span><div><b>${p.n}</b><small>${p.r}</small></div></div></td>
      <td class="num">${money(p.basic)}</td>
      ${p.add ? `<td class="num">${p.add < 0 ? `<span class="neg">− ${money(-p.add)}</span>` : money(p.add)}${sub(p.addN)}</td>` : `<td class="num nil">—</td>`}
      <td class="num st"><b>${money(p.epf[0])}</b><small>${p.epfN || `employer ${money(p.epf[1])}`}</small></td>
      <td class="num st"><b>${money(p.ss[0])}</b><small>employer ${money(p.ss[1])}</small></td>
      <td class="num st"><b>${money(p.pcb)}</b>${sub(p.pcbN)}</td>
      <td class="num"><b>${money(p.net)}</b></td>
      <td><span class="pl"><i data-i="file"></i>Preview</span></td>
    </tr>`).join("");
  $("table").innerHTML = `<h3><i data-i="users" style="color:#0396d9"></i>Staff pay <small>· 8 of ${T.n} staff · amounts in RM</small>
      <div class="seg"><span class="on">All outlets</span><span>KL</span><span>JB</span><span>Penang</span></div></h3>
    <table>
      <tr><th>Staff</th><th class="num">Basic salary</th><th class="num">Allowance / OT</th><th class="num st">EPF<span class="auto">${BOLT}Auto</span></th><th class="num st">SOCSO &amp; EIS</th><th class="num st">PCB</th><th class="num">Net pay</th><th>Payslip</th></tr>
      ${body}
      <tr class="tot"><td>Total · ${T.n} staff</td><td class="num">${money(T.basic)}</td><td class="num">${money(T.add)}</td><td class="num st">${money(T.epf[0])}</td><td class="num st">${money(T.ss[0])}</td><td class="num st">${money(T.pcb)}</td><td class="num">${money(T.net)}</td><td></td></tr>
    </table>
    <div class="tfoot"><i data-i="wa"></i>Once approved, each payslip goes to the staff member's app and WhatsApp.<span class="more">All ${T.n} staff →</span></div>`;
</script>
<script src="shell.js"></script>
<script src="icons.js"></script>
</body></html>
