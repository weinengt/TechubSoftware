<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Software customisation inside Techub: request CR-0142 from Demo Clinic.
     ?s=estimate (the AI work-hour estimate and the quote) | testing (free testing and integration before it goes live).
     In the moving picture a phone stands over the lower right corner, so the spots (hours, quote, testing) keep to the
     left three quarters of the screen and the right-hand column only holds details. */
  :root { --w: 1024px; --h: 720px; }
  .top { gap: 10px; }
  .top h1 { white-space: nowrap; }
  .btn svg { width: 15px; height: 15px; }
  .top .chip { height: 26px; padding: 0 10px; font-size: 11px; }
  .top .chip svg { width: 13px; height: 13px; }
  .content { gap: 12px; }

  /* Request and step tracker */
  .req { padding: 14px 16px 15px; flex-shrink: 0; }
  .rh { display: flex; align-items: center; gap: 12px; }
  .crid { height: 40px; padding: 0 11px; border-radius: 10px; background: linear-gradient(135deg, var(--brand-d), var(--brand)); color: #fff; display: grid; place-items: center; text-align: center; flex-shrink: 0; font-size: 12px; font-weight: 800; letter-spacing: .02em; line-height: 1.05; box-shadow: 0 6px 14px -8px rgba(0,80,160,.9); }
  .crid small { display: block; font-size: 8.5px; font-weight: 600; letter-spacing: .08em; opacity: .75; }
  .rt { min-width: 0; }
  .rt h2 { font-size: 16px; font-weight: 800; letter-spacing: -.015em; white-space: nowrap; }
  .rt p { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .rt p b { color: var(--ink2); font-weight: 650; }
  .wa { width: 16px; height: 16px; border-radius: 99px; background: #25d366; color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .wa svg { width: 10px; height: 10px; stroke-width: 2.4; }
  .rmeta { margin-left: auto; display: flex; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 8px; background: #f8fafc; border: 1px solid #edf1f6; font-size: 11px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
  .pill svg { width: 13px; height: 13px; color: var(--muted); }
  .pill .xl { width: 14px; height: 16px; border-radius: 3px; background: #16a34a; color: #fff; font-size: 6.5px; font-weight: 800; display: grid; place-items: end center; padding-bottom: 2px; letter-spacing: -.02em; }

  .steps { display: grid; grid-template-columns: repeat(6, 1fr); margin-top: 14px; padding-top: 13px; border-top: 1px solid #eef2f7; }
  .st { position: relative; min-width: 0; }
  .st::after { content: ""; position: absolute; left: 32px; right: 8px; top: 11px; height: 2px; border-radius: 2px; background: #e3e9f0; }
  .st:last-child::after { display: none; }
  .st .dot { width: 24px; height: 24px; border-radius: 99px; display: grid; place-items: center; background: #fff; border: 2px solid #d5dde7; color: #94a3b8; font-size: 11px; font-weight: 750; position: relative; }
  .st .dot svg { width: 13px; height: 13px; stroke-width: 3; }
  .st b { display: flex; align-items: center; gap: 5px; height: 17px; margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  .st small { display: block; margin-top: 1px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .st.up b { color: #64748b; font-weight: 650; }
  .st.done .dot { background: var(--brand); border-color: var(--brand); color: #fff; }
  .st.done::after { background: var(--brand); }
  .st.cur .dot { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 4px rgba(3,150,217,.16); }
  .st.cur .dot::after { content: ""; width: 8px; height: 8px; border-radius: 99px; background: var(--brand); }
  .st.cur small { color: var(--brand); font-weight: 650; }
  .st.cur::after { background: linear-gradient(90deg, var(--brand) 0 30%, #e3e9f0 30%); }
  .free { display: inline-flex; align-items: center; height: 16px; padding: 0 6px; border-radius: 99px; background: #dcfce7; color: #15803d; font-size: 9.5px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; }

  /* Main row */
  .rw { flex: 1; min-height: 0; display: flex; gap: 12px; }
  .rw > .card { display: flex; flex-direction: column; min-height: 0; }
  .card h3 svg { width: 16px; height: 16px; }
  .card h3 .when { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--muted); }
  .badge { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; color: #fff; }
  .badge svg { width: 15px !important; height: 15px !important; }
  .badge.ai { background: linear-gradient(135deg, #0396d9, #00cfcb); box-shadow: 0 6px 12px -6px rgba(3,150,217,.8); }
  .badge.q { background: linear-gradient(135deg, #0b2f55, #0050a0); }
  .badge.t { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 6px 12px -6px rgba(5,150,105,.8); }

  /* AI estimate */
  .est { width: 362px; flex-shrink: 0; }
  .lead { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .tasks { margin-top: 6px; }
  .task { display: flex; align-items: flex-start; gap: 10px; padding: 13px 0; border-bottom: 1px solid #eef2f7; }
  .task .n { width: 20px; height: 20px; border-radius: 6px; background: var(--brand-50); color: #036295; font-size: 10.5px; font-weight: 800; display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; }
  .task .tx { flex: 1; min-width: 0; }
  .task b { display: block; font-size: 12.5px; font-weight: 650; line-height: 1.3; }
  .task small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .task .h { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: 1px; }
  .task .h em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .task.fr { border-bottom: 0; }
  .task.fr .n { background: #dcfce7; color: #15803d; }
  .task.fr .n svg { width: 12px; height: 12px; stroke-width: 3; }
  .task.fr b { color: var(--ink2); }
  .task .free { margin-top: 2px; height: 18px; font-size: 10px; padding: 0 7px; }
  .tot { margin-top: auto; border-radius: 12px; padding: 15px 16px 14px; background: linear-gradient(135deg, #f0f9ff, #effcfb); border: 1px solid #cdeefa; }
  .tot .k { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #036295; text-transform: uppercase; letter-spacing: .05em; }
  .tot .k svg { width: 13px; height: 13px; }
  .tot .v { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
  .tot .v b { font-size: 44px; font-weight: 850; letter-spacing: -.035em; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tot .v span { font-size: 15px; font-weight: 700; color: var(--ink2); }
  .split { display: flex; gap: 3px; height: 8px; margin-top: 13px; }
  .split i { display: block; border-radius: 3px; }
  .tot p { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 11px; color: var(--ink2); }
  .tot p b { font-weight: 700; color: var(--ink); }
  .tot p svg { width: 13px; height: 13px; color: #059669; stroke-width: 2.4; }

  /* Quote */
  .quote { width: 320px; flex-shrink: 0; position: relative; border-color: #bfe3f7; box-shadow: 0 14px 30px -18px rgba(3,110,170,.55), 0 1px 2px rgba(15,23,42,.04); }
  .quote h3 .chip { margin-left: auto; }
  .plan { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 9px 10px; border-radius: 10px; background: #f8fafc; border: 1px solid #edf1f6; }
  .plan .pb { width: 34px; height: 34px; border-radius: 9px; background: #0b2f55; color: #fff; display: grid; place-items: center; text-align: center; font-size: 13px; font-weight: 800; line-height: 1; flex-shrink: 0; }
  .plan .pb small { display: block; font-size: 7.5px; font-weight: 700; letter-spacing: .06em; opacity: .7; margin-top: 1px; }
  .plan div small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 500; }
  .plan div b { display: block; font-size: 12.5px; font-weight: 750; margin-top: 1px; white-space: nowrap; }
  .ln { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #eef2f7; }
  .ln:first-of-type { margin-top: 4px; }
  .ln .tx { flex: 1; min-width: 0; }
  .ln b { display: block; font-size: 12.5px; font-weight: 650; }
  .ln small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .ln .am { font-size: 13px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ln .am.g { color: #059669; }
  .ttl { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: linear-gradient(135deg, #f0f9ff, #effcfb); border: 1px solid #cdeefa; }
  .ttl span { font-size: 12.5px; font-weight: 750; color: var(--ink); }
  .ttl span small { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); margin-top: 1px; }
  .ttl b { font-size: 32px; font-weight: 850; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .ttl b em { font-style: normal; font-size: 16px; font-weight: 750; color: var(--ink2); margin-right: 4px; letter-spacing: -.01em; }
  .inst { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 10px; border-radius: 9px; background: #f5f3ff; color: #5b21b6; font-size: 11.5px; font-weight: 650; }
  .inst svg { width: 15px; height: 15px; }
  .inst span { margin-left: auto; font-size: 11px; font-weight: 650; color: #7c3aed; }
  .approve { margin-top: auto; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, var(--brand), #0287c4); color: #fff; font-size: 13.5px; font-weight: 750; box-shadow: 0 10px 20px -10px rgba(3,150,217,.95); }
  .approve svg { width: 16px; height: 16px; stroke-width: 2.6; }
  .cmp { margin-top: 8px; font-size: 11px; color: var(--muted); text-align: center; }
  .wa2 { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 9px; font-size: 11px; color: var(--muted); }
  .wa2 svg { width: 13px; height: 13px; color: #16a34a; }
  .cmp s { color: #94a3b8; }

  /* Right-hand column (details) */
  .rc { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .rc .card { display: flex; flex-direction: column; }
  .msg { margin-top: 10px; padding: 9px 10px; border-radius: 4px 10px 10px 10px; background: #e7fbe3; font-size: 11.5px; line-height: 1.45; color: #1f2937; font-family: Inter, "Noto Color Emoji", sans-serif; }
  .msg small { display: block; text-align: right; font-size: 10px; color: #64748b; margin-top: 3px; }
  .att { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 7px 9px; border: 1px solid #edf1f6; border-radius: 9px; font-size: 11px; font-weight: 600; color: var(--ink2); }
  .att .xl { width: 22px; height: 26px; border-radius: 5px; background: #16a34a; color: #fff; font-size: 7px; font-weight: 800; display: grid; place-items: end center; padding-bottom: 4px; flex-shrink: 0; }
  .att small { display: block; font-size: 10px; color: var(--muted); font-weight: 500; }
  .rates { margin-top: 8px; display: flex; flex-direction: column; }
  .rate { display: flex; align-items: center; font-size: 11.5px; color: var(--ink2); padding: 6px 8px; margin: 0 -8px; border-radius: 8px; }
  .rate span { margin-left: auto; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .rate.me { background: var(--brand-50); color: #036295; font-weight: 650; }
  .rate.me span { color: #036295; }
  .rate .you { margin-left: 6px; font-size: 9px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #fff; background: var(--brand); border-radius: 4px; padding: 1px 4px; }
  .rc .note2 { margin-top: auto; padding-top: 8px; font-size: 10.5px; color: var(--muted); line-height: 1.4; }

  /* Testing */
  .test { flex: 1; min-width: 0; border-color: #bbf0d9; box-shadow: 0 14px 30px -18px rgba(5,150,105,.45), 0 1px 2px rgba(15,23,42,.04); }
  .test h3 .chg { margin-left: auto; display: flex; align-items: baseline; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .test h3 .chg b { font-size: 20px; font-weight: 850; color: #059669; letter-spacing: -.02em; }
  .pass { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: linear-gradient(135deg, #ecfdf5, #f0fdf9); border: 1px solid #c6f1dd; }
  .pass .big { font-size: 14px; font-weight: 800; color: #065f46; white-space: nowrap; }
  .pass .big small { display: block; font-size: 10.5px; font-weight: 500; color: #047857; margin-top: 1px; }
  .pbar { flex: 1; height: 8px; border-radius: 99px; background: #d1fae5; overflow: hidden; display: flex; gap: 2px; }
  .pbar i { flex: 1; background: #10b981; }
  .checks { margin-top: 6px; }
  .ck { display: flex; align-items: center; gap: 11px; padding: 9px 2px; border-bottom: 1px solid #eef2f7; }
  .ck:last-child { border-bottom: 0; }
  .ck .tk { width: 22px; height: 22px; border-radius: 99px; background: #10b981; color: #fff; display: grid; place-items: center; flex-shrink: 0; box-shadow: 0 3px 8px -4px rgba(5,150,105,.9); }
  .ck .tk svg { width: 13px; height: 13px; stroke-width: 3; }
  .ck .tx { flex: 1; min-width: 0; }
  .ck b { display: block; font-size: 12.5px; font-weight: 650; }
  .ck small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .ck .ev { font-size: 11px; font-weight: 600; color: var(--ink2); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
  .ck .ct { width: 44px; text-align: right; font-size: 11px; font-weight: 750; color: #059669; font-variant-numeric: tabular-nums; }
  .tfoot { display: flex; align-items: center; gap: 8px; margin: auto -14px -14px; padding: 10px 14px; border-top: 1px solid #eef2f7; background: #f8fafc; border-radius: 0 0 12px 12px; font-size: 11.5px; color: var(--ink2); }
  .tfoot svg { width: 15px; height: 15px; color: #059669; }
  .tfoot b { color: var(--ink); font-weight: 700; }

  .live { background: linear-gradient(160deg, #0b2f55, #0a3d70 55%, #0b5c99); border: 0; color: #cfe6f7; position: relative; overflow: hidden; }
  .live::before { content: ""; position: absolute; right: -40px; top: -50px; width: 170px; height: 170px; border-radius: 99px; background: radial-gradient(closest-side, rgba(0,207,203,.28), transparent); }
  .live > * { position: relative; }
  .live .moon { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.12); display: grid; place-items: center; color: #fde68a; }
  .live .moon svg { width: 18px; height: 18px; }
  .live h4 { margin-top: 12px; font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -.01em; }
  .live .tm { margin-top: 2px; font-size: 12px; font-weight: 650; color: #7dd3fc; }
  .live p { margin-top: 10px; font-size: 11.5px; line-height: 1.5; }
  .live p b { color: #fff; font-weight: 700; }
  .live .row { display: flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 11px; color: #e0f2fe; }
  .live .row svg { width: 14px; height: 14px; color: #5eead4; }
  .recap .ln:first-of-type { margin-top: 2px; }
  .recap .ln { padding: 8px 0; }
  .recap .sum { display: flex; justify-content: space-between; align-items: baseline; padding-top: 9px; font-size: 12px; font-weight: 700; }
  .recap .sum b { font-size: 16px; font-weight: 850; font-variant-numeric: tabular-nums; }
  .by { margin-top: auto; display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 10px; background: #f8fafc; border: 1px solid #edf1f6; }
  .by .av { width: 28px; height: 28px; font-size: 10px; }
  .by b { display: block; font-size: 11.5px; font-weight: 700; }
  .by small { display: block; font-size: 10px; line-height: 1.35; color: var(--muted); margin-top: 1px; white-space: nowrap; }
</style></head>
<body>
<div class="app">
  <aside class="side" data-shell="clinic" data-active=""></aside>
  <section class="main">
    <header class="top">
      <div><div class="sub">Demo Clinic · Kuala Lumpur</div><h1>Customisation request</h1></div>
      <span id="state" style="margin-left:auto"></span>
      <span class="btn"><svg class="i" viewBox="0 0 24 24" style="color:#16a34a"><path d="M3 21l1.7-5A8.5 8.5 0 1112 20.5a8.4 8.4 0 01-4-1L3 21z"/></svg>Chat with Techub</span>
      <span class="btn" id="doc"></span>
    </header>
    <div class="content">
      <div class="card req">
        <div class="rh">
          <span class="crid"><span><small>REQUEST</small>CR-0142</span></span>
          <div class="rt">
            <h2>Prima Health panel claim export</h2>
            <p><span class="wa"><svg class="i" viewBox="0 0 24 24"><path d="M7.5 12.5l3 3 6-6.5"/></svg></span>Requested by <b>Dr. Lim Wei Jie</b> on WhatsApp · 13 Oct 2026, 9:12 AM</p>
          </div>
          <div class="rmeta">
            <span class="pill"><i data-i="card"></i>Billing → Panel claims</span>
            <span class="pill"><i data-i="file"></i>New Excel export</span>
          </div>
        </div>
        <div class="steps" id="steps"></div>
      </div>
      <div class="rw" id="rw"></div>
    </div>
  </section>
</div>
<script>
  const S = new URLSearchParams(location.search).get("s") === "testing" ? "testing" : "estimate";
  const $ = (id) => document.getElementById(id);
  const X = {
    spark: '<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8L12 3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/>',
    receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    flask: '<path d="M9 3h6M10 3v6.5L4.8 18.2A1.9 1.9 0 006.4 21h11.2a1.9 1.9 0 001.6-2.8L14 9.5V3"/><path d="M7.4 15h9.2"/>',
    moon: '<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    wa: '<path d="M3 21l1.7-5A8.5 8.5 0 1112 20.5a8.4 8.4 0 01-4-1L3 21z"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.5a3.5 3.5 0 010 7"/><path d="M18 14.5a6.5 6.5 0 013.5 5.5"/>',
    card: '<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/>',
    tag: '<path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L2 12V2h10l8.6 8.6a2 2 0 010 2.8z"/><path d="M7 7h.01"/>',
    shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  };
  const I = (n, st = "") => `<svg class="i" viewBox="0 0 24 24"${st ? ` style="${st}"` : ""}>${X[n]}</svg>`;

  // Step tracker: [name, note, state]
  const STEPS = {
    estimate: [["Request", "13 Oct · 9:12 AM", "done"], ["AI estimate", "6.0 h · 9:20 AM", "done"], ["Quote", "Waiting for approval", "cur"],
      ["Build", "About 1 working day", "up"], ["Testing", "Included, RM 0", "up", 1], ["Live", "Target 15 Oct", "up"]],
    testing: [["Request", "13 Oct · 9:12 AM", "done"], ["AI estimate", "13 Oct · 6.0 h", "done"], ["Quote", "Approved 13 Oct", "done"],
      ["Build", "Done 14 Oct", "done"], ["Testing", "14 of 14 passed", "cur", 1], ["Live", "Tonight, 11:00 PM", "up"]],
  }[S];
  $("steps").innerHTML = STEPS.map(([n, note, st, free], i) => `<div class="st ${st}"><span class="dot">${st === "done" ? I("check") : st === "cur" ? "" : i + 1}</span>
    <b>${n}${free ? '<span class="free">Free</span>' : ""}</b><small>${note}</small></div>`).join("");

  if (S === "estimate") {
    $("state").outerHTML = `<span class="chip a" style="margin-left:auto">${I("receipt")}Quote sent · awaiting approval</span>`;
    $("doc").innerHTML = `<i data-i="file"></i>Quote PDF`;
    const tasks = [
      ["Map claim fields to their template", "Member ID, IC no., diagnosis and panel codes", 2],
      ["Build the new Excel export", "Their columns and sheet, one click a month", 3],
      ["Panel codes and totals check", "Every row ties back to your bills", 1],
    ];
    const tc = ["#0396d9", "#00b8c4", "#8b5cf6"];
    $("rw").innerHTML = `
      <div class="card est">
        <h3><span class="badge ai">${I("spark")}</span>AI work-hour estimate<span class="when">13 Oct · 9:20 AM</span></h3>
