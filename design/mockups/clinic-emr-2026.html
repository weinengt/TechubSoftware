<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* Public clinics go digital: the picture for the clinic paper-to-EMR blog post. ?lang=en|ms|zh */
  :root { --w: 1000px; --h: 625px; }
  body { background: linear-gradient(140deg, #062a4d 0%, #0a4a7a 60%, #0b6d93 100%); color: #fff; position: relative; }
  body::before { content: ""; position: absolute; right: -160px; top: -200px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(0,207,203,.22), rgba(0,207,203,0) 70%); }
  .wrap { position: relative; z-index: 1; height: 100%; padding: 34px 48px 0; display: flex; flex-direction: column; }
  .tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 99px; padding: 6px 14px 6px 8px; font-size: 13px; font-weight: 750; letter-spacing: .08em; }
  .tag i { width: 22px; height: 22px; border-radius: 99px; background: linear-gradient(135deg, #5fd4ff, #00cfcb); display: grid; place-items: center; }
  .tag i svg { width: 13px; height: 13px; stroke: #062a4d; fill: none; stroke-width: 2.6; stroke-linecap: round; }
  h1 { margin-top: 14px; font-size: 33px; line-height: 1.15; font-weight: 850; letter-spacing: -.02em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #5fd4ff, #00e0d9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stats { margin-top: 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .s { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 10px 14px; }
  .s b { display: block; font-size: 21px; font-weight: 850; white-space: nowrap; }
  .s span { display: block; margin-top: 2px; font-size: 11.5px; color: #b9d8f0; line-height: 1.3; }
  .row { margin-top: 16px; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, .85fr) 56px minmax(0, 1.25fr); align-items: center; }
  /* Paper */
  .paper { position: relative; height: 100%; max-height: 270px; }
  .card { position: absolute; width: 230px; height: 160px; border-radius: 10px; background: #f6efe0; box-shadow: 0 12px 24px -12px rgba(0,0,0,.6); padding: 14px 16px; color: #7a6a48; }
  .card .l { height: 7px; border-radius: 4px; background: #d9cba8; margin-top: 10px; }
  .card.c1 { left: 10px; top: 40px; transform: rotate(-8deg); }
  .card.c2 { left: 40px; top: 70px; transform: rotate(5deg); background: #efe6d2; }
  .card.c3 { left: 24px; top: 96px; transform: rotate(-2deg); background: #fbf6ea; }
  .card .h { font-size: 12px; font-weight: 800; letter-spacing: .05em; color: #8a7650; }
  .stain { position: absolute; right: 18px; bottom: 16px; width: 60px; height: 44px; border-radius: 50%; background: radial-gradient(circle, rgba(120,90,40,.25), rgba(120,90,40,0) 70%); }
  .miss { position: absolute; left: 70px; top: 6px; z-index: 3; background: #ef4444; color: #fff; font-size: 12px; font-weight: 800; padding: 6px 12px; border-radius: 99px; box-shadow: 0 8px 16px -8px rgba(0,0,0,.6); white-space: nowrap; }
  .arrow { display: grid; place-items: center; }
  .arrow span { width: 44px; height: 44px; border-radius: 99px; background: linear-gradient(135deg, #5fd4ff, #00cfcb); display: grid; place-items: center; box-shadow: 0 10px 20px -10px rgba(0,0,0,.6); }
  .arrow svg { width: 22px; height: 22px; stroke: #062a4d; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  /* Digital */
  .rec { background: #fff; color: var(--ink); border-radius: 18px; padding: 16px 18px; box-shadow: 0 30px 50px -22px rgba(0,0,0,.6); }
  .rec .top { display: flex; align-items: center; gap: 12px; }
  .rec .av { width: 40px; height: 40px; border-radius: 99px; background: linear-gradient(135deg, #0396d9, #0050a0); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
  .rec .top b { display: block; font-size: 15px; color: var(--navy); }
  .rec .top small { display: block; font-size: 11.5px; color: var(--muted); }
  .rec .al { margin-left: auto; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; font-size: 11.5px; font-weight: 800; padding: 5px 10px; border-radius: 99px; white-space: nowrap; }
  .rec .grid { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rec .it { background: #f4f8fc; border-radius: 10px; padding: 9px 11px; }
  .rec .it small { display: block; font-size: 10.5px; font-weight: 750; letter-spacing: .05em; color: var(--muted); }
  .rec .it b { display: block; margin-top: 3px; font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rec .up { margin-top: 8px; display: flex; align-items: center; gap: 10px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 10px; padding: 9px 11px; font-size: 12.5px; font-weight: 700; color: #065f46; }
  .rec .up i { width: 20px; height: 20px; flex-shrink: 0; border-radius: 99px; background: linear-gradient(135deg, #10b981, #047857); display: grid; place-items: center; }
  .rec .up i svg { width: 11px; height: 11px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .rec .up span.r { margin-left: auto; font-weight: 600; color: #047857; font-size: 11.5px; }
  .ft { display: flex; align-items: center; gap: 10px; padding: 16px 0 18px; font-size: 12px; color: #9cc3e4; }
  .ft img { width: 26px; height: 26px; border-radius: 7px; background: #fff; padding: 3px; }
  .ft b { color: #fff; font-weight: 750; }
  .ft .r { margin-left: auto; }
  html[lang="zh"] h1 { letter-spacing: 0; font-size: 31px; }
</style></head>
<body>
<div class="wrap">
  <div class="tag"><i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i><span data-t="tag"></span></div>
  <h1 data-t="title"></h1>
  <div class="stats" id="stats"></div>
  <div class="row">
    <div class="paper">
      <div class="miss" data-t="miss"></div>
      <div class="card c1"><div class="h" data-t="card"></div><div class="l" style="width:80%"></div><div class="l" style="width:60%"></div><div class="l" style="width:70%"></div></div>
      <div class="card c2"><div class="h" data-t="card"></div><div class="l" style="width:75%"></div><div class="l" style="width:50%"></div><div class="l" style="width:65%"></div></div>
      <div class="card c3"><div class="h" data-t="card"></div><div class="l" style="width:85%"></div><div class="l" style="width:55%"></div><div class="l" style="width:72%"></div><div class="stain"></div></div>
    </div>
    <div class="arrow"><span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
    <div class="rec">
      <div class="top"><div class="av">DP</div><div><b data-t="name"></b><small data-t="ic"></small></div><div class="al" data-t="allergy"></div></div>
      <div class="grid" id="grid"></div>
      <div class="up"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><span data-t="upload"></span><span class="r" data-t="upwhen"></span></div>
    </div>
  </div>
  <div class="ft"><img src="icon.png" alt=""><b>Techub Software</b><span class="r" data-t="note"></span></div>
</div>
<script>
const lang = new URLSearchParams(location.search).get("lang") || "en";
document.documentElement.lang = lang;
const T = {
  en: {
    tag: "MOH · EMR 2026", title: "Public clinics go digital. <em>Is your clinic still on paper?</em>",
    stats: [["RM 1 bil", "for healthcare digitalisation"], ["150", "public hospitals"], ["2,000", "health clinics"], ["2029", "EMR target for public care"]],
    miss: "File not found", card: "PATIENT CARD",
    name: "Demo Patient", ic: "IC 800101-14-XXXX · Sample record", allergy: "Allergy: Penicillin",
    grid: [["LAST VISIT", "12 Oct 2026"], ["DIAGNOSIS", "Upper respiratory infection"], ["MEDICATION", "Paracetamol 500 mg"], ["PLAN", "Review in 1 week"]],
    upload: "Lab report uploaded", upwhen: "Demo Lab · today",
    note: "Sources: Bernama, Malay Mail · Oct 2026",
  },
  ms: {
    tag: "KKM · EMR 2026", title: "Klinik kerajaan guna digital. <em>Klinik anda masih guna kertas?</em>",
    stats: [["RM 1 bil", "untuk pendigitalan kesihatan"], ["150", "hospital kerajaan"], ["2,000", "klinik kesihatan"], ["2029", "sasaran EMR fasiliti awam"]],
    miss: "Fail tak jumpa", card: "KAD PESAKIT",
    name: "Pesakit Demo", ic: "IC 800101-14-XXXX · Rekod contoh", allergy: "Alahan: Penisilin",
    grid: [["LAWATAN TERAKHIR", "12 Okt 2026"], ["DIAGNOSIS", "Jangkitan saluran pernafasan"], ["UBAT", "Paracetamol 500 mg"], ["PELAN", "Semak semula 1 minggu"]],
    upload: "Laporan makmal dimuat naik", upwhen: "Demo Lab · hari ini",
    note: "Sumber: Bernama, Malay Mail · Okt 2026",
  },
  zh: {
    tag: "卫生部 · 电子病历 2026", title: "政府诊所全面电子化，<br><em>你的诊所还在用纸本吗？</em>",
    stats: [["RM 10 亿", "医疗数码化拨款"], ["150", "间政府医院"], ["2,000", "间卫生诊所"], ["2029", "公共医疗电子病历目标"]],
    miss: "找不到病历", card: "病历卡",
    name: "示范病人", ic: "IC 800101-14-XXXX · 示例病历", allergy: "过敏：盘尼西林",
    grid: [["上次就诊", "2026 年 10 月 12 日"], ["诊断", "上呼吸道感染"], ["药物", "Paracetamol 500 mg"], ["计划", "1 周后复诊"]],
    upload: "化验报告已上传", upwhen: "Demo Lab · 今天",
    note: "资料来源：Bernama、Malay Mail · 2026 年 10 月",
  },
}[lang];
document.querySelectorAll("[data-t]").forEach((el) => (el.innerHTML = T[el.dataset.t]));
document.getElementById("stats").innerHTML = T.stats.map(([b, s]) => `<div class="s"><b>${b}</b><span>${s}</span></div>`).join("");
document.getElementById("grid").innerHTML = T.grid.map(([s, b]) => `<div class="it"><small>${s}</small><b>${b}</b></div>`).join("");
</script>
</body></html>
