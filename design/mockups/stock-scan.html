<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="phone.css">
<style>
  /* Phone camera scanning the barcode label on a carton: the item is found with its stock, rack and last activities
     (Digital Rice Cooker 1.8L, batch B2410-031, as on the stock trail screen). */
  :root { --w: 360px; --h: 760px; }
  .ph { width: 100%; height: 100%; display: flex; flex-direction: column; background: #0d1117; color: #fff; position: relative; overflow: hidden; }
  .ctl { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px; font-size: 15px; font-weight: 650; }
  .ctl span.c { width: 36px; height: 36px; border-radius: 99px; background: rgba(255,255,255,.12); display: grid; place-items: center; } .ctl svg { width: 19px; height: 19px; }
  .cam { position: relative; height: 366px; margin-top: 2px; overflow: hidden; background: radial-gradient(circle at 50% 35%, #6b6152, #2b2620 72%); }
  .carton { position: absolute; left: 34px; top: 48px; width: 300px; height: 280px; transform: rotate(-4deg); border-radius: 4px;
    background: linear-gradient(135deg, #d6ae76, #c29459 55%, #b0844b); box-shadow: 0 24px 40px rgba(0,0,0,.55); overflow: hidden; }
  .carton::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 3px, rgba(0,0,0,.03) 3px 6px); }
  .carton .tape { position: absolute; left: 0; right: 0; top: 0; height: 40px; background: rgba(216,192,150,.8); }
  .carton .print { position: absolute; left: 18px; top: 196px; font-size: 13px; font-weight: 900; letter-spacing: .1em; color: rgba(60,38,10,.5); line-height: 1.2; }
  .lbl { position: absolute; left: 70px; top: 64px; width: 196px; background: #fff; border-radius: 6px; padding: 8px 10px 7px; color: #111; box-shadow: 0 3px 8px rgba(0,0,0,.25); }
  .lbl .t1 { display: flex; justify-content: space-between; font-size: 6.5px; font-weight: 800; letter-spacing: .12em; color: #374151; }
  .lbl .t2 { font-size: 10.5px; font-weight: 850; margin-top: 2px; white-space: nowrap; }
  .lbl .t3 { font-size: 8px; font-weight: 600; color: #374151; margin-top: 1px; }
  .lbl .row { display: flex; gap: 8px; align-items: flex-end; margin-top: 5px; }
  .lbl svg.ean { width: 124px; height: auto; display: block; }
  .lbl svg.qr { width: 48px; height: 48px; display: block; }
  .bcw { position: relative; display: block; }
  .hit { position: absolute; left: -5px; top: -5px; right: -5px; bottom: -4px; border: 2.5px solid #2ee6d6; border-radius: 6px; box-shadow: 0 0 0 3px rgba(46,230,214,.25), 0 0 22px rgba(46,230,214,.55); }
  .hit::after { content: "✓"; position: absolute; right: -10px; top: -10px; width: 20px; height: 20px; border-radius: 99px; background: #10b981; color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; }
  .brk { position: absolute; width: 34px; height: 34px; border: 3.5px solid #2ee6d6; }
  .brk.tl { top: 22px; left: 28px; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; } .brk.tr { top: 22px; right: 28px; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
  .brk.bl { bottom: 72px; left: 28px; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; } .brk.br { bottom: 72px; right: 28px; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
  .scanline { position: absolute; left: 30px; right: 30px; top: 168px; height: 3px; background: linear-gradient(90deg, transparent, #2ee6d6, transparent); box-shadow: 0 0 18px 4px rgba(46,230,214,.55); }
  .pill { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.6); backdrop-filter: blur(4px); border-radius: 99px; padding: 6px 12px; font-size: 11.5px; font-weight: 600; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .pill svg { width: 14px; height: 14px; color: #2ee6d6; }
  .pill b { font-variant-numeric: tabular-nums; letter-spacing: .02em; }

  .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 374px; background: #fff; color: var(--ink); border-radius: 22px 22px 0 0; padding: 9px 14px 14px; display: flex; flex-direction: column; }
  .handle { width: 40px; height: 4px; border-radius: 9px; background: #e2e8f0; margin: 0 auto 9px; }
  .found { border: 1px solid #bae6fd; background: linear-gradient(135deg, #f2fbff, #fff); border-radius: 14px; padding: 10px 11px; box-shadow: 0 10px 22px -16px rgba(3,150,217,.7); }
  .fh { display: flex; align-items: center; gap: 10px; }
  .fh .pic { width: 44px; height: 44px; border-radius: 12px; background: #ec48991f; display: grid; place-items: center; flex-shrink: 0; }
  .fh .pic svg { width: 36px; height: 36px; }
  .fh b { display: block; font-size: 14px; font-weight: 800; letter-spacing: -.01em; }
  .fh small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .fh .chip { margin-left: auto; align-self: flex-start; }
  .chip svg { width: 11px; height: 11px; stroke-width: 2.6; }
  .kv { display: grid; grid-template-columns: 1fr 1.15fr .9fr; gap: 6px; margin-top: 9px; }
  .kv div { background: #f8fafc; border-radius: 9px; padding: 5px 8px; }
  .kv span { display: block; font-size: 9.5px; color: var(--muted); }
  .kv b { font-size: 15px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kv .on { background: var(--brand-50); } .kv .on b { color: #036295; }
  .kv .loc b { display: inline-flex; align-items: center; gap: 3px; color: #b45309; } .kv .loc b svg { width: 12px; height: 12px; stroke-width: 2.4; }
  .lh { display: flex; align-items: center; margin-top: 11px; font-size: 12px; font-weight: 750; }
  .lh span { margin-left: auto; font-size: 11px; color: var(--brand); font-weight: 600; }
  .ac { display: flex; align-items: center; gap: 9px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; }
  .ac:last-of-type { border-bottom: 0; }
  .ac .d { width: 28px; height: 28px; border-radius: 99px; display: grid; place-items: center; color: #fff; flex-shrink: 0; }
  .ac .d svg { width: 14px; height: 14px; stroke-width: 2.2; }
  .ac b { display: block; font-size: 12px; font-weight: 700; }
  .ac small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; }
  .ac .tm { margin-left: auto; font-size: 10.5px; font-weight: 650; color: var(--muted); white-space: nowrap; }
  .btns { margin-top: auto; display: flex; gap: 8px; }
  .btns span { height: 44px; border-radius: 13px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 13.5px; font-weight: 700; }
  .btns span svg { width: 17px; height: 17px; }
  .btns .s { flex: .8; border: 1px solid var(--line); color: var(--ink2); }
  .btns .p { flex: 1.2; background: linear-gradient(135deg, #0396d9, #0287c4); color: #fff; box-shadow: 0 8px 20px -8px rgba(3,150,217,.8); }
</style></head>
<body>
<div class="ph">
  <div class="status" style="color:#fff"><span>4:58</span><span class="r"><span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span><span style="font-size:11px">5G</span><span class="bat"><i></i></span></span></div>
  <div class="ctl"><span class="c"><i data-i="x"></i></span>Scan Item<span class="c"><i data-i="flash"></i></span></div>
  <div class="cam">
    <div class="carton"><span class="tape"></span>
      <div class="lbl"><div class="t1"><span>DEMO TRADING</span><span>RC-1800</span></div><div class="t2">DIGITAL RICE COOKER 1.8L</div><div class="t3">Batch B2410-031</div>
        <div class="row"><span id="ean" class="bcw"></span><span id="qr"></span></div></div>
      <div class="print">RICE COOKER<br>1.8L · 8 PCS</div>
    </div>
    <span class="brk tl"></span><span class="brk tr"></span><span class="brk bl"></span><span class="brk br"></span>
    <div class="scanline"></div>
    <div class="pill"><i data-i="barcode"></i>Barcode found · <b id="code"></b></div>
  </div>
  <div class="sheet">
    <div class="handle"></div>
    <div class="found" id="found">
      <div class="fh"><span class="pic" id="pic"></span><div><b>Digital Rice Cooker 1.8L</b><small>RC-1800 · Batch B2410-031</small></div><span class="chip g"><i data-i="check"></i>Found</span></div>
      <div class="kv">
        <div class="on"><span>On hand</span><b>96</b></div>
        <div class="loc"><span>Location</span><b><i data-i="pin"></i>A-03-2</b></div>
        <div><span>Sold</span><b>24</b></div>
      </div>
    </div>
    <div class="lh">Last activity<span>3 of 6</span></div>
    <div id="acts"></div>
    <div class="btns"><span class="s"><i data-i="stockin"></i>Stock in</span><span class="p"><i data-i="layers"></i>View full trail</span></div>
  </div>
</div>
<script>
  // Small product pictures (48px box), tinted with the item colour
  const ILL = {
    rc: (c) => `<rect x="20" y="7" width="8" height="4" rx="2" fill="#334155"/><path d="M8 22c0-6.5 7.2-10.5 16-10.5S40 15.5 40 22v14a6 6 0 01-6 6H14a6 6 0 01-6-6z" fill="${c}"/><path d="M8.5 22h31" stroke="#fff" stroke-width="1.6" opacity=".75"/><rect x="16" y="27" width="16" height="9" rx="2.5" fill="#fff" opacity=".92"/><circle cx="20.5" cy="31.5" r="1.6" fill="${c}"/><rect x="24" y="30.3" width="5" height="2.4" rx="1.2" fill="#94a3b8"/>`,
    ek: (c) => `<rect x="17" y="6" width="12" height="4" rx="2" fill="#334155"/><path d="M16 10h14l4.5 30h-23z" fill="${c}"/><path d="M14.5 17L7 12.5v4.5l6.5 5.5z" fill="${c}"/><path d="M32 14c6 0 7.5 4.5 7.5 9.5S37 32 33.5 33" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="9.5" y="40" width="27" height="4" rx="2" fill="#334155"/><rect x="21" y="20" width="4" height="12" rx="2" fill="#fff" opacity=".85"/>`,
    af: (c) => `<rect x="10" y="5" width="28" height="38" rx="9" fill="${c}"/><circle cx="24" cy="14" r="4" fill="#fff" opacity=".92"/><circle cx="24" cy="14" r="1.5" fill="${c}"/><rect x="14" y="22" width="20" height="16" rx="4" fill="#1e293b"/><rect x="18.5" y="28" width="11" height="3.2" rx="1.6" fill="#94a3b8"/>`,
    sf: (c) => `<circle cx="24" cy="16" r="12.5" fill="#fff" stroke="${c}" stroke-width="2.6"/><ellipse cx="24" cy="10" rx="3.6" ry="6" fill="${c}"/><ellipse cx="24" cy="10" rx="3.6" ry="6" fill="${c}" transform="rotate(120 24 16)"/><ellipse cx="24" cy="10" rx="3.6" ry="6" fill="${c}" transform="rotate(240 24 16)"/><circle cx="24" cy="16" r="2.6" fill="#334155"/><rect x="22.5" y="28.5" width="3" height="11" fill="#334155"/><ellipse cx="24" cy="41.5" rx="10" ry="3" fill="#334155"/>`,
    si: (c) => `<path d="M17 21c0-6 3.5-9.5 9-9.5h9a4 4 0 014 4V21" stroke="#334155" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M5 35c2.2-10 10-15.5 21.5-15.5H39a4 4 0 014 4V35z" fill="${c}"/><rect x="4" y="35" width="40" height="4.5" rx="2.2" fill="#94a3b8"/><circle cx="34" cy="27.5" r="2.6" fill="#fff" opacity=".9"/>`,
    bl: (c) => `<rect x="12.5" y="3.5" width="23" height="4.5" rx="2" fill="#334155"/><path d="M14 8h20l-3 19H17z" fill="${c}" opacity=".45"/><path d="M19 13h10" stroke="#fff" stroke-width="1.6" opacity=".8"/><path d="M14.5 27h19l2.5 15H12z" fill="${c}"/><circle cx="24" cy="34.5" r="2.8" fill="#fff" opacity=".92"/>`,
    led: (c) => `<path d="M24 4.5a12.5 12.5 0 00-7.3 22.6c1.3 1 2.1 2.5 2.1 4.1V33h10.4v-1.8c0-1.6.8-3.1 2.1-4.1A12.5 12.5 0 0024 4.5z" fill="${c}"/><path d="M20.5 15.5a4.5 4.5 0 014-3.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/><rect x="18.8" y="34" width="10.4" height="3" rx="1.2" fill="#94a3b8"/><rect x="18.8" y="38" width="10.4" height="3" rx="1.2" fill="#94a3b8"/><path d="M21 42h6l-1.2 3h-3.6z" fill="#334155"/>`,
    es: (c) => `<rect x="3" y="17" width="36" height="14" rx="4" fill="${c}"/>${[0, 1, 2, 3].map((i) => `<rect x="${6.5 + i * 8}" y="20.5" width="6" height="7" rx="1.6" fill="#fff" opacity=".92"/>`).join("")}<path d="M39 24c4 0 5.5 3 5.5 6.5s-1.5 7-5 8" stroke="#334155" stroke-width="2.2" fill="none" stroke-linecap="round"/>`,
  };
  const art = (k, c) => `<svg class="ill" viewBox="0 0 48 48">${ILL[k](c)}</svg>`;
  // EAN-13 barcode (real encoding, check digit added) and a QR-style pattern (decorative)
  const ean13 = (d12, { h = 46, fs = 9, color = "#111", digits = true } = {}) => {
    const L = ["0001101", "0011001", "0010011", "0111101", "0100011", "0110001", "0101111", "0111011", "0110111", "0001011"];
    const G = ["0100111", "0110011", "0011011", "0100001", "0011101", "0111001", "0000101", "0010001", "0001001", "0010111"];
    const R = ["1110010", "1100110", "1101100", "1000010", "1011100", "1001110", "1010000", "1000100", "1001000", "1110100"];
    const P = ["LLLLLL", "LLGLGG", "LLGGLG", "LLGGGL", "LGLLGG", "LGGLLG", "LGGGLL", "LGLGLG", "LGLGGL", "LGGLGL"];
    let s = 0;
    for (let i = 0; i < 12; i++) s += +d12[i] * (i % 2 ? 3 : 1);
    const code = d12 + ((10 - (s % 10)) % 10);
    let bits = "101";
    for (let i = 1; i <= 6; i++) bits += (P[+code[0]][i - 1] === "L" ? L : G)[+code[i]];
    bits += "01010";
    for (let i = 7; i <= 12; i++) bits += R[+code[i]];
    bits += "101";
    const guard = (i) => i < 3 || (i >= 45 && i < 50) || i >= 92;
    const ox = 9, gh = digits ? 5 : 0;
    let r = "";
    for (let i = 0; i < 95; ) {
      if (bits[i] !== "1") { i++; continue; }
      let j = i;
      while (j < 95 && bits[j] === "1" && guard(j) === guard(i)) j++;
      r += `<rect x="${ox + i}" y="0" width="${j - i}" height="${guard(i) ? h + gh : h}" fill="${color}"/>`;
      i = j;
    }
    const t = (x, str, ls) => `<text x="${x}" y="${h + fs - 0.5}" font-size="${fs}" font-family="DejaVu Sans Mono, monospace" fill="${color}" text-anchor="middle" letter-spacing="${ls}">${str}</text>`;
    const txt = digits ? t(4, code[0], 0) + t(ox + 24 + 0.5, code.slice(1, 7), 0.95) + t(ox + 71 + 0.5, code.slice(7), 0.95) : "";
    return { code, svg: `<svg class="ean" viewBox="0 0 108 ${h + (digits ? fs + 1 : 0)}" shape-rendering="crispEdges">${r}<g shape-rendering="auto">${txt}</g></svg>` };
  };
  const qrPattern = (seed, color = "#111") => {
    const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
    const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="${color}"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="${color}"/>`;
    let h = `<rect x="-1" y="-1" width="27" height="27" fill="#fff"/>`;
    for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
      const inF = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16);
      const inA = x >= 16 && x <= 20 && y >= 16 && y <= 20;
      if (inF || inA) continue;
      if (y === 6 || x === 6) { if ((x + y) % 2 === 0) h += `<rect x="${x}" y="${y}" width="1" height="1" fill="${color}"/>`; continue; }
      if (rnd() > 0.5) h += `<rect x="${x}" y="${y}" width="1" height="1" fill="${color}"/>`;
    }
    h += `<rect x="16" y="16" width="5" height="5" fill="${color}"/><rect x="17" y="17" width="3" height="3" fill="#fff"/><rect x="18" y="18" width="1" height="1" fill="${color}"/>`;
    return `<svg class="qr" viewBox="-1 -1 27 27" shape-rendering="crispEdges">${h + finder(0, 0) + finder(18, 0) + finder(0, 18)}</svg>`;
  };
  document.getElementById("pic").innerHTML = art("rc", "#ec4899");
  const bc = ean13("200180000031", { h: 30, fs: 9 });
  document.getElementById("ean").innerHTML = bc.svg + `<span class="hit"></span>`;
  document.getElementById("code").textContent = bc.code;
  document.getElementById("qr").innerHTML = qrPattern(17);
  document.getElementById("acts").innerHTML = [
    ["#16a34a", "truck", "Delivered", "DO-2026-0862 · Hafiz Rahman", "3:52 PM"],
    ["#0d9488", "box", "Packed", "24 units · Azman Yusof", "11:40 AM"],
    ["#7c3aed", "cart", "Sold", "INV-2026-1187 · Seri Maju Electrical", "11:05 AM"],
  ].map(([c, i, t, s, tm]) => `<div class="ac"><span class="d" style="background:${c}"><i data-i="${i}"></i></span><div><b>${t}</b><small>${s}</small></div><span class="tm">${tm}</span></div>`).join("");
</script>
<script src="icons.js"></script>
</body></html>
