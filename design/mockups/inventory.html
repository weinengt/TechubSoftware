<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  :root { --w: 1024px; --h: 720px; }
  .search { white-space: nowrap; }
  .stat .v { font-size: 19px; }
  td { padding: 9px 8px; } th { padding: 8px 8px; }
  td:first-child, th:first-child { padding-left: 14px; } td:last-child, th:last-child { padding-right: 14px; }
  td b { font-size: 12.5px; }
  tr.new td { background: #f0fdfa; }
  tr.new td:first-child { box-shadow: inset 3px 0 0 var(--teal); }
  .typ { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 650; padding: 3px 8px; border-radius: 99px; }
  .typ svg { width: 12px; height: 12px; stroke-width: 2.2; }
  .in { background: #dcfce7; color: #15803d; } .out { background: var(--brand-100); color: #036295; } .sale { background: #ede9fe; color: #6d28d9; }
  .tr { background: #e0f2fe; color: #075985; } .adj { background: #fef3c7; color: #b45309; } .wo { background: #fee2e2; color: #b91c1c; }
  .by { display: inline-flex; align-items: center; gap: 4px; }
  .by.bot { color: #0f766e; font-weight: 650; } .by.bot svg { width: 13px; height: 13px; color: var(--teal); }
  .side2 { width: 288px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
  .ai { background: linear-gradient(135deg, #0b2f55, #0050a0 60%, #0396d9); color: #e0f2fe; border-radius: 12px; padding: 14px; font-size: 12px; line-height: 1.5; position: relative; overflow: hidden; }
  .ai::after { content: ""; position: absolute; right: -30px; bottom: -30px; width: 110px; height: 110px; border-radius: 99px; background: rgba(0,207,203,.25); }
  .ai h4 { color: #fff; font-size: 13px; display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .ai h4 .chip { margin-left: auto; background: rgba(255,255,255,.16); color: #fff; }
  .ai b { color: #fff; }
  .ai .btn { margin-top: 10px; background: #fff; color: #0050a0; border: 0; height: 30px; position: relative; z-index: 1; }
  .item h4 { font-size: 14px; font-weight: 800; } .item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .kv div { background: #f8fafc; border-radius: 9px; padding: 6px 9px; } .kv span { font-size: 10px; color: var(--muted); display: block; } .kv b { font-size: 14px; }
  .filters { display: flex; gap: 6px; padding: 0 14px 10px; }
  .filters span { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink2); white-space: nowrap; }
  .filters span.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .exp { display: flex; align-items: center; gap: 10px; margin-top: 9px; font-size: 12px; }
  .exp b { font-size: 12.5px; } .exp small { display: block; color: var(--muted); font-size: 10.5px; margin-top: 1px; }
  .exp .chip { margin-left: auto; }
  .meter { width: 64px; height: 6px; border-radius: 9px; background: #f1f5f9; margin-left: auto; overflow: hidden; flex-shrink: 0; }
  .meter i { display: block; height: 100%; border-radius: 9px; background: var(--red); }
  .tfoot { margin-top: auto; display: flex; align-items: center; padding: 10px 14px 11px; font-size: 11.5px; color: var(--muted); }
  .tfoot .more { margin-left: auto; font-size: 11px; color: var(--brand); font-weight: 600; }
</style></head>
<body>
<div class="app">
  <aside class="side" data-shell="clinic" data-active="Inventory"></aside>
  <section class="main">
    <header class="top">
      <div><div class="sub">Inventory</div><h1>Stock Movement Log</h1></div>
      <div class="search"><i data-i="search"></i>Search item or batch…</div>
      <span class="btn"><i data-i="sliders"></i>Adjust stock</span>
      <span class="btn pri"><i data-i="scan"></i>Scan delivery note</span>
    </header>
    <div class="content">
      <div class="stats" id="stats"></div>
      <div class="row" style="flex:1;min-height:0">
        <div class="card grow" style="padding:0;overflow:hidden;display:flex;flex-direction:column">
          <h3 style="padding:12px 14px 10px"><i data-i="swap" style="color:#0396d9"></i>Every movement, tracked<span class="more">Export ↓</span></h3>
          <div class="filters" id="filters"></div>
          <table id="log"></table>
          <div class="tfoot" id="tfoot"></div>
        </div>
        <div class="side2">
          <div class="ai" id="ai"></div>
          <div class="card item" id="item"></div>
          <div class="card" id="watch" style="flex:1"></div>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
  const q = new URLSearchParams(location.search).get("v");
  const V = ["clinic", "salon", "beauty", "spa"].includes(q) ? q : "clinic";
  // Movement types: [css class, icon, label]
  const T = {
    in: ["in", "scan", "Stock in · DN scan"], disp: ["out", "pill", "Dispensed"], proc: ["out", "steth", "Used in procedure"],
    svc: ["out", "scissors", "Used in service"], trt: ["out", "spark", "Used in treatment"], spa: ["out", "leaf", "Used in treatment"], sale: ["sale", "tag", "Retail sale"],
    otc: ["sale", "tag", "OTC sale"], tr: ["tr", "swap", "Transfer"], adj: ["adj", "sliders", "Adjusted"], wo: ["wo", "trash", "Write-off"],
  };
  // rows: [time, item, detail, type, qty, balance, by (AI: prefix = read by AI, confirmed by)]
  const D = {
    clinic: {
      stats: [["RM 48,250", "412 items · 2 branches"], ["126", "All auto-recorded"], ["5 items", "Reorder suggested"], ["3 batches", "RM 640 value"]],
      filters: ["All", "Stock in", "Dispensed", "Procedures", "Sales", "Transfers", "Adjustments"],
      rows: [
        ["10:42", "Paracetamol 500mg", "Batch B2409 · Exp 08/2028", "in", "+1,000", "1,240", "AI:Aina"],
        ["10:38", "Amoxicillin 250mg", "Rx for Ahmad F. · Room 2", "disp", "−21", "96", "Dr. Lim"],
        ["10:31", "Sterile Gauze 10×10cm", "Wound dressing · Room 1", "proc", "−4", "152", "Nurse Farah"],
        ["10:25", "Vitamin C 1000mg (30s)", "INV-5521 · walk-in", "otc", "−2", "23", "Cashier"],
        ["10:12", "Surgical Mask (50s)", "KL → PJ branch", "tr", "−10", "32", "Manager"],
        ["09:58", "Cetirizine 10mg", "Monthly stock count", "adj", "−3", "58", "Supervisor"],
        ["09:40", "Examination Gloves (100s)", "Batch EG0907 · Exp 09/2029", "in", "+20", "26", "AI:Aina"],
        ["09:15", "Omeprazole 20mg", "Batch OM0201 · expired", "wo", "−14", "186", "Pharmacist"],
      ],
      ai: ["Amoxicillin 250mg", "~2 days", "Order <b>500 caps</b> by <b>Thursday</b> to avoid running out."],
      item: ["Paracetamol 500mg", "SKU PCM-500 · Shelf A3 · 2 batches", "+1,000 received", [["On hand", "1,240"], ["Used / day", "48"], ["Days left", "26"]]],
      watch: ["exp", [["Omeprazole 20mg", "Batch OM0533 · 40 caps", "18 Nov"], ["Salbutamol Inhaler", "Batch SB1120 · 6 units", "2 Dec"], ["Influenza Vaccine", "Batch FV0926 · 12 doses", "9 Dec"]]],
    },
    salon: {
      stats: [["RM 21,380", "264 items · 2 branches"], ["64", "All auto-recorded"], ["3 items", "Reorder suggested"], ["2 batches", "RM 210 value"]],
      filters: ["All", "Stock in", "Used in service", "Sales", "Transfers", "Adjustments"],
      rows: [
        ["10:42", "Hair Colour 6.0 · 60ml", "Batch HC2409 · Exp 09/2029", "in", "+24", "31", "AI:Kelly"],
        ["10:36", "Developer 6% · 1L", "Colour Retouch · Joanne L.", "svc", "−90 ml", "2.4 L", "Mei Fen"],
        ["10:35", "Hair Colour 7.1 · 60ml", "Colour Retouch · Joanne L.", "svc", "−1", "12", "Mei Fen"],
        ["10:25", "Colour Care Shampoo", "INV-5521 · 300ml", "sale", "−2", "16", "Jason Tan"],
        ["10:12", "Keratin Treatment 500ml", "Damansara → Cheras", "tr", "−2", "4", "Kelly Lim"],
        ["09:58", "Argan Hair Oil 100ml", "Stock count · damaged", "adj", "−1", "9", "Kelly Lim"],
        ["09:40", "Bleach Powder 500g", "Batch BP0712 · Exp 07/2028", "in", "+6", "10", "AI:Kelly"],
        ["09:15", "Hair Spa Mask 1kg", "Hair Spa · Nur Izzati", "svc", "−60 g", "1.2 kg", "Aiman"],
      ],
      ai: ["Developer 6% · 1L", "~4 days", "9 colour bookings this week. Order <b>12 bottles</b> by <b>Thursday</b>."],
      item: ["Hair Colour 6.0 · 60ml", "SKU HC-60 · Colour bar · 46 shades", "+24 received", [["On hand", "31"], ["Used / day", "2.5"], ["Days left", "12"]]],
      watch: ["low", [["Developer 6% · 1L", "2.4 L left", 18], ["Keratin Treatment 500ml", "4 bottles", 26], ["Hair Colour 5.0 · 60ml", "3 tubes", 32]]],
    },
    beauty: {
      stats: [["RM 26,940", "318 items · 2 branches"], ["72", "All auto-recorded"], ["3 items", "Reorder suggested"], ["3 batches", "RM 690 value"]],
      filters: ["All", "Stock in", "Used in treatment", "Sales", "Transfers", "Adjustments"],
      rows: [
        ["10:42", "Hyaluronic Serum 30ml", "Batch HY2409 · Exp 09/2028", "in", "+24", "38", "AI:Sarah"],
        ["10:35", "Hydrating Sheet Mask", "Hydra Facial · Chloe T.", "trt", "−1", "41", "Mei Ling"],
        ["10:28", "Lash Glue 5ml", "Lash Extension · Priya D.", "trt", "−1", "3", "Nadia"],
        ["10:21", "Vitamin C Serum 30ml", "INV-7730 · retail", "sale", "−1", "13", "Mei Ling"],
        ["10:12", "Gel Polish #12 Nude", "Subang → Puchong", "tr", "−3", "5", "Sarah Ng"],
        ["09:58", "Gel Top Coat 15ml", "Stock count · broken", "adj", "−1", "11", "Sarah Ng"],
        ["09:40", "Gel Base Coat 15ml", "Batch GB0930 · Exp 03/2028", "in", "+12", "16", "AI:Sarah"],
        ["09:15", "Hard Wax Beads 1kg", "Full Leg Wax · Aina Z.", "trt", "−80 g", "1.6 kg", "Kavitha"],
      ],
      ai: ["Lash Glue 5ml", "~3 days", "11 lash bookings this week. Order <b>10 bottles</b> by <b>Thursday</b>."],
      item: ["Hyaluronic Serum 30ml", "SKU HY-30 · Shelf B2 · 2 batches", "+24 received", [["On hand", "38"], ["Used / day", "3"], ["Days left", "13"]]],
      watch: ["exp", [["Vitamin C Serum 30ml", "Batch VC0212 · 6 bottles", "18 Nov"], ["Clay Mask 500g", "Batch CM0420 · 2 tubs", "2 Dec"], ["Hydrating Sheet Mask", "Batch SM0815 · 10 pcs", "9 Dec"]]],
    },
    spa: {
      stats: [["RM 19,760", "186 items · 2 branches"], ["48", "All auto-recorded"], ["3 items", "Reorder suggested"], ["2 batches", "RM 320 value"]],
      filters: ["All", "Stock in", "Used in treatment", "Sales", "Transfers", "Adjustments"],
      rows: [
        ["10:42", "Lavender Massage Oil 1L", "Batch MO0712 · Exp 07/2028", "in", "+12", "15", "AI:Jenny"],
        ["10:36", "Coconut Body Scrub 1kg", "Body Scrub · Farah H.", "spa", "−150 g", "2.4 kg", "Wati"],
        ["10:30", "Sweet Almond Oil 1L", "Aromatherapy · Nur I.", "spa", "−80 ml", "3.1 L", "Lakshmi"],
        ["10:25", "Aromatherapy Candle 200g", "INV-8812 · retail", "sale", "−2", "20", "Front desk"],
        ["10:12", "Bath Towel 70×140", "Bangsar → Mont Kiara", "tr", "−20", "140", "Jenny Lau"],
        ["09:58", "Face Towel (white)", "Laundry count", "adj", "−6", "214", "Jenny Lau"],
        ["09:40", "Rose Bath Salt 500g", "Batch BS0930 · Exp 09/2028", "in", "+10", "12", "AI:Jenny"],
        ["09:15", "Herbal Compress Ball", "Thai Herbal · Kumar S.", "spa", "−2", "26", "Noraini"],
      ],
      ai: ["Coconut Body Scrub 1kg", "~3 days", "12 scrubs booked this week. Order <b>6 tubs</b> by <b>Thursday</b>."],
      item: ["Lavender Massage Oil 1L", "SKU MO-1L · Store room · 2 batches", "+12 received", [["On hand", "15"], ["Used / day", "0.7"], ["Days left", "21"]]],
      watch: ["low", [["Coconut Body Scrub 1kg", "2.4 kg left", 20], ["Eucalyptus Oil 10ml", "3 bottles", 28], ["Disposable Briefs (50s)", "1 pack", 14]]],
    },
  }[V];

  const icons = [["box", "b"], ["swap", "g"], ["alert", "r"], ["clock", "a"]];
  const labels = ["Stock value", "Movements today", "Low stock", "Expiring in 60 days"];
  const dcol = ["#64748b", "", "#dc2626", "#d97706"];
  document.getElementById("stats").innerHTML = D.stats.map(([v, d], i) =>
    `<div class="stat"><span class="ic ${icons[i][1]}"><i data-i="${icons[i][0]}"></i></span><div><div class="k">${labels[i]}</div><div class="v">${v}</div><div class="d"${dcol[i] ? ` style="color:${dcol[i]}"` : ""}>${d}</div></div></div>`).join("");
  document.getElementById("filters").innerHTML = D.filters.map((f, i) => `<span class="${i ? "" : "on"}">${f}</span>`).join("");
  document.getElementById("log").innerHTML = `<tr><th>Time</th><th>Item</th><th>Type</th><th class="num">Qty</th><th class="num">Balance</th><th>By</th></tr>` +
    D.rows.map(([t, it, det, ty, qn, bal, by], i) => {
      const [cls, ic, lab] = T[ty];
      const who = by.startsWith("AI:") ? `<span class="by bot"><i data-i="spark"></i>AI · ${by.slice(3)}</span>` : by;
      return `<tr class="${i ? "" : "new"}"><td>${t}</td><td><b>${it}</b><small>${det}</small></td><td><span class="typ ${cls}"><i data-i="${ic}"></i>${lab}</span></td>
        <td class="num ${qn.startsWith("+") ? "pos" : "neg"}">${qn}</td><td class="num">${bal}</td><td>${who}</td></tr>`;
    }).join("");
document.getElementById("tfoot").innerHTML = `Showing ${D.rows.length} of ${D.stats[1][0]} movements today<span class="more">View all →</span>`;
  const [aItem, aDays, aTxt] = D.ai;
  document.getElementById("ai").innerHTML = `<h4><i data-i="spark" style="width:18px;height:18px;color:#5eead4"></i>AI stock insight<span class="chip">Reorder</span></h4>
    <b>${aItem}</b> will run out in <b>${aDays}</b> at the current rate. ${aTxt}
    <br><span class="btn"><i data-i="file"></i>Create purchase order</span>`;
  const [iName, iMeta, iSpike, kv] = D.item;
  document.getElementById("item").innerHTML = `<h4>${iName}</h4><div class="meta">${iMeta}</div>
    <svg viewBox="0 0 260 92" style="width:100%;margin-top:8px;display:block">
      <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0396d9" stop-opacity=".28"/><stop offset="1" stop-color="#0396d9" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" x2="260" y1="70" y2="70" stroke="#ef4444" stroke-dasharray="4 4" stroke-width="1.2"/>
      <text x="258" y="64" font-size="9" fill="#ef4444" text-anchor="end" font-family="Inter">Reorder level</text>
      <path d="M0 26 L27 33 L54 41 L80 48 L107 55 L134 63 L161 76 L170 80 L170 14 L197 21 L224 28 L260 35 L260 92 L0 92 Z" fill="url(#g)"/>
      <path d="M0 26 L27 33 L54 41 L80 48 L107 55 L134 63 L161 76 L170 80 L170 14 L197 21 L224 28 L260 35" fill="none" stroke="#0396d9" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="170" cy="14" r="4.5" fill="#fff" stroke="#10b981" stroke-width="2.4"/>
      <text x="164" y="11" font-size="9.5" font-weight="700" fill="#059669" font-family="Inter" text-anchor="end">${iSpike}</text>
    </svg>
    <div class="kv">${kv.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>`;
  const [wType, wRows] = D.watch;
  document.getElementById("watch").innerHTML = wType === "exp"
    ? `<h3><i data-i="clock" style="color:#d97706"></i>Expiring soon<span class="chip a" style="margin-left:auto">${wRows.length} batches</span></h3>` +
      wRows.map(([n, m, d]) => `<div class="exp"><div><b>${n}</b><small>${m}</small></div><span class="chip a">${d}</span></div>`).join("")
    : `<h3><i data-i="alert" style="color:#dc2626"></i>Low stock<span class="chip r" style="margin-left:auto">${wRows.length} items</span></h3>` +
      wRows.map(([n, m, pct]) => `<div class="exp"><div><b>${n}</b><small>${m}</small></div><span class="meter"><i style="width:${pct}%"></i></span></div>`).join("");
</script>
<script src="shell.js"></script>
<script src="icons.js"></script>
</body></html>
