<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="phone.css">
<style>
  /* The customer pays online through the business's payment gateway: a booking deposit or the full amount (?v=clinic|salon|beauty|spa),
     or a live selling order (?v=live). The money goes to the business's own merchant account. */
  :root { --w: 360px; --h: 760px; }
  .ph { width: 100%; height: 100%; display: flex; flex-direction: column; background: #f4f7fb; position: relative; overflow: hidden; }
  .ph::before { content: ""; position: absolute; left: -40px; top: 20px; width: 440px; height: 260px; border-radius: 50%; background: radial-gradient(closest-side, rgba(3,150,217,.12), rgba(3,150,217,0)); pointer-events: none; }
  .ph > * { position: relative; flex-shrink: 0; }
  .tb { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 46px; }
  .cb { width: 36px; height: 36px; border-radius: 99px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink2); flex-shrink: 0; }
  .cb svg { width: 18px; height: 18px; stroke-width: 2.1; }
  .biz { margin: 0 auto; display: inline-flex; align-items: center; gap: 7px; background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px 4px 4px; font-size: 12.5px; font-weight: 750; white-space: nowrap; }
  .biz .lg { width: 26px; height: 26px; border-radius: 99px; color: #fff; display: grid; place-items: center; }
  .biz .lg svg { width: 14px; height: 14px; stroke-width: 2.2; }
  .live { display: inline-flex; align-items: center; gap: 4px; background: #ef4444; color: #fff; font-size: 9px; font-weight: 800; letter-spacing: .07em; line-height: 15px; padding: 0 5px; border-radius: 4px; }
  .live i { width: 5px; height: 5px; border-radius: 99px; background: #fff; }
  .tb .sp { width: 36px; flex-shrink: 0; }

  .hero { padding: 4px 18px 0; text-align: center; }
  .sec { width: 46px; height: 46px; margin: 0 auto; border-radius: 99px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #34d399, #059669); box-shadow: 0 0 0 6px rgba(16,185,129,.13), 0 10px 20px -10px rgba(5,150,105,.85); }
  .sec svg { width: 22px; height: 22px; stroke-width: 2.3; }
  .hero h1 { font-size: 23px; font-weight: 850; letter-spacing: -.02em; margin-top: 9px; }
  .hero p { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  .body { padding: 14px 14px 0; display: flex; flex-direction: column; gap: 9px; }
  .box { background: #fff; border: 1px solid var(--line); border-radius: 15px; padding: 11px 12px; box-shadow: 0 1px 2px rgba(15,23,42,.03); }
  .bh { display: flex; align-items: center; font-size: 12.5px; font-weight: 800; }
  .bh span { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted); }
  .it { display: flex; align-items: center; gap: 11px; }
  .bh + .it { margin-top: 9px; }
  .it + .it { margin-top: 8px; }
  .th { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; overflow: hidden; flex-shrink: 0; }
  .th > svg.i { width: 21px; height: 21px; }
  .th > svg:not(.i) { height: 37px; width: auto; }
  .it .tx { min-width: 0; }
  .it .tx b { display: block; font-size: 13px; font-weight: 750; white-space: nowrap; }
  .it .tx small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .it .am { margin-left: auto; font-size: 12.5px; font-weight: 750; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sum { border-top: 1px dashed #d8e0ea; margin-top: 10px; padding-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .sum div { display: flex; font-size: 12px; color: var(--ink2); }
  .sum div span:last-child { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
  .sum div.tot { margin-top: 1px; font-size: 13px; font-weight: 800; color: var(--ink); align-items: baseline; }
  .sum div.tot span:last-child { font-size: 17px; font-weight: 850; letter-spacing: -.01em; }

  /* Deposit or full amount */
  .amt { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .op { position: relative; border: 1.5px solid var(--line); border-radius: 13px; padding: 9px 11px 10px; background: #fff; }
  .op small { display: block; font-size: 11px; font-weight: 650; color: var(--muted); }
  .op b { display: block; font-size: 18px; font-weight: 850; letter-spacing: -.01em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .op em { display: block; font-style: normal; font-size: 10.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; }
  .op.on { border-color: var(--brand); background: linear-gradient(180deg, #f2fbff, #fff); box-shadow: 0 6px 16px -10px rgba(3,150,217,.8); }
  .op.on small { color: var(--brand); }
  .op .tick { position: absolute; top: 9px; right: 9px; width: 18px; height: 18px; border-radius: 99px; background: var(--brand); color: #fff; display: grid; place-items: center; }
  .op .tick svg { width: 11px; height: 11px; stroke-width: 3.2; }

  /* Payment methods */
  .pm { display: flex; align-items: center; gap: 11px; height: 42px; padding: 0 10px; margin-top: 7px; border: 1.5px solid #eef2f7; border-radius: 12px; }
  .bh + .pm { margin-top: 9px; }
  .pm .mi { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; }
  .pm .mi svg { width: 17px; height: 17px; stroke-width: 2; }
  .pm b { font-size: 12.5px; font-weight: 700; }
  .pm small { font-size: 10.5px; color: var(--muted); margin-left: 6px; font-weight: 600; }
  .pm .tag { font-size: 9.5px; font-weight: 800; letter-spacing: .04em; color: #0b2f55; background: #e0ecf8; border-radius: 5px; padding: 0 5px; line-height: 16px; margin-left: 6px; }
  .pm .rd { margin-left: auto; width: 18px; height: 18px; border-radius: 99px; border: 1.5px solid #cbd5e1; flex-shrink: 0; }
  .pm.on { border-color: var(--brand); background: #f5fbff; }
  .pm.on .rd { border: 5px solid var(--brand); }

  /* Paid to the business's own account */
  .to { display: flex; align-items: center; gap: 11px; background: linear-gradient(135deg, #f0fdf4, #dcfce7); border-color: #bbf7d0; }
  .to .ic2 { width: 38px; height: 38px; border-radius: 11px; background: #22c55e; color: #fff; display: grid; place-items: center; flex-shrink: 0; box-shadow: 0 6px 12px -6px rgba(22,163,74,.8); }
  .to .ic2 svg { width: 20px; height: 20px; stroke-width: 2.1; }
  .to b { display: block; font-size: 12.5px; font-weight: 800; color: #14532d; white-space: nowrap; }
  .to small { display: block; font-size: 11px; color: #15803d; font-weight: 600; margin-top: 2px; white-space: nowrap; }

  .pay { margin: 12px 14px 0; height: 50px; border-radius: 14px; background: linear-gradient(135deg, #0396d9, #0287c4); color: #fff; font-size: 15.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 10px 20px -10px rgba(3,150,217,.95); }
  .pay svg { width: 17px; height: 17px; stroke-width: 2.3; }
  .fine { text-align: center; margin-top: 10px; font-size: 11px; font-weight: 600; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 5px; }
  .fine svg { width: 13px; height: 13px; stroke-width: 2.2; }
  /* Live selling: two products and shipping, so the rows are a little tighter */
  .tight .sec { width: 40px; height: 40px; }
  .tight .sec svg { width: 19px; height: 19px; }
  .tight .hero h1 { margin-top: 8px; }
  .tight .body { gap: 8px; }
  .tight .th { width: 38px; height: 38px; }
  .tight .th > svg:not(.i) { height: 33px; }
  .tight .it + .it { margin-top: 6px; }
  .tight .sum { margin-top: 8px; padding-top: 7px; gap: 4px; }
  .tight .pm { height: 36px; margin-top: 5px; }
  .tight .pay { margin-top: 10px; }
  .tight .fine { margin-top: 8px; }
</style></head>
<body>
<div class="ph" id="ph"></div>
<script>
  const q = new URLSearchParams(location.search).get("v");
  const V = ["clinic", "salon", "beauty", "spa", "live"].includes(q) ? q : "salon";
  const IC = {
    bag: '<path d="M5.5 8h13l-1 12.5h-11z"/><path d="M9 10.5V7a3 3 0 016 0v3.5"/>',
    bank: '<path d="M3 9.5L12 4l9 5.5"/><path d="M5 10v7.5M9.7 10v7.5M14.3 10v7.5M19 10v7.5"/><path d="M3 20.5h18"/>',
  };
  const I = (n) => `<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
  // Same product pictures as live-shop.html and live-checkout.html
  const ART = {
    tudung: `<svg viewBox="0 0 100 100"><defs>
        <linearGradient id="td" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaa6b8"/><stop offset="1" stop-color="#cf7d96"/></linearGradient></defs>
      <path d="M10 100C12 87 25 81 50 80s38 7 40 20z" fill="#f3e5d8"/>
      <path d="M50 12C31 12 23.5 25 23.5 39.5c0 11-3 19.5-10 29.5C25 78.5 38 88 50 96c12-8 25-17.5 36.5-27-7-10-10-18.5-10-29.5C76.5 25 69 12 50 12z" fill="url(#td)"/>
      <ellipse cx="50" cy="43" rx="13" ry="16.5" fill="#f5d6c3"/>
      <path d="M37 38.5c.6-8.6 5.8-13 13-13s12.4 4.4 13 13c-3.4-5.4-7.6-7.4-13-7.4s-9.6 2-13 7.4z" fill="#b9607b"/>
      <path d="M36 62c4 9 8.5 18.5 13.6 30M64 62c-4 9-8.5 18.5-13.6 30M27 66c6 7.5 13 16 21 25M73 66c-6 7.5-13 16-21 25" stroke="#b25a76" stroke-width="1.3" fill="none" opacity=".4" stroke-linecap="round"/>
      <circle cx="50" cy="62" r="2.8" fill="#fbbf24" stroke="#fff" stroke-width="1.1"/></svg>`,
    lipstick: `<svg viewBox="0 0 100 100"><defs>
        <linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#a77f30"/><stop offset=".45" stop-color="#f3d991"/><stop offset="1" stop-color="#9c752a"/></linearGradient>
        <linearGradient id="lb" x1="0" x2="1"><stop offset="0" stop-color="#111827"/><stop offset=".45" stop-color="#3b4252"/><stop offset="1" stop-color="#0b1220"/></linearGradient></defs>
      ${[[27, 33, "#d77a6c"], [50, 20, "#c8102e"], [73, 36, "#9b2a5c"]].map(([x, t, c]) => `
        <path d="M${x - 5.5} 52V${t + 8}L${x + 5.5} ${t}V52z" fill="${c}"/>
        <rect x="${x - 7}" y="50" width="14" height="11" rx="1" fill="url(#lg)"/>
        <rect x="${x - 9}" y="60" width="18" height="32" rx="2.6" fill="url(#lb)"/>
        <rect x="${x - 9}" y="60" width="18" height="4.2" fill="url(#lg)"/>`).join("")}</svg>`,
  };

  // Sample bookings match the WhatsApp reminders in whatsapp.html where they can.
  const D = {
    clinic: {
      biz: "Demo Clinic", own: "the clinic's", icon: "steth", logo: "linear-gradient(135deg,#38bdf8,#0284c7)", tile: ["#eef9fe", "#0396d9"],
      hi: "Ahmad", item: "Full Health Screening", sub: "Dr. Lim Wei Jie · Thu, 15 Oct · 9:30 AM", full: 280, deposit: 50,
    },
    salon: {
      biz: "Demo Hair Salon", own: "the salon's", icon: "scissors", logo: "linear-gradient(135deg,#a78bfa,#7c3aed)", tile: ["#f5f3ff", "#7c3aed"],
      hi: "Wen Qi", item: "Colour & Treatment", sub: "Stylist Mei Fen · Wed, 14 Oct · 11:00 AM", full: 238, deposit: 50,
    },
    beauty: {
      biz: "Demo Beauty Centre", own: "the centre's", icon: "face", logo: "linear-gradient(135deg,#f472b6,#db2777)", tile: ["#fdf2f8", "#db2777"],
      hi: "Nadia", item: "Hydra Facial (60 min)", sub: "Beautician Mei Ling · Wed, 14 Oct · 2:00 PM", full: 188, deposit: 30,
    },
    spa: {
      biz: "Demo Day Spa", own: "the spa's", icon: "leaf", logo: "linear-gradient(135deg,#2dd4bf,#0d9488)", tile: ["#f0fdfa", "#0d9488"],
      hi: "Priya", item: "Balinese Massage (90 min)", sub: "Therapist Aisyah · Wed, 14 Oct · 10:30 AM", full: 168, deposit: 40,
    },
    live: {
      biz: "Demo Live Shop", own: "the shop's", icon: "bag", logo: "linear-gradient(135deg,#f472b6,#db2777)", hi: "Nur Aisyah",
      items: [["tudung", "Tudung Bawal Premium", 29.9, "linear-gradient(140deg,#fdf2f8,#fbcfe8)"], ["lipstick", "Lipstick Matte Set", 39.9, "linear-gradient(140deg,#fff1f2,#fecdd3)"]],
      shipping: 8,
    },
  }[V];
  const rm = (n) => `RM ${n.toFixed(2)}`;
  const logo = (n) => (IC[n] ? I(n) : `<i data-i="${n}"></i>`);
  const live = V === "live";
  const total = live ? D.items.reduce((s, x) => s + x[2], 0) + D.shipping : D.deposit;

  const order = live
    ? `<div class="box">
        <div class="bh">Your order<span>Tonight's live sale</span></div>
        ${D.items.map(([art, name, price, bg]) => `<div class="it"><span class="th" style="background:${bg}">${ART[art]}</span><div class="tx"><b>${name}</b><small>Qty 1 × ${rm(price)}</small></div><span class="am">${rm(price)}</span></div>`).join("")}
        <div class="sum"><div><span>Shipping</span><span>${rm(D.shipping)}</span></div><div class="tot"><span>Total to pay</span><span>${rm(total)}</span></div></div>
      </div>`
    : `<div class="box">
        <div class="it"><span class="th" style="background:${D.tile[0]};color:${D.tile[1]}"><i data-i="${D.icon}"></i></span><div class="tx"><b>${D.item}</b><small>${D.sub}</small></div></div>
      </div>
      <div class="amt">
        <div class="op on"><span class="tick"><i data-i="check"></i></span><small>Deposit</small><b>${rm(D.deposit)}</b><em>Balance ${rm(D.full - D.deposit)} later</em></div>
        <div class="op"><small>Full amount</small><b>${rm(D.full)}</b><em>Nothing to pay later</em></div>
      </div>`;

  const methods = [
    ["bank", "Online banking", '<span class="tag">FPX</span>', "#eef9fe", "#0396d9", true],
    ["card", "Credit / debit card", "", "#f5f3ff", "#7c3aed"],
    ["wallet", "e-Wallet", "", "#fff7ed", "#ea580c"],
    ["qr", "DuitNow QR", "", "#fdf2f8", "#db2777"],
  ];

  if (live) document.getElementById("ph").classList.add("tight");
  document.getElementById("ph").innerHTML = `
    <div class="status"><span>${live ? "8:41" : "6:18"}</span><span class="r"><span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span><span style="font-size:11px">5G</span><span class="bat"><i></i></span></span></div>
    <div class="tb"><span class="cb"><i data-i="chevL"></i></span><span class="biz"><span class="lg" style="background:${D.logo}">${logo(D.icon)}</span>${D.biz}${live ? '<span class="live"><i></i>LIVE</span>' : ""}</span><span class="sp"></span></div>
    <div class="hero">
      <span class="sec"><i data-i="lock"></i></span>
      <h1>${live ? "Checkout" : "Confirm & pay"}</h1>
      <p>${live ? `Hi ${D.hi}, pay now and the items are yours.` : `Hi ${D.hi}, pay online to confirm your booking.`}</p>
    </div>
    <div class="body">
      ${order}
      <div class="box to"><span class="ic2">${I("bank")}</span><div><b>Paid straight to ${D.biz}</b><small>Into ${D.own} own merchant account</small></div></div>
      <div class="box">
        <div class="bh">Pay with</div>
        ${methods.map(([ic, label, tag, bg, fg, on]) => `<div class="pm${on ? " on" : ""}"><span class="mi" style="background:${bg};color:${fg}">${logo(ic)}</span><b>${label}</b>${tag}<span class="rd"></span></div>`).join("")}
      </div>
    </div>
    <div class="pay"><i data-i="lock"></i>Pay ${rm(total)}</div>
    <div class="fine"><i data-i="shield"></i>Payment gateway secured · Receipt on WhatsApp</div>`;
</script>
<script src="icons.js"></script>
</body></html>
