<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* RTS Link JB: the picture for the RTS Link blog post. ?lang=en|ms|zh */
  :root { --w: 1000px; --h: 625px; }
  body { background: linear-gradient(140deg, #062a4d 0%, #0a4a7a 60%, #0b6d93 100%); color: #fff; position: relative; }
  body::before { content: ""; position: absolute; right: -160px; bottom: -220px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(0,207,203,.25), rgba(0,207,203,0) 70%); }
  .wrap { position: relative; z-index: 1; height: 100%; padding: 40px 48px 0; display: grid; grid-template-columns: 1fr 330px; grid-template-rows: auto 1fr auto; column-gap: 34px; }
  .left { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; }
  .tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 99px; padding: 6px 14px 6px 8px; font-size: 13px; font-weight: 750; letter-spacing: .08em; }
  .tag i { width: 22px; height: 22px; border-radius: 99px; background: linear-gradient(135deg, #5fd4ff, #00cfcb); display: grid; place-items: center; }
  .tag i svg { width: 13px; height: 13px; stroke: #062a4d; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin-top: 18px; font-size: 36px; line-height: 1.12; font-weight: 850; letter-spacing: -.02em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #5fd4ff, #00e0d9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* Route */
  .route { margin-top: 56px; position: relative; height: 128px; }
  .route .line { position: absolute; left: 44px; right: 44px; top: 42px; height: 6px; border-radius: 6px; background: repeating-linear-gradient(90deg, #5fd4ff 0 18px, rgba(95,212,255,.35) 18px 26px); }
  .st { position: absolute; top: 24px; width: 150px; text-align: center; white-space: nowrap; }
  .st.l { left: -31px; } .st.r { right: -31px; }
  .st .dot { width: 42px; height: 42px; margin: 0 auto; border-radius: 99px; background: #fff; border: 6px solid #00cfcb; box-shadow: 0 0 0 6px rgba(0,207,203,.25); }
  .st b { display: block; margin-top: 10px; font-size: 15px; font-weight: 800; }
  .st small { display: block; font-size: 12px; color: #9cc3e4; margin-top: 1px; }
  .train { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: #fff; color: var(--navy); border-radius: 12px; padding: 8px 14px; box-shadow: 0 14px 26px -12px rgba(0,0,0,.6); font-weight: 850; font-size: 20px; white-space: nowrap; }
  .train svg { width: 22px; height: 22px; stroke: #0396d9; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .train small { font-size: 12px; font-weight: 650; color: var(--muted); }
  .stats { grid-column: 1; grid-row: 2; align-self: end; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .s { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 14px 16px; }
  .s b { display: block; font-size: 24px; font-weight: 850; letter-spacing: -.01em; }
  .s span { display: block; margin-top: 3px; font-size: 12px; color: #b9d8f0; line-height: 1.35; }
  /* Checklist */
  .card { grid-column: 2; grid-row: 1 / 3; align-self: center; background: #fff; color: var(--ink); border-radius: 20px; padding: 22px 22px 18px; box-shadow: 0 30px 50px -22px rgba(0,0,0,.6); }
  .card h2 { font-size: 18px; font-weight: 800; color: var(--navy); }
  .card p.sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .card ul { list-style: none; margin-top: 14px; display: flex; flex-direction: column; gap: 9px; }
  .card li { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 12px; background: #f4f8fc; font-size: 13.5px; font-weight: 650; color: var(--ink2); }
  .card li i { width: 24px; height: 24px; flex-shrink: 0; border-radius: 99px; background: linear-gradient(135deg, #10b981, #047857); display: grid; place-items: center; }
  .card li i svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .ft { grid-column: 1 / 3; grid-row: 3; display: flex; align-items: center; gap: 10px; padding: 20px 0 22px; font-size: 12px; color: #9cc3e4; }
  .ft img { width: 26px; height: 26px; border-radius: 7px; background: #fff; padding: 3px; }
  .ft b { color: #fff; font-weight: 750; }
  .ft .r { margin-left: auto; }
  html[lang="zh"] h1 { letter-spacing: 0; }
</style></head>
<body>
<div class="wrap">
  <div class="left">
    <div class="tag"><i><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="14" rx="3"/><path d="M6 11h12M9 21l-1.5-2M15 21l1.5-2"/></svg></i><span data-t="tag"></span></div>
    <h1 data-t="title"></h1>
    <div class="route">
      <div class="line"></div>
      <div class="st l"><div class="dot"></div><b>Woodlands North</b><small data-t="sg"></small></div>
      <div class="train"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-t="time"></span></div>
      <div class="st r"><div class="dot"></div><b>Bukit Chagar</b><small data-t="jb"></small></div>
    </div>
  </div>
  <div class="card"><h2 data-t="ready"></h2><p class="sub" data-t="readySub"></p><ul id="list"></ul></div>
  <div class="stats" id="stats"></div>
  <div class="ft"><img src="icon.png" alt=""><b>Techub Software</b><span class="r" data-t="note"></span></div>
</div>
<script>
const lang = new URLSearchParams(location.search).get("lang") || "en";
document.documentElement.lang = lang;
const T = {
  en: {
    tag: "RTS LINK · FEB 2027", title: "Is your <em>JB clinic, salon or spa</em> ready?",
    sg: "Singapore", jb: "Johor Bahru", time: "≈ 5 min",
    ready: "Get ready before February", readySub: "6 steps for busier days",
    list: ["Online booking, any time", "Automatic WhatsApp reminders", "Online deposits", "Queue number calling", "Enough stock for peak days", "English, Malay & Chinese"],
    stats: [["10,000", "passengers an hour, each direction"], ["Feb 2027", "service start, after final approvals"], ["1 stop", "immigration cleared at the station"]],
    note: "Sources: LTA, Bernama · Oct 2026",
  },
  ms: {
    tag: "RTS LINK · FEB 2027", title: "<em>Klinik, salon atau spa</em> anda di JB dah sedia?",
    sg: "Singapura", jb: "Johor Bahru", time: "≈ 5 minit",
    ready: "Bersedia sebelum Februari", readySub: "6 langkah untuk hari lebih sibuk",
    list: ["Booking online bila-bila masa", "Peringatan WhatsApp automatik", "Deposit online", "Panggilan nombor giliran", "Stok cukup untuk hari puncak", "English, Melayu & Cina"],
    stats: [["10,000", "penumpang sejam, setiap arah"], ["Feb 2027", "mula beroperasi, selepas kelulusan akhir"], ["1 hentian", "imigresen selesai di stesen"]],
    note: "Sumber: LTA, Bernama · Okt 2026",
  },
  zh: {
    tag: "RTS 捷运 · 2027 年 2 月", title: "你在新山的<em>诊所、发廊或 SPA</em><br>准备好了吗？",
    sg: "新加坡", jb: "新山", time: "≈ 5 分钟",
    ready: "2 月前准备好", readySub: "迎接更忙日子的 6 项准备",
    list: ["随时在线预约", "自动 WhatsApp 提醒", "在线收订金", "排队叫号系统", "高峰日库存充足", "英文、马来文和中文"],
    stats: [["10,000", "每个方向每小时载客量"], ["2027 年 2 月", "最终批准后开始载客"], ["一站通关", "在车站完成移民手续"]],
    note: "资料来源：LTA、Bernama · 2026 年 10 月",
  },
}[lang];
document.querySelectorAll("[data-t]").forEach((el) => (el.innerHTML = T[el.dataset.t]));
const tick = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
document.getElementById("list").innerHTML = T.list.map((x) => `<li><i>${tick}</i>${x}</li>`).join("");
document.getElementById("stats").innerHTML = T.stats.map(([b, s]) => `<div class="s"><b>${b}</b><span>${s}</span></div>`).join("");
</script>
</body></html>
