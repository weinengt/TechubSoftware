<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="phone.css">
<style>
  /* Techub Live Selling: the buyer's order confirmation after paying during the live. Same sample data as live-shop.html */
  :root { --w: 360px; --h: 760px; }
  .ph { width: 100%; height: 100%; display: flex; flex-direction: column; background: #f4f7fb; position: relative; overflow: hidden; }
  .ph::before { content: ""; position: absolute; left: 0; top: 46px; width: 360px; height: 270px; border-radius: 50%; background: radial-gradient(closest-side, rgba(16,185,129,.13), rgba(16,185,129,0)); pointer-events: none; }
  .ph > * { position: relative; flex-shrink: 0; }
  svg.i.f { fill: currentColor; stroke: none; }
  .tb { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 44px; }
  .cb { width: 36px; height: 36px; border-radius: 99px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink2); flex-shrink: 0; }
  .cb svg { width: 18px; height: 18px; stroke-width: 2.1; }
  .shopc { margin: 0 auto; display: inline-flex; align-items: center; gap: 7px; background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px 4px 4px; font-size: 12.5px; font-weight: 750; white-space: nowrap; }
  .shopc .lg { width: 26px; height: 26px; border-radius: 99px; background: linear-gradient(135deg, #f472b6, #db2777); color: #fff; display: grid; place-items: center; }
  .shopc .lg svg { width: 14px; height: 14px; stroke-width: 2.2; }
  .live { display: inline-flex; align-items: center; gap: 4px; background: #ef4444; color: #fff; font-size: 9px; font-weight: 800; letter-spacing: .07em; line-height: 15px; padding: 0 5px; border-radius: 4px; }
  .live i { width: 5px; height: 5px; border-radius: 99px; background: #fff; }
  .tb .sp { width: 36px; flex-shrink: 0; }

  .hero { text-align: center; padding: 6px 16px 0; }
  .ok { width: 98px; height: 98px; margin: 0 auto; position: relative; display: grid; place-items: center; }
  .ok::before { content: ""; position: absolute; inset: 0; border-radius: 99px; background: rgba(16,185,129,.1); }
  .ok::after { content: ""; position: absolute; inset: 12px; border-radius: 99px; background: rgba(16,185,129,.16); }
  .ok span { position: relative; z-index: 1; width: 58px; height: 58px; border-radius: 99px; background: linear-gradient(135deg, #34d399, #059669); display: grid; place-items: center; color: #fff; box-shadow: 0 12px 24px -10px rgba(5,150,105,.85); }
  .ok span svg { width: 31px; height: 31px; stroke-width: 3; }
  .cf { position: absolute; border-radius: 2px; }
  .hero h1 { font-size: 23px; font-weight: 850; letter-spacing: -.02em; margin-top: 2px; }
  .hero p { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .chips { display: flex; justify-content: center; gap: 7px; margin-top: 10px; }
  .chips .chip { font-size: 11.5px; padding: 0 10px; line-height: 26px; font-weight: 700; }
  .chips .chip svg { width: 13px; height: 13px; stroke-width: 2.6; }
  .chip.o { background: #fff; border: 1px solid var(--line); color: var(--ink2); }
  .chip.o b { color: var(--ink); font-weight: 800; }

  .body { padding: 13px 14px 0; display: flex; flex-direction: column; gap: 9px; }
  .box { background: #fff; border: 1px solid var(--line); border-radius: 15px; padding: 11px 13px; box-shadow: 0 1px 2px rgba(15,23,42,.03); }
  .bh { display: flex; align-items: center; font-size: 13px; font-weight: 800; }
  .bh span { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted); }
  .it { display: flex; align-items: center; gap: 11px; margin-top: 9px; }
  .th { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; overflow: hidden; flex-shrink: 0; }
  .th svg { height: 37px; width: auto; }
  .it .tx { min-width: 0; }
  .it .tx b { display: block; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .it .tx small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .it .am { margin-left: auto; font-size: 12.5px; font-weight: 750; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sum { border-top: 1px dashed #d8e0ea; margin-top: 11px; padding-top: 9px; display: flex; flex-direction: column; gap: 5px; }
  .sum div { display: flex; font-size: 12px; color: var(--ink2); }
  .sum div span:last-child { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
  .sum div.tot { margin-top: 2px; font-size: 13.5px; font-weight: 800; color: var(--ink); align-items: baseline; }
  .sum div.tot span:last-child { font-size: 17px; font-weight: 850; letter-spacing: -.01em; color: var(--ink); }
  .dl { display: flex; align-items: center; gap: 11px; }
  .dl .ic2 { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex-shrink: 0; }
  .dl .ic2 svg { width: 20px; height: 20px; }
  .dl .tx { min-width: 0; }
  .dl .tx b { display: block; font-size: 12.5px; font-weight: 750; white-space: nowrap; }
  .dl .tx small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .rc { background: linear-gradient(135deg, #f0fdf4, #dcfce7); border-color: #bbf7d0; }
  .rc .ic2 { background: #22c55e; color: #fff; box-shadow: 0 6px 12px -6px rgba(22,163,74,.8); }
  .rc .tx b { color: #14532d; }
  .rc .tx small { color: #15803d; font-weight: 600; }
  .rc .go { margin-left: auto; color: #15803d; display: flex; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 750; }
  .rc .go svg { width: 14px; height: 14px; stroke-width: 2.4; }
  .btn2 { margin: 12px 14px 0; height: 50px; border-radius: 14px; background: linear-gradient(135deg, #0396d9, #0287c4); color: #fff; font-size: 15px; font-weight: 750; display: flex; align-items: center; justify-content: center; gap: 9px; box-shadow: 0 10px 20px -10px rgba(3,150,217,.95); }
  .btn2 .dot { width: 9px; height: 9px; border-radius: 99px; background: #ff6b6b; box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
  .lk { text-align: center; margin-top: 11px; font-size: 12.5px; font-weight: 700; color: var(--brand); display: flex; align-items: center; justify-content: center; gap: 5px; }
  .lk svg { width: 14px; height: 14px; stroke-width: 2.3; }
</style></head>
<body>
<div class="ph" id="ph"></div>
<script>
  const IC = {
    bag: '<path d="M5.5 8h13l-1 12.5h-11z"/><path d="M9 10.5V7a3 3 0 016 0v3.5"/>',
    pin: '<path d="M12 21s-7-6.1-7-11.5a7 7 0 0114 0C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    truck: '<path d="M2.5 6.5h11v9.5h-11zM13.5 9.5h4.2l3.3 3.4V16h-7.5"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  };
  const I = (n) => `<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
  // Same illustrations as live-shop.html
  const ART = {
    tudung: `<svg viewBox="0 0 100 100"><defs>
        <linearGradient id="td" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaa6b8"/><stop offset="1" stop-color="#cf7d96"/></linearGradient></defs>
      <path d="M10 100C12 87 25 81 50 80s38 7 40 20z" fill="#f3e5d8"/>
      <path d="M50 12C31 12 23.5 25 23.5 39.5c0 11-3 19.5-10 29.5C25 78.5 38 88 50 96c12-8 25-17.5 36.5-27-7-10-10-18.5-10-29.5C76.5 25 69 12 50 12z" fill="url(#td)"/>
      <ellipse cx="50" cy="43" rx="13" ry="16.5" fill="#f5d6c3"/>
      <path d="M37 38.5c.6-8.6 5.8-13 13-13s12.4 4.4 13 13c-3.4-5.4-7.6-7.4-13-7.4s-9.6 2-13 7.4z" fill="#b9607b"/>
      <path d="M36 62c4 9 8.5 18.5 13.6 30M64 62c-4 9-8.5 18.5-13.6 30M27 66c6 7.5 13 16 21 25M73 66c-6 7.5-13 16-21 25" stroke="#b25a76" stroke-width="1.3" fill="none" opacity=".4" stroke-linecap="round"/>
      <circle cx="50" cy="62" r="2.8" fill="#fbbf24" stroke="#fff" stroke-width="1.1"/></svg>`,
    lipstick: `<svg viewBox="0 0 100 100"><defs>
        <linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#a77f30"/><stop offset=".45" stop-color="#f3d991"/><stop offset="1" stop-color="#9c752a"/></linearGradient>
        <linearGradient id="lb" x1="0" x2="1"><stop offset="0" stop-color="#111827"/><stop offset=".45" stop-color="#3b4252"/><stop offset="1" stop-color="#0b1220"/></linearGradient></defs>
      ${[[27, 33, "#d77a6c"], [50, 20, "#c8102e"], [73, 36, "#9b2a5c"]].map(([x, t, c]) => `
        <path d="M${x - 5.5} 52V${t + 8}L${x + 5.5} ${t}V52z" fill="${c}"/>
        <rect x="${x - 7}" y="50" width="14" height="11" rx="1" fill="url(#lg)"/>
        <rect x="${x - 9}" y="60" width="18" height="32" rx="2.6" fill="url(#lb)"/>
        <rect x="${x - 9}" y="60" width="18" height="4.2" fill="url(#lg)"/>`).join("")}</svg>`,
  };
  // Confetti around the tick: [left, top, w, h, rotate, colour]
  const CF = [[2, 18, 8, 4, -30, "#0396d9"], [86, 10, 7, 4, 25, "#f59e0b"], [92, 62, 8, 4, -50, "#ec4899"], [-2, 70, 6, 6, 20, "#00cfcb"], [22, -2, 5, 5, 45, "#8b5cf6"], [74, 88, 6, 3, 20, "#0396d9"], [-14, 40, 5, 3, 60, "#f59e0b"], [106, 34, 5, 5, 15, "#10b981"], [-10, 4, 4, 4, 0, "#ec4899"], [110, 84, 4, 4, 0, "#8b5cf6"]];
  const LIVE = '<span class="live"><i></i>LIVE</span>';

  document.getElementById("ph").innerHTML = `
    <div class="status"><span>8:42</span><span class="r"><span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span><span style="font-size:11px">5G</span><span class="bat"><i></i></span></span></div>
    <div class="tb"><span class="cb"><i data-i="x"></i></span><span class="shopc"><span class="lg">${I("bag")}</span>Demo Live Shop${LIVE}</span><span class="sp"></span></div>
    <div class="hero">
      <div class="ok"><span><i data-i="check"></i></span>${CF.map(([l, t, w, h, r, c]) => `<i class="cf" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;transform:rotate(${r}deg);background:${c}"></i>`).join("")}</div>
      <h1>Order confirmed</h1>
      <p>Thank you, Nur Aisyah! Your items are reserved.</p>
      <div class="chips"><span class="chip o">Order no. <b>#LS-24180</b></span><span class="chip g"><i data-i="check"></i>Paid · Online banking</span></div>
    </div>
    <div class="body">
      <div class="box">
        <div class="bh">Order summary<span>Tue, 13 Oct 2026 · 8:42 PM</span></div>
        <div class="it"><span class="th" style="background:linear-gradient(140deg,#fdf2f8,#fbcfe8)">${ART.tudung}</span><div class="tx"><b>Tudung Bawal Premium</b><small>Qty 1 × RM 29.90</small></div><span class="am">RM 29.90</span></div>
        <div class="it"><span class="th" style="background:linear-gradient(140deg,#fff1f2,#fecdd3)">${ART.lipstick}</span><div class="tx"><b>Lipstick Matte Set</b><small>Qty 1 × RM 39.90</small></div><span class="am">RM 39.90</span></div>
        <div class="sum"><div><span>Subtotal (2 items)</span><span>RM 69.80</span></div><div><span>Shipping</span><span>RM 8.00</span></div><div class="tot"><span>Total paid</span><span>RM 77.80</span></div></div>
      </div>
      <div class="box dl"><span class="ic2" style="background:var(--brand-50);color:var(--brand)">${I("pin")}</span><div class="tx"><b>Deliver to Nur Aisyah</b><small>Seksyen 7, 40000 Shah Alam, Selangor</small></div></div>
      <div class="box dl rc"><span class="ic2"><i data-i="wa"></i></span><div class="tx"><b>Official receipt OR-2026-08841</b><small>Sent to your WhatsApp automatically</small></div><span class="go">View<i data-i="chevR"></i></span></div>
    </div>
    <div class="btn2"><span class="dot"></span>Back to live sale</div>
    <div class="lk">${I("truck")}Track my order</div>`;
</script>
<script src="icons.js"></script>
</body></html>
