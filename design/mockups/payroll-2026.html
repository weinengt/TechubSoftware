<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  /* How to calculate EPF, SOCSO, EIS and PCB in 2026: the picture for the payroll guide blog post. ?lang=en|ms|zh
     The payslip is the made-up RM 3,000 example from lib/payroll.ts (October 2026, citizen under 60, single). */
  :root { --w: 1000px; --h: 625px; }
  body { background: linear-gradient(145deg, #f2f8fd 0%, #e4f1fb 58%, #d8eefa 100%); position: relative; }
  body::before { content: ""; position: absolute; right: -140px; top: -190px; width: 540px; height: 540px; border-radius: 50%; background: radial-gradient(circle, rgba(0,207,203,.2), rgba(0,207,203,0) 70%); }
  .wrap { position: relative; z-index: 1; height: 100%; padding: 36px 48px 0; display: flex; flex-direction: column; }
  .tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #cfe3f2; border-radius: 99px; padding: 6px 14px 6px 8px; font-size: 13px; font-weight: 750; letter-spacing: .08em; color: var(--navy); }
  .tag i { width: 22px; height: 22px; border-radius: 99px; background: linear-gradient(135deg, #10b981, #047857); display: grid; place-items: center; font-style: normal; color: #fff; font-size: 9.5px; font-weight: 900; letter-spacing: 0; }
  h1 { margin-top: 14px; font-size: 33px; line-height: 1.15; font-weight: 850; letter-spacing: -.02em; color: var(--navy); }
  h1 em { font-style: normal; color: #0396d9; }
  .row { margin-top: 22px; flex: 1; display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 18px; min-height: 0; }
  .card { background: #fff; border-radius: 18px; padding: 18px 22px; box-shadow: 0 20px 40px -26px rgba(11,47,85,.45); border: 1px solid #e3edf6; display: flex; flex-direction: column; min-height: 0; }
  .card h2 { font-size: 15px; font-weight: 800; color: var(--navy); display: flex; align-items: center; gap: 9px; }
  .card h2 .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #0396d9, #0050a0); flex-shrink: 0; }
  .card h2 svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .card h2 .mo { margin-left: auto; font-size: 11.5px; font-weight: 700; color: #0369a1; background: #eef9fe; border: 1px solid #cdeefc; border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
  /* Payslip */
  .lines { margin-top: 8px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .ln { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px dashed #e1e9f2; font-size: 14px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .ln span { font-weight: 650; white-space: nowrap; }
  .ln em { font-style: normal; font-size: 11.5px; font-weight: 700; color: #0396d9; margin-left: 7px; }
  .ln b { margin-left: auto; font-weight: 750; color: var(--ink); white-space: nowrap; }
  .ln.base { font-size: 15px; } .ln.base span { color: var(--navy); font-weight: 750; } .ln.base b { font-weight: 800; }
  .ln.cut b { color: #b4233a; }
  .net { margin-top: 12px; border-radius: 14px; padding: 11px 16px; display: flex; align-items: center; color: #fff;
    background: radial-gradient(circle at calc(100% - 20px) 10px, rgba(255,255,255,.13) 44px, transparent 45px), linear-gradient(135deg, #0050a0, #0396d9 62%, #00cfcb); }
  .net span { font-size: 14px; font-weight: 700; opacity: .95; }
  .net b { margin-left: auto; font-size: 27px; font-weight: 850; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .er { margin-top: 10px; background: #f4f8fc; border-radius: 12px; padding: 8px 12px 9px; }
  .er .et { display: flex; align-items: baseline; font-size: 12.5px; font-weight: 700; color: var(--ink2); }
  .er .et b { margin-left: auto; font-size: 15px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }
  .er .ec { margin-top: 5px; display: flex; gap: 6px; }
  .er i { font-style: normal; background: #fff; border: 1px solid #e3edf6; border-radius: 99px; padding: 2px 9px; font-size: 11.5px; font-weight: 650; color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* Rates */
  .tb { margin-top: 12px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
  .th, .tr { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .8fr) minmax(0, 1fr); align-items: center; gap: 8px; }
  .th { font-size: 11px; font-weight: 800; letter-spacing: .07em; color: var(--muted); padding: 0 0 6px; border-bottom: 1px solid #e5edf5; }
  .th span:not(:first-child), .tr b { text-align: right; }
  .tr { padding: 8px 0; border-bottom: 1px solid #f0f4f8; }
  .tr:last-child { border-bottom: 0; }
  .tr .n { display: flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 750; color: var(--navy); min-width: 0; }
  .tr .n i { width: 9px; height: 9px; border-radius: 99px; flex-shrink: 0; }
  .tr .n small { display: block; font-size: 10.5px; font-weight: 600; color: var(--muted); margin-top: 1px; white-space: nowrap; }
  .tr b { font-size: 17px; font-weight: 850; color: var(--ink); white-space: nowrap; }
  .tr b small { display: block; font-size: 10.5px; font-weight: 600; color: var(--muted); }
  .tr b.f { font-size: 12.5px; font-weight: 750; color: #0369a1; }
  .tr b.no { color: #cbd5e1; }
  .chips { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
  .chip { display: flex; align-items: center; gap: 9px; background: #f4f8fc; border-radius: 11px; padding: 8px 11px; font-size: 12.5px; line-height: 1.3; font-weight: 650; color: var(--ink2); }
  .chip svg { width: 16px; height: 16px; stroke: #0396d9; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .ft { display: flex; align-items: center; gap: 10px; padding: 16px 0 18px; font-size: 12px; color: var(--muted); }
  .ft img { width: 26px; height: 26px; border-radius: 7px; background: #fff; padding: 3px; box-shadow: 0 2px 6px rgba(11,47,85,.15); }
  .ft b { color: var(--navy); font-weight: 750; }
  .ft .r { margin-left: auto; }
  html[lang="ms"] h1 { font-size: 33px; }
  html[lang="zh"] h1 { letter-spacing: 0; font-size: 31px; }
</style></head>
<body>
<div class="wrap">
  <div class="tag"><i>RM</i><span data-t="tag"></span></div>
  <h1 data-t="title"></h1>
  <div class="row">
    <div class="card">
      <h2><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg></span><span data-t="slip"></span><span class="mo" data-t="month"></span></h2>
      <div class="lines" id="lines"></div>
      <div class="net"><span data-t="net"></span><b>RM 2,627.20</b></div>
      <div class="er"><div class="et"><span data-t="er"></span><b>RM 447.55</b></div><div class="ec"><i id="erEpf"></i><i id="erSocso"></i><i id="erEis"></i></div></div>
    </div>
    <div class="card">
      <h2><span class="ic"><svg viewBox="0 0 24 24"><path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg></span><span data-t="rates"></span></h2>
      <div class="tb" id="tb"></div>
      <div class="chips">
        <div class="chip"><svg viewBox="0 0 24 24"><path d="M4 20h16M7 16V9M12 16V5M17 16v-4"/></svg><span data-t="cap"></span></div>
        <div class="chip"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-t="due"></span></div>
      </div>
    </div>
  </div>
  <div class="ft"><img src="icon.png" alt=""><b>Techub Software</b><span class="r" data-t="note"></span></div>
</div>
<script>
const lang = new URLSearchParams(location.search).get("lang") || "en";
document.documentElement.lang = lang;
const T = {
  en: {
    tag: "PAYROLL 2026 · WORKED EXAMPLE", title: "How to calculate <em>EPF, SOCSO, EIS and PCB</em> in 2026",
    slip: "Payslip for RM 3,000", month: "October 2026", basic: "Basic salary",
    names: ["EPF", "SOCSO", "LINDUNG 24 Jam", "EIS", "PCB (tax)"],
    net: "Net pay", er: "Employer pays on top",
    rates: "2026 rates", staff: "STAFF", employer: "EMPLOYER",
    epf12: "12% above RM 5,000", optout: "Malaysia staff may opt out", formula: "LHDN formula",
    cap: "SOCSO, LINDUNG and EIS on pay up to RM 6,000",
    due: "Pay them all by the 15th of next month",
    note: "Made-up example: citizen under 60, single · Sources: KWSP, PERKESO, LHDN",
  },
  ms: {
    tag: "GAJI 2026 · CONTOH KIRAAN", title: "Cara kira <em>KWSP, PERKESO, SIP dan PCB</em> 2026",
    slip: "Slip gaji untuk RM 3,000", month: "Oktober 2026", basic: "Gaji pokok",
    names: ["KWSP", "PERKESO", "LINDUNG 24 Jam", "SIP", "PCB (cukai)"],
    net: "Gaji bersih", er: "Majikan bayar lagi",
    rates: "Kadar 2026", staff: "PEKERJA", employer: "MAJIKAN",
    epf12: "12% atas RM 5,000", optout: "Pekerja tempatan boleh keluar", formula: "Formula LHDN",
    cap: "PERKESO, LINDUNG dan SIP: gaji hingga RM 6,000",
    due: "Bayar semua paling lewat 15hb bulan depan",
    note: "Contoh rekaan: warganegara bawah 60, bujang · Sumber: KWSP, PERKESO, LHDN",
  },
  zh: {
    tag: "2026 年薪水 · 计算例子", title: "<em>EPF、SOCSO、EIS 和 PCB</em> 怎么算？<br>2026 年薪水例子",
    slip: "RM 3,000 薪水的工资单", month: "2026 年 10 月", basic: "底薪",
    names: ["EPF 公积金", "SOCSO 社险", "LINDUNG 24 Jam", "EIS 就业保险", "PCB 扣税"],
    net: "实拿工资", er: "雇主另付",
    rates: "2026 年费率", staff: "员工", employer: "雇主",
    epf12: "RM 5,000 以上 12%", optout: "本地员工可选择退出", formula: "LHDN 公式",
    cap: "SOCSO、LINDUNG 和 EIS 按 RM 6,000 以内的工资算",
    due: "全部最迟在下个月 15 日缴交",
    note: "虚构例子：60 岁以下公民、单身 · 资料来源：KWSP、PERKESO、LHDN",
  },
}[lang];
document.querySelectorAll("[data-t]").forEach((el) => (el.innerHTML = T[el.dataset.t]));
const [epf, socso, lindung, eis, pcb] = T.names;
const line = (name, rate, amount, cut = true) => `<div class="ln${cut ? " cut" : ""}"><span>${name}${rate ? `<em>${rate}</em>` : ""}</span><b>${amount}</b></div>`;
document.getElementById("lines").innerHTML =
  `<div class="ln base"><span>${T.basic}</span><b>RM 3,000.00</b></div>` +
  line(epf, "11%", "− 330.00") + line(socso, "0.5%", "− 14.75") + line(lindung, "0.75%", "− 22.15") + line(eis, "0.2%", "− 5.90") + line(pcb, "", "0.00", false);
// Employer's share of the same payslip: EPF 13%, SOCSO 1.75% and EIS 0.2% on the RM 2,900.01 to 3,000 band.
document.getElementById("erEpf").textContent = `${epf.split(" ")[0]} 390`;
document.getElementById("erSocso").textContent = `${socso.split(" ")[0]} 51.65`;
document.getElementById("erEis").textContent = `${eis.split(" ")[0]} 5.90`;
const row = (name, colour, staff, employer, sub = "", empSub = "", cls = "") =>
  `<div class="tr"><span class="n"><i style="background:${colour}"></i><span>${name}${sub ? `<small>${sub}</small>` : ""}</span></span><b class="${cls}">${staff}</b><b${employer === "–" ? ' class="no"' : ""}>${employer}${empSub ? `<small>${empSub}</small>` : ""}</b></div>`;
document.getElementById("tb").innerHTML =
  `<div class="th"><span></span><span>${T.staff}</span><span>${T.employer}</span></div>` +
  row(epf, "#0396d9", "11%", "13%", "", T.epf12) +
  row(socso, "#10b981", "0.5%", "1.75%") +
  row(lindung, "#f59e0b", "0.75%", "–", T.optout) +
  row(eis, "#8b5cf6", "0.2%", "0.2%") +
  row(pcb, "#0b2f55", T.formula, "–", "", "", "f");
</script>
</body></html>
