<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="phone.css">
<style>
  :root { --w: 360px; --h: 760px; }
  .ph { width: 100%; height: 100%; display: flex; flex-direction: column; background: #efeae2; }
  .top2 { background: #008069; color: #fff; }
  .hdr { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 6px; }
  .hdr img { width: 38px; height: 38px; border-radius: 99px; background: #fff; }
  .hdr b { font-size: 15.5px; font-weight: 650; display: flex; align-items: center; gap: 4px; } .hdr small { font-size: 12px; opacity: .85; display: block; }
  .hdr .ic { margin-left: auto; display: flex; gap: 16px; } .hdr svg { width: 21px; height: 21px; }
  .chat { flex: 1; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; overflow: hidden;
    background-color: #efeae2; background-image: radial-gradient(rgba(0,0,0,.035) 1.2px, transparent 1.2px); background-size: 18px 18px; }
  .day { align-self: center; background: #fff; color: #54656f; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 8px; box-shadow: 0 1px .5px rgba(0,0,0,.13); margin: 4px 0; }
  .b { max-width: 84%; padding: 6px 8px 5px 9px; border-radius: 8px; font-size: 13px; line-height: 1.38; color: #111b21; box-shadow: 0 1px .5px rgba(0,0,0,.13); position: relative; white-space: pre-line; }
  .in { align-self: flex-start; background: #fff; border-top-left-radius: 0; }
  .out { align-self: flex-end; background: #d9fdd3; border-top-right-radius: 0; }
  .b .tm { float: right; font-size: 10.5px; color: #667781; margin: 6px 0 -3px 10px; display: inline-flex; gap: 3px; align-items: center; }
  .b .tk { color: #53bdeb; font-weight: 700; letter-spacing: -3px; margin-right: 3px; }
  .btns { align-self: flex-start; width: 84%; display: flex; flex-direction: column; gap: 3px; margin-top: -3px; }
  .btns span { background: #fff; border-radius: 8px; text-align: center; color: #027eb5; font-size: 13px; font-weight: 600; padding: 8px; box-shadow: 0 1px .5px rgba(0,0,0,.13); }
  .tag { font-size: 11px; color: #8696a0; font-weight: 600; }
  .bar { display: flex; align-items: center; gap: 6px; padding: 6px 6px 10px; }
  .inp { flex: 1; height: 44px; background: #fff; border-radius: 99px; display: flex; align-items: center; gap: 12px; padding: 0 14px; color: #8696a0; font-size: 15px; }
  .inp svg { width: 21px; height: 21px; color: #8696a0; }
  .mic { width: 46px; height: 46px; border-radius: 99px; background: #00a884; color: #fff; display: grid; place-items: center; } .mic svg { width: 21px; height: 21px; }
</style></head>
<body>
<div class="ph">
  <div class="top2">
    <div class="status"><span>9:41</span><span class="r"><span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span><span style="font-size:11px">5G</span><span class="bat"><i></i></span></span></div>
    <div class="hdr"><i data-i="chevL" style="width:24px;height:24px"></i><img src="icon.png" alt=""><div><b id="biz"></b><small>Business account</small></div><span class="ic"><i data-i="video"></i><i data-i="phone"></i><i data-i="more"></i></span></div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="bar"><div class="inp"><span style="font-size:20px">🙂</span>Message<span style="margin-left:auto;display:flex;gap:14px"><i data-i="clip"></i><i data-i="cam"></i></span></div><span class="mic"><i data-i="mic"></i></span></div>
</div>
<script>
  const V = new URLSearchParams(location.search).get("v") === "spa" ? "spa" : "clinic";
  const D = {
    spa: {
      biz: "Demo Spa &amp; Salon",
      msgs: [
        ["day", "Yesterday"],
        ["in", "<b>Booking confirmed</b> ✅\nHi Priya, thank you for booking with us!\n\n💆‍♀️ Signature Facial (60 min)\n📅 Wed, 14 Oct 2026\n⏰ 10:30 AM\n👩 Therapist: Mei Ling", "3:12 PM"],
        ["day", "Today"],
        ["in", "<b>Appointment reminder</b> ⏰\nHi Priya, see you <b>tomorrow at 10:30 AM</b> for your Signature Facial.\n\nPlease reply below to confirm.", "9:00 AM"],
        ["btns", ["✅ Confirm", "📅 Reschedule"]],
        ["out", "✅ Confirm", "9:04 AM"],
        ["in", "Thank you, Priya! 🙏 You're all set.\nYou have <b>6 facial sessions</b> left in your package. See you tomorrow!", "9:04 AM"],
      ],
    },
    clinic: {
      biz: "Demo Clinic",
      msgs: [
        ["day", "Yesterday"],
        ["in", "<b>Appointment confirmed</b> ✅\nHi Ahmad, your follow-up visit is booked.\n\n🩺 Dr. Lim Wei Jie\n📅 Thu, 15 Oct 2026\n⏰ 9:30 AM\n📍 Demo Clinic, Kuala Lumpur", "4:20 PM"],
        ["day", "Today"],
        ["in", "<b>Appointment reminder</b> ⏰\nHi Ahmad, see you <b>tomorrow at 9:30 AM</b>. Please bring your MyKad and current medicines.", "9:00 AM"],
        ["btns", ["✅ Confirm", "📅 Reschedule"]],
        ["out", "✅ Confirm", "9:06 AM"],
        ["in", "Thank you! 🙏 Your appointment is confirmed. Your queue number will be sent here when you arrive.", "9:06 AM"],
      ],
    },
  }[V];
  document.getElementById("biz").innerHTML = D.biz + ' <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="10" fill="#25d366"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const chat = document.getElementById("chat");
  chat.innerHTML = D.msgs.map(([t, x, tm]) => {
    if (t === "day") return `<div class="day">${x}</div>`;
    if (t === "btns") return `<div class="btns">${x.map((b) => `<span>${b}</span>`).join("")}</div>`;
    return `<div class="b ${t}">${x}<span class="tm">${tm}${t === "out" ? '<span class="tk">✓✓</span>' : ""}</span></div>`;
  }).join("");
</script>
<script src="icons.js"></script>
</body></html>
