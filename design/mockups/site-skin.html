<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
  /* Own reset (base.css is not linked: its app-screen classes such as .nav and .btn would clash with this site) */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { -webkit-font-smoothing: antialiased; }
  body { width: 100vw; height: 100vh; overflow: hidden; }
  /* Velisse Skin Studio: the example website in the main picture of the Website Design page.
     ?p=home (default), ?p=treatments and ?p=contact are 1440x900 desktop pages; ?p=phone is the home page at 360x760. */
  :root {
    --w: 1440px; --h: 900px;
    --ivory: #FBF7F2; --ivory2: #F5ECE3; --paper: #FFFDFA;
    --blush: #F3E3D9; --blush2: #EAD0C2; --sand: #E8DCCD;
    --clay: #A96850; --clay2: #8C503B;
    --esp: #2A1F1A; --esp2: #3B2D26; --ink2: #5B4C44; --muted: #8B7B71;
    --line: rgba(42, 31, 26, .1); --line2: rgba(42, 31, 26, .18);
    --gold: #C49F6A; --wa: #25D366; --wa2: #1DA851;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: Manrope, Inter, system-ui, sans-serif;
  }
  html, body { background: var(--ivory); color: var(--esp); font-family: var(--sans); }
  a { color: inherit; text-decoration: none; }
  svg { display: block; }
  .page { position: absolute; inset: 0; overflow: hidden; background: var(--ivory); }
  .i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .eyebrow { display: flex; align-items: center; gap: 14px; font-size: 11.5px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--clay); white-space: nowrap; }
  .eyebrow::before { content: ""; width: 34px; height: 1px; background: currentColor; opacity: .75; }
  h1 { font-family: var(--serif); font-weight: 500; letter-spacing: -.018em; }
  h1 em { font-style: italic; color: var(--clay); }
  .glass { background: rgba(255, 251, 247, .62); -webkit-backdrop-filter: blur(16px) saturate(1.15); backdrop-filter: blur(16px) saturate(1.15);
    border: 1px solid rgba(255, 255, 255, .78); box-shadow: 0 24px 48px -26px rgba(74, 42, 28, .45), inset 0 1px 0 rgba(255, 255, 255, .6); }

  /* Navigation: the same on every desktop page */
  .nav { position: absolute; z-index: 10; left: 0; right: 0; top: 0; height: 92px; display: flex; align-items: center; padding: 0 80px; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo .mk { width: 30px; height: 38px; }
  .logo b { display: block; font-family: var(--serif); font-weight: 600; font-size: 31px; line-height: .78; letter-spacing: .005em; }
  .logo small { display: block; font-size: 8.5px; font-weight: 700; letter-spacing: .42em; color: var(--muted); margin-top: 8px; text-transform: uppercase; }
  .links { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 26px; }
  .links a { position: relative; font-size: 14.5px; font-weight: 500; color: var(--ink2); padding: 10px 7px; }
  .links a.on { color: var(--esp); font-weight: 700; }
  .links a.on::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--clay); }
  .nav .rt { margin-left: auto; display: flex; align-items: center; gap: 26px; }
  .tel { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .tel .i { width: 16px; height: 16px; color: var(--clay); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; padding: 0 24px; border-radius: 99px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .btn.pri { background: var(--esp); color: #FBF2EA; box-shadow: 0 16px 30px -16px rgba(42, 31, 26, .75); }
  .btn.ghost { border: 1px solid var(--line2); color: var(--esp); background: rgba(255, 255, 255, .4); }
  .btn .i { width: 16px; height: 16px; }
  .btn .ar { width: 34px; height: 34px; border-radius: 50%; background: rgba(251, 242, 234, .14); display: grid; place-items: center; }

  /* Home */
  .h-copy { position: absolute; left: 80px; top: 168px; width: max-content; }
  .h-copy h1 { font-size: 100px; line-height: .94; margin-top: 26px; }
  .h-copy p { font-size: 17px; line-height: 1.68; color: var(--ink2); margin-top: 30px; max-width: 470px; }
  .acts { display: flex; gap: 14px; margin-top: 38px; }
  .acts .btn { height: 58px; font-size: 15px; }
  .acts .btn.pri { padding: 0 12px 0 28px; gap: 16px; }
  .acts .btn.ghost { padding: 0 30px; }
  .trust { position: absolute; left: 80px; top: 752px; display: flex; align-items: center; gap: 26px; }
  .trust .vr { width: 1px; height: 38px; background: var(--line2); }
  .stars { display: flex; gap: 2px; color: var(--gold); }
  .stars svg { width: 14px; height: 14px; }
  .trust .t1 span, .trust .t2 span { display: block; font-size: 13px; color: var(--ink2); margin-top: 5px; white-space: nowrap; }
  .trust b { font-weight: 700; color: var(--esp); }
  .trust .t2 { display: flex; align-items: center; gap: 12px; }
  .trust .t2 .ic { width: 40px; height: 40px; border-radius: 50%; background: var(--blush); color: var(--clay2); display: grid; place-items: center; }
  .trust .t2 b { display: block; font-size: 14px; }
  .trust .t2 span { margin-top: 2px; }
  .arch { position: absolute; left: 816px; top: 120px; width: 500px; height: 780px; border-radius: 250px 250px 0 0; overflow: hidden; box-shadow: 0 40px 80px -50px rgba(74, 42, 28, .5); }
  .arch > svg { width: 100%; height: 100%; }
  .arch-line { position: absolute; left: 846px; top: 94px; width: 500px; height: 780px; border: 1px solid rgba(169, 104, 80, .32); border-bottom: 0; border-radius: 250px 250px 0 0; }
  .badge { position: absolute; left: 754px; top: 300px; width: 124px; height: 124px; z-index: 3; filter: drop-shadow(0 14px 22px rgba(74, 42, 28, .18)); }
  .chip-next { position: absolute; left: 1148px; top: 288px; display: flex; align-items: center; gap: 12px; padding: 12px 20px 12px 14px; border-radius: 18px; z-index: 3; }
  .chip-next .ic { width: 38px; height: 38px; border-radius: 12px; background: #fff; color: var(--clay); display: grid; place-items: center; }
  .chip-next small { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--ink2); }
  .chip-next small i { width: 7px; height: 7px; border-radius: 50%; background: #2DB86A; box-shadow: 0 0 0 3px rgba(45, 184, 106, .18); }
  .chip-next b { display: block; font-size: 14px; font-weight: 700; margin-top: 3px; white-space: nowrap; }
  .gcard { position: absolute; left: 730px; top: 690px; width: 340px; display: flex; align-items: center; gap: 14px; padding: 12px 14px 12px 12px; border-radius: 22px; z-index: 3; }
  .gcard .th { width: 58px; height: 58px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
  .gcard .th svg { width: 100%; height: 100%; }
  .gcard small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--clay); }
  .gcard b { display: block; font-family: var(--serif); font-size: 23px; font-weight: 600; line-height: 1.1; margin-top: 3px; white-space: nowrap; }
  .gcard span { display: block; font-size: 12.5px; color: var(--ink2); margin-top: 2px; }
  .gcard .go { margin-left: auto; width: 38px; height: 38px; border-radius: 50%; background: var(--esp); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .gcard .go .i { width: 15px; height: 15px; }
  .band { position: absolute; left: 24px; right: 24px; top: 832px; height: 120px; border-radius: 30px 30px 0 0; background: var(--esp); overflow: hidden; z-index: 4; }
  .mq { position: absolute; left: -46px; top: 18px; display: flex; align-items: center; gap: 30px; white-space: nowrap; }
  .mq span { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 31px; color: #F4E6DA; letter-spacing: .005em; }
  .mq svg { width: 13px; height: 13px; color: var(--gold); }

  /* Treatments */
  .t-head { position: absolute; left: 80px; right: 80px; top: 126px; display: flex; align-items: flex-end; justify-content: space-between; }
  .crumbs { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .crumbs b { color: var(--clay); font-weight: 700; }
  .t-head h1 { font-size: 82px; line-height: 1; margin-top: 16px; }
  .t-head p { width: 420px; font-size: 15px; line-height: 1.7; color: var(--ink2); padding-bottom: 8px; }
  .t-bar { position: absolute; left: 80px; right: 80px; top: 280px; display: flex; align-items: center; padding-bottom: 0; }
  .chips { display: flex; gap: 10px; }
  .chips span { height: 42px; padding: 0 20px; border-radius: 99px; border: 1px solid var(--line2); display: inline-flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; color: var(--ink2); background: rgba(255, 255, 255, .45); }
  .chips span em { font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .chips span.on { background: var(--esp); border-color: var(--esp); color: #FBF2EA; }
  .chips span.on em { color: rgba(251, 242, 234, .55); }
  .sort { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); font-weight: 500; }
  .sort b { color: var(--esp); font-weight: 700; }
  .sort .i { width: 15px; height: 15px; color: var(--esp); }
  .grid { position: absolute; left: 80px; right: 80px; top: 350px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 250px 250px; gap: 22px 24px; }
  .tc { display: flex; gap: 18px; padding: 13px; background: var(--paper); border: 1px solid var(--line); border-radius: 26px; box-shadow: 0 1px 2px rgba(42, 31, 26, .04), 0 22px 40px -32px rgba(74, 42, 28, .45); min-width: 0; }
  .tc .art { width: 142px; flex-shrink: 0; border-radius: 71px 71px 15px 15px; overflow: hidden; }
  .tc .art svg { width: 100%; height: 100%; }
  .tc .tb { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 12px 6px 4px 0; }
  .tc .tt { display: flex; align-items: center; gap: 8px; }
  .tc .cat { font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--clay); }
  .tc .tag { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--clay2); background: var(--blush); border-radius: 99px; padding: 4px 9px; white-space: nowrap; }
  .tc h3 { font-family: var(--serif); font-weight: 600; font-size: 26px; line-height: 1.04; letter-spacing: -.01em; margin-top: 10px; white-space: nowrap; }
  .tc p { font-size: 13.2px; line-height: 1.58; color: var(--ink2); margin-top: 9px; }
  .tc .tm { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
  .tc .dur { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .tc .dur .i { width: 14px; height: 14px; }
  .tc .pr { font-family: var(--serif); font-size: 23px; font-weight: 600; color: var(--esp); margin-left: auto; font-variant-numeric: lining-nums; }
  .tc .pr small { font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--muted); margin-right: 3px; letter-spacing: .04em; }
  .tc .go { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line2); display: grid; place-items: center; color: var(--esp); }
  .tc .go .i { width: 14px; height: 14px; }

  /* Contact */
  .c-copy { position: absolute; left: 80px; top: 136px; width: 660px; }
  .c-copy h1 { font-size: 78px; line-height: .98; margin-top: 24px; }
  .c-copy p { font-size: 16px; line-height: 1.7; color: var(--ink2); margin-top: 24px; max-width: 520px; }
  .c-acts { display: flex; align-items: center; gap: 26px; margin-top: 30px; }
  .wa { height: 62px; padding: 0 28px 0 10px; border-radius: 99px; background: linear-gradient(135deg, #2BC26A, #1A9E4C); color: #fff; display: inline-flex; align-items: center; gap: 13px; box-shadow: 0 18px 32px -16px rgba(26, 158, 76, .85); }
  .wa .wi { width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #1FAF57; display: grid; place-items: center; }
  .wa .wi svg { width: 25px; height: 25px; }
  .wa b { display: block; font-size: 16px; font-weight: 800; letter-spacing: .005em; }
  .wa small { display: block; font-size: 12.5px; font-weight: 600; opacity: .9; margin-top: 1px; }
  .call { display: flex; align-items: center; gap: 12px; }
  .call .ic { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line2); display: grid; place-items: center; color: var(--esp); }
  .call small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .call b { display: block; font-size: 15px; font-weight: 700; margin-top: 1px; }
  .mapband { position: absolute; left: 24px; right: 24px; top: 540px; height: 400px; border-radius: 32px 32px 0 0; overflow: hidden; }
  .mapband > svg { width: 100%; height: 100%; }
  .pin { position: absolute; width: 46px; height: 58px; transform: translate(-50%, -100%); }
  .pin .pulse { position: absolute; left: 50%; bottom: -14px; width: 120px; height: 40px; margin-left: -60px; border-radius: 50%; background: radial-gradient(closest-side, rgba(169, 104, 80, .32), rgba(169, 104, 80, .12) 60%, rgba(169, 104, 80, 0)); }
  .pin svg { position: relative; width: 46px; height: 58px; filter: drop-shadow(0 10px 12px rgba(42, 31, 26, .35)); }
  .plabel { position: absolute; transform: translate(-50%, 0); display: flex; align-items: center; gap: 14px; padding: 9px 9px 9px 16px; border-radius: 16px; white-space: nowrap; }
  .plabel b { display: block; font-family: var(--serif); font-size: 20px; font-weight: 600; line-height: 1.1; }
  .plabel small { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink2); margin-top: 2px; }
  .plabel .go { width: 34px; height: 34px; border-radius: 50%; background: var(--esp); color: #fff; display: grid; place-items: center; }
  .plabel .go .i { width: 14px; height: 14px; }
  .plabel::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; margin-left: -6px; transform: rotate(45deg); background: rgba(255, 251, 247, .8); border-right: 1px solid rgba(255, 255, 255, .78); border-bottom: 1px solid rgba(255, 255, 255, .78); }
  .info { position: absolute; left: 40px; top: 108px; width: 320px; padding: 20px 22px; border-radius: 22px; }
  .info h4 { font-size: 10.5px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--clay); display: flex; align-items: center; gap: 8px; }
  .info h4 .open { margin-left: auto; letter-spacing: 0; text-transform: none; font-size: 11.5px; font-weight: 700; color: #1C8A47; display: flex; align-items: center; gap: 6px; }
  .info h4 .open i { width: 7px; height: 7px; border-radius: 50%; background: #2DB86A; box-shadow: 0 0 0 3px rgba(45, 184, 106, .18); }
  .info .ad { font-size: 14px; line-height: 1.55; color: var(--esp); font-weight: 600; margin-top: 8px; }
  .info hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .hrs { margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: 13px; }
  .hrs span { color: var(--ink2); } .hrs b { text-align: right; font-weight: 700; }
  .fcard { position: absolute; left: 792px; top: 120px; width: 568px; z-index: 3; background: var(--paper); border-radius: 30px; padding: 32px 36px 30px;
    box-shadow: 0 0 0 1px rgba(42, 31, 26, .06), 0 50px 90px -40px rgba(74, 42, 28, .5), 0 12px 24px -16px rgba(74, 42, 28, .2); }
  .fcard h2 { font-family: var(--serif); font-weight: 600; font-size: 36px; line-height: 1; letter-spacing: -.01em; }
  .fcard .sub { font-size: 13.5px; color: var(--ink2); margin-top: 8px; line-height: 1.55; }
  .fl { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
  .fld { margin-top: 16px; }
  .frow .fld { margin-top: 0; }
  .inp { height: 50px; border-radius: 14px; border: 1px solid var(--line2); background: #fff; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 14.5px; font-weight: 600; color: var(--esp); white-space: nowrap; }
  .inp .i { width: 16px; height: 16px; color: var(--muted); }
  .inp .ch { margin-left: auto; color: var(--esp); }
  .inp.focus { border-color: var(--clay); box-shadow: 0 0 0 4px rgba(169, 104, 80, .12); }
  .inp .cur { width: 1.5px; height: 18px; background: var(--clay); margin-left: -8px; }
  .inp em { font-style: normal; color: var(--muted); font-weight: 500; }
  .inp.ta { height: 70px; align-items: flex-start; padding-top: 13px; white-space: normal; font-weight: 500; line-height: 1.5; color: var(--ink2); }
  .fl em { font-style: normal; font-weight: 600; letter-spacing: .04em; text-transform: none; color: #B3A59B; margin-left: 6px; }
  .fhd { display: flex; align-items: baseline; }
  .fhd .mo { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 700; color: var(--esp); }
  .fhd .mo .i { width: 14px; height: 14px; color: var(--muted); }
  .dates { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .date { height: 66px; border-radius: 16px; border: 1px solid var(--line2); background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .date small { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .date b { font-family: var(--serif); font-size: 27px; font-weight: 600; line-height: 1; margin-top: 3px; font-variant-numeric: lining-nums; }
  .date.on { background: var(--esp); border-color: var(--esp); color: #FBF2EA; box-shadow: 0 12px 22px -14px rgba(42, 31, 26, .8); }
  .date.on small { color: rgba(251, 242, 234, .65); }
  .times { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .time { height: 44px; border-radius: 12px; border: 1px solid var(--line2); background: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .time.off { color: #BBADA3; text-decoration: line-through; background: #F8F3EE; border-color: transparent; }
  .time.on { background: var(--blush); border-color: var(--clay); color: var(--clay2); }
  .fcard .btn.pri { width: 100%; height: 56px; margin-top: 22px; font-size: 15px; gap: 12px; }
  .fnote { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12.5px; color: var(--muted); font-weight: 600; margin-top: 14px; }
  .fnote .i { width: 14px; height: 14px; color: var(--clay); }

  /* Phone */
  .m { background: var(--ivory); }
  .status { height: 30px; display: flex; align-items: center; padding: 0 20px 0 24px; font-family: Inter, sans-serif; font-size: 13px; font-weight: 650; color: var(--esp); }
  .status .r { margin-left: auto; display: flex; gap: 5px; align-items: center; }
  .sig { display: flex; gap: 1.5px; align-items: flex-end; height: 10px; } .sig i { width: 3px; background: currentColor; border-radius: 1px; display: block; }
  .bat { width: 22px; height: 11px; border: 1.5px solid currentColor; border-radius: 3px; padding: 1px; opacity: .9; } .bat i { display: block; height: 100%; width: 75%; background: currentColor; border-radius: 1px; }
  .m-nav { height: 58px; display: flex; align-items: center; padding: 0 16px 0 18px; }
  .m-nav .logo { gap: 10px; }
  .m-nav .logo .mk { width: 24px; height: 30px; }
  .m-nav .logo b { font-size: 26px; }
  .m-nav .logo small { font-size: 7px; letter-spacing: .38em; margin-top: 6px; }
  .m-menu { margin-left: auto; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line2); display: grid; place-items: center; }
  .m-menu .i { width: 18px; height: 18px; }
  .m-hero { margin: 4px 16px 0; }
  .m-art { position: relative; height: 222px; border-radius: 164px 164px 22px 22px / 120px 120px 22px 22px; overflow: hidden; }
  .m-art > svg { width: 100%; height: 100%; }
  .m-art .chip-next { left: 10px; top: auto; bottom: 10px; padding: 7px 13px 7px 8px; border-radius: 14px; gap: 9px; }
  .m-art .chip-next .ic { width: 28px; height: 28px; border-radius: 9px; }
  .m-art .chip-next .ic .i { width: 15px; height: 15px; }
  .m-art .chip-next small { font-size: 10px; }
  .m-art .chip-next b { font-size: 12px; margin-top: 1px; }
  .m-hero .eyebrow { margin-top: 22px; font-size: 9.5px; gap: 10px; letter-spacing: .22em; }
  .m-hero .eyebrow::before { width: 22px; }
  .m-hero h1 { font-size: 46px; line-height: .96; margin-top: 12px; }
  .m-hero p { font-size: 13.5px; line-height: 1.6; color: var(--ink2); margin-top: 12px; }
  .m-hero .btn { width: 100%; height: 52px; margin-top: 18px; font-size: 14.5px; padding: 0 8px 0 22px; justify-content: space-between; }
  .m-hero .btn .ar { width: 38px; height: 38px; }
  .m-next { padding: 22px 16px 0; }
  .m-sec { display: flex; align-items: center; }
  .m-sec .eyebrow { font-size: 9.5px; gap: 10px; }

  .m-card { margin-top: 12px; display: flex; gap: 14px; padding: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 18px 30px -24px rgba(74, 42, 28, .5); }
  .m-card .art { width: 96px; height: 118px; border-radius: 48px 48px 12px 12px; overflow: hidden; flex-shrink: 0; }
  .m-card .art svg { width: 100%; height: 100%; }
  .m-card .tb { padding-top: 10px; min-width: 0; }
  .m-card .cat { font-size: 9.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--clay); }
  .m-card h3 { font-family: var(--serif); font-size: 23px; font-weight: 600; line-height: 1.05; margin-top: 6px; }
  .m-card .mt { font-size: 12px; color: var(--ink2); margin-top: 6px; font-weight: 600; }
</style></head>
<body>
<div id="root"></div>
<script>
  const q = new URLSearchParams(location.search).get("p");
  const PAGE = ["home", "treatments", "contact", "phone"].includes(q) ? q : "home";

  // Icons (stroke icons share the .i class)

  const STAR = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8l2.7 5.9 6.4.7-4.8 4.3 1.3 6.3L12 16.8 6.4 20l1.3-6.3-4.8-4.3 6.4-.7z"/></svg>';

  const WA = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.2a9.8 9.8 0 00-8.4 14.8L2.2 21.8l4.9-1.3A9.8 9.8 0 1012 2.2zm0 1.8a8 8 0 11-4.1 14.9l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 0112 4z"/><path fill="currentColor" d="M9.1 7.3c-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.9 4.5 4 2.2.9 2.7.7 3.1.7.5 0 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3l-1.8-.9c-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.3-.1-1.1-.4-2-1.3-.8-.7-1.3-1.5-1.4-1.8-.2-.3 0-.4.1-.5l.4-.4.3-.4c.1-.2 0-.3 0-.4z"/></svg>';
  const MARK = (c = "#2A1F1A", f = "#F6EADF") => `<svg class="mk" viewBox="0 0 30 38"><path d="M1 37.5V15a14 14 0 0128 0v22.5z" fill="${c}"/>
    <path d="M15 33.5V14.5" stroke="${f}" stroke-width="1.2" stroke-linecap="round"/>

    <path d="M15 15.8c-1.7-1.5-1.9-4.2-.1-6.3 1.8 2.1 1.7 4.8.1 6.3z" fill="${f}"/></svg>`;

  // A sprig of leaves along a gently curving stem, used for line art and for soft leaf shadows.
  function sprig({ x, y, rot = 0, len = 200, n = 9, leafLen = 40, leafW = 12, ang = 40, taper = .55, curve = 16, color = "#000", mode = "fill", sw = 1.2, start = .1, tip = true }) {
    const qx = len / 2, qy = -curve, f = (v) => v.toFixed(1);
    const pt = (t) => [2 * (1 - t) * t * qx + t * t * len, 2 * (1 - t) * t * qy];
    const dir = (t) => (Math.atan2(2 * (1 - t) * qy + 2 * t * -qy, 2 * (1 - t) * qx + 2 * t * (len - qx)) * 180) / Math.PI;
    const leaf = (L, W) => `M0 0C${f(L * .22)} ${f(-W * .66)} ${f(L * .68)} ${f(-W * .62)} ${f(L)} 0C${f(L * .68)} ${f(W * .62)} ${f(L * .22)} ${f(W * .66)} 0 0Z`;
    const one = (px, py, a, L, W) => {
      const tr = `translate(${f(px)} ${f(py)}) rotate(${f(a)})`;
      return mode === "line"
        ? `<g transform="${tr}"><path d="${leaf(L, W)}"/><path d="M${f(L * .12)} 0L${f(L * .8)} 0" stroke-width="${(sw * .7).toFixed(2)}"/></g>`
        : `<path transform="${tr}" d="${leaf(L, W)}"/>`;
    };
    let s = `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0Q${qx} ${qy} ${len} 0" fill="none" stroke="${color}" stroke-width="${mode === "line" ? sw : sw * 1.6}" stroke-linecap="round"/>`;
    s += mode === "line" ? `<g fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round">` : `<g fill="${color}">`;
    for (let i = 0; i < n; i++) {
      const k = i / Math.max(1, n - 1), t = start + k * (.95 - start);
      const [px, py] = pt(t), sc = 1 - (1 - taper) * k;
      s += one(px, py, dir(t) + (i % 2 ? 1 : -1) * ang, leafLen * sc, leafW * sc);
    }
    if (tip) { const [px, py] = pt(1); s += one(px, py, dir(1), leafLen * taper * .9, leafW * taper * .9); }
    return s + "</g></g>";
  }

  // The hero still life: serum bottle, cream jar and an olive sprig on travertine plinths, with leaf shadows on a warm wall.
  function scene(k, vb = "0 0 500 780") {

      <linearGradient id="${k}rb" x1="0" x2="1"><stop offset="0" stop-color="#1C1410"/><stop offset=".36" stop-color="#55433A"/><stop offset="1" stop-color="#1E1612"/></linearGradient>
      <linearGradient id="${k}ce" x1="0" x2="1"><stop offset="0" stop-color="#D0B7A1"/><stop offset=".3" stop-color="#F5ECE2"/><stop offset=".55" stop-color="#FDF9F4"/><stop offset=".8" stop-color="#EBDCCC"/><stop offset="1" stop-color="#C6AB93"/></linearGradient>

  // Treatment pictures: one small still life per treatment, in the same warm palette.
  function citrus(k, cx, cy, R) {
    const f = (v) => v.toFixed(2), r = R * .82;
    let w = "", ln = "", ves = "";
    for (let i = 0; i < 10; i++) {
      const a0 = ((i * 36 - 90) * Math.PI) / 180, a1 = (((i + 1) * 36 - 90) * Math.PI) / 180;
      w += `<path d="M${cx} ${cy}L${f(cx + r * Math.cos(a0))} ${f(cy + r * Math.sin(a0))}A${r} ${r} 0 0 1 ${f(cx + r * Math.cos(a1))} ${f(cy + r * Math.sin(a1))}Z"/>`;
      ln += `<path d="M${cx} ${cy}L${f(cx + (r + .6) * Math.cos(a0))} ${f(cy + (r + .6) * Math.sin(a0))}"/>`;
      for (const t of [.3, .5, .7]) { const a = ((i * 36 - 90 + 36 * t) * Math.PI) / 180; ves += `<path d="M${f(cx + r * .3 * Math.cos(a))} ${f(cy + r * .3 * Math.sin(a))}L${f(cx + r * .82 * Math.cos(a))} ${f(cy + r * .82 * Math.sin(a))}"/>`; }
    }
    return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#EC9262"/><circle cx="${cx}" cy="${cy}" r="${R * .94}" fill="#F5B183"/><circle cx="${cx}" cy="${cy}" r="${R * .9}" fill="#FDECDF"/>
      <g fill="url(#${k}s)">${w}</g><g stroke="#FDECDF" stroke-width="${(R * .045).toFixed(2)}" stroke-linecap="round">${ln}</g>
      <g stroke="#fff" stroke-opacity=".3" stroke-width="${(R * .035).toFixed(2)}" stroke-linecap="round">${ves}</g><circle cx="${cx}" cy="${cy}" r="${R * .09}" fill="#FDECDF"/>`;
  }
  const ART = {
    hydra: (k, vb = "0 0 150 226", deep = false) => `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid slice"><defs>
        <linearGradient id="${k}a" x1="0" y1="0" x2="0" y2="1">${deep ? '<stop offset="0" stop-color="#D3E3DE"/><stop offset=".6" stop-color="#BFD7D0"/><stop offset="1" stop-color="#E6CFC4"/>' : '<stop offset="0" stop-color="#EDF2EF"/><stop offset=".58" stop-color="#DBE7E3"/><stop offset="1" stop-color="#F1DDD3"/>'}</linearGradient>
        <radialGradient id="${k}b" cx=".36" cy=".64" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".42" stop-color="#E9F3F0"/><stop offset="1" stop-color="#A3C6BE"/></radialGradient>

      <ellipse cx="90" cy="137" rx="9" ry="4.5" fill="#fff" opacity=".45" transform="rotate(-35 90 137)"/>
      <circle cx="75" cy="30" r="4.5" fill="url(#${k}b)"/></svg>`,
    pico: (k) => `<svg viewBox="0 0 150 226" preserveAspectRatio="xMidYMid slice"><defs>
        <linearGradient id="${k}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0DEDA"/><stop offset=".6" stop-color="#DDB9B3"/><stop offset="1" stop-color="#C99D96"/></linearGradient>
        <linearGradient id="${k}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".95"/></linearGradient>
        <radialGradient id="${k}c"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#FFF4F0" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <filter id="${k}f" x="-100%" y="-20%" width="300%" height="140%"><feGaussianBlur stdDeviation="5"/></filter></defs>
      <rect width="150" height="226" fill="url(#${k}a)"/>
      <ellipse cx="75" cy="232" rx="110" ry="50" fill="#fff" opacity=".16"/>
      <rect x="62" y="-10" width="26" height="130" fill="url(#${k}b)" opacity=".4" filter="url(#${k}f)"/>
      <rect x="73.6" y="-10" width="2.8" height="128" fill="url(#${k}b)"/>
      <circle cx="75" cy="122" r="62" fill="url(#${k}c)"/>
      <g fill="none" stroke="#fff"><circle cx="75" cy="122" r="21" stroke-opacity=".8"/><circle cx="75" cy="122" r="35" stroke-opacity=".5"/><circle cx="75" cy="122" r="51" stroke-opacity=".28"/></g>
      <circle cx="75" cy="122" r="6.5" fill="#fff"/>
